<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云迹 · 铁鸟翱天产驹资料库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --card-soft:#fbf9f4;
  --line:#ece6da; --line-2:#ddd5c4;
  --ink:#34302a; --muted:#8d8678; --muted-2:#b3ab9a;
  --green:#3f8f78; --green-soft:#eef5f1; --green-line:#d8e8e0;
  --amber:#c98a3d; --amber-soft:#fbf4e6; --amber-line:#ecdcc0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;font-size:13.5px;overflow:hidden}
.shell{display:flex;height:100vh}
/* nav */
nav{display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{display:flex;align-items:center;gap:8px;font-family:'Noto Serif SC',serif;font-weight:800;font-size:15px;letter-spacing:1px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.logo em{font-style:normal;font-family:'Noto Sans SC';font-weight:400;font-size:11px;color:var(--muted-2);margin-left:6px}
.nav-count{margin-left:auto;font-size:11.5px;color:var(--muted)}
.nav-count b{color:var(--green);font-weight:700}
/* left pane */
.pane{flex:0 0 380px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;background:var(--card-soft)}
.pane-search{padding:12px 14px;border-bottom:1px solid var(--line)}
.input{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;height:38px;transition:border-color .15s,box-shadow .15s}
.input:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(63,143,120,.12)}
.input svg{color:var(--muted-2);flex:none}
.input input{flex:1;border:none;outline:none;background:none;color:var(--ink);font:inherit;font-size:13px}
.pane-filters{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap}
.pill{font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line-2);padding:4px 13px;border-radius:999px;cursor:pointer;transition:all .12s}
.pill:hover{color:var(--ink);border-color:var(--muted-2)}
.pill.on{color:#fff;background:var(--green);border-color:var(--green);font-weight:500}
.list{flex:1;overflow-y:auto;padding:4px 10px 16px}
.item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.item:hover{background:var(--card);border-color:var(--line)}
.item.on{background:var(--card);border-color:var(--line-2);border-left:3px solid var(--green);box-shadow:0 1px 4px rgba(90,80,60,.06)}
.thumb{width:38px;height:38px;flex:none;border-radius:9px;background:var(--green-soft);border:1px solid var(--green-line);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-weight:800;color:var(--green);font-size:15px}
.it-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .cn{font-family:'Noto Serif SC',serif;font-size:14.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .jp{font-size:10.5px;color:var(--muted-2);margin-left:6px}
.item .mini{font-size:10.5px;color:var(--muted-2)}
.item .mini-t{font-size:10.5px;color:var(--muted-2);font-style:italic}
.item .b{font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);flex:none}
.item .b.m{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.item .b.f{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.pf2,.pf3{margin-top:-4px;padding-top:0}
.empty{padding:40px 10px;text-align:center;color:var(--muted-2);font-size:12.5px}
/* right pane */
.detail{flex:1;overflow-y:auto;min-width:0}
.d-inner{max-width:900px;margin:0 auto;padding:26px 30px 60px}
/* hero */
.hero{display:flex;gap:26px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.photo{width:230px;flex:none;align-self:flex-start}
.photo .frame{aspect-ratio:4/5;border-radius:12px;background:var(--green-soft);border:1.5px dashed var(--green-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.photo .frame .init{font-family:'Noto Serif SC',serif;font-size:56px;font-weight:800;color:var(--green)}
.photo .frame .tip{font-size:11px;letter-spacing:2px}
.photo .cap{margin-top:8px;text-align:center;font-size:10.5px;color:var(--muted-2);letter-spacing:1px}
.hero-main{flex:1;min-width:0}
.kicker{font-size:11px;letter-spacing:3px;color:var(--amber);font-weight:500}
.d-title{display:flex;align-items:baseline;gap:14px;margin-top:8px;flex-wrap:wrap}
.d-title h1{font-family:'Noto Serif SC',serif;font-size:34px;font-weight:800;letter-spacing:1px}
.d-title .jp{font-size:14px;color:var(--muted)}
.badges{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.badge{font-size:11.5px;padding:3px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);background:var(--card-soft)}
.badge.m{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.badge.f{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.badge.prize{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft);font-weight:700}
.sum{margin-top:16px;background:var(--green-soft);border:1px solid var(--green-line);border-radius:12px;padding:13px 16px;font-size:13px;line-height:1.95;color:#3d4a44}
/* facts */
.facts{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.f{padding:11px 15px;background:var(--card)}
.f .k{font-size:10px;color:var(--muted-2);letter-spacing:2px}
.f .v{font-size:13.5px;font-weight:600;margin-top:4px}
.f .v.jap{font-weight:400;color:var(--muted)}
.f .v a{color:var(--green);text-decoration:none}
/* pedigree */
.pedi{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.pedi h3{font-size:10px;letter-spacing:2.5px;color:var(--muted-2);margin-bottom:12px;font-weight:500}
.pedi-scroll{overflow-x:auto;padding-bottom:6px}
.pside{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:32px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:640px}
.pcell{min-width:0;background:#fff;padding:5px 10px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.pcell.m{background:#e9f1f7}
.pcell.f{background:#f8eeee}
.pcell.x{background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.02) 6px,rgba(0,0,0,.02) 12px)}
.pcell .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcell .meta{font-size:9px;color:var(--muted-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pedi-foot{margin-top:10px;font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.pedi-foot span b{color:var(--amber);font-weight:600}
.pedi-empty{margin-top:8px;font-size:12px;color:var(--muted-2)}
/* sections */
.sec{margin-top:28px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-head .n{font-size:11px;color:var(--green);border:1px solid var(--green-line);background:var(--green-soft);border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex:none}
.sec-head h2{font-size:15px;font-weight:700}
.sec-head .hint{margin-left:auto;font-size:11px;color:var(--muted-2)}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line-2);border-radius:2px}
.tl-item{position:relative;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.tl-item::before{content:"";position:absolute;left:-21px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.tl-item.date::before{background:var(--amber)}
.tl-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-label b{font-size:13px;font-weight:700}
.tl-label .tag{font-size:10.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.tl-label .tag.date{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft);font-weight:600}
.tl-body{margin-top:8px;font-size:13px;line-height:1.95;color:#4d483e;white-space:pre-line}
/* analysis */
.sbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.sbox p{font-size:13px;line-height:2.05;color:#4d483e;white-space:pre-line}
.sig{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.sig em{color:var(--amber);font-style:normal;font-weight:700}
.note{background:var(--amber-soft);border-color:var(--amber-line)}
.note p{color:#6b5736}
/* version switch + admin link */
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.ver{font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:8px;padding:4px 8px;background:var(--card);outline:none;cursor:pointer;font-family:inherit;max-width:190px}
.ver:focus{border-color:var(--green)}
.ver.hist{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.admin-link{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line-2);padding:4px 10px;border-radius:8px;white-space:nowrap}
.admin-link:hover{color:var(--green);border-color:var(--green)}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div class="shell">
  <aside class="pane">
    <nav>
      <div class="logo"><span class="dot"></span>云迹<em>铁鸟翱天产驹</em></div>
      <span class="nav-count"><b id="count">278</b> 头</span>
      <div class="nav-r">
        <select id="ver" class="ver" title="切换历史版本"></select>
        <a class="admin-link" href="dashboard.html">大盘</a>
        <a class="admin-link" href="admin.html">管理</a>
      </div>
    </nav>
    <div class="pane-search">
      <div class="input">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="搜索马名 / 译名 / 母父 / 牧场…">
      </div>
    </div>
    <div class="pane-filters">
      <button class="pill on" data-y="all">全部</button>
      <button class="pill" data-y="2023">2023年生</button>
      <button class="pill" data-y="2024">2024年生</button>
      <button class="pill" data-y="2025">2025年生</button>
    </div>
    <div class="pane-filters pf2">
      <button class="pill on" data-sx="all">性别</button>
      <button class="pill" data-sx="牡">牡</button>
      <button class="pill" data-sx="牝">牝</button>
      <button class="pill" data-sx="セ">セ</button>
    </div>
    <div class="pane-filters pf3">
      <button class="pill on" data-st="all">状态</button>
      <button class="pill" data-st="raced">已出赛</button>
      <button class="pill" data-st="unraced">未出赛</button>
      <button class="pill" data-st="graded">重赏马</button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <section class="detail" id="detail">
    <div class="d-inner" id="dinner"></div>
  </section>
</div>

<script src="data-util.js"></script>
<script src="race-ui.js"></script>
<script>
let HORSES=[],q="",y="all",sx="all",st="all",sel=null,verSel=null;
const list=document.getElementById("list"),count=document.getElementById("count"),verEl=document.getElementById("ver");
const DATE_RE=/^(\d{1,2}月\d{1,2}|2[0-9]|1[0-9]|[0-9]+\.[0-9]+)/;
function mini(h){
  const s=h.stats||{};const n=h.race_count||(h.races||[]).length;
  if(!n)return`<span class="mini-t">未出赛</span>`;
  const m=[`${n}战${s.勝||0}胜`];
  if(s.賞金合計)m.push((s.賞金合計/10000).toFixed(0)+"万");
  if(s.重賞勝ち)m.push(`重赏${s.重賞勝ち}胜`);
  return`<span class="mini">${m.join(" · ")}</span>`;
}
function parseKin(h){
  const src=String(h["近况更新/近走/牧场评价"]||h.近况||"");
  return src.split(/・/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const nl=s.indexOf("\n");
    const label=nl>=0?s.slice(0,nl).trim():s;
    const body=nl>=0?s.slice(nl+1).trim():"";
    return {label,body};
  });
}
function filtered(){
  return HORSES.filter(h=>{
    const hay=[h.馬名,h.译名,h.母名,h.母父名,h.生産牧場,h.生产牧场,h.調教師,h.管理調教師,h.馬主,h.生年月日].join(" ");
    const raced=(h.race_count||(h.races||[]).length)>0;
    const graded=(h.stats&&h.stats.重賞出走)>0;
    return (!q||hay.includes(q))
      &&(y==="all"||(h.生年||h._source)===y)
      &&(sx==="all"||h.性別===sx)
      &&(st==="all"||(st==="raced"?raced:st==="unraced"?!raced:graded));
  });
}
function renderList(){
  const hs=filtered();
  count.textContent=hs.length;
  list.innerHTML=hs.map(h=>{
    const on=h.馬名===sel?" on":"";
    const b=h.性別==="牡"?"m":"f";
    const cn=h.译名||h.馬名;
    return `<div class="item${on}" data-k="${h.馬名}">
      <span class="thumb">${esc(cn)[0]}</span>
      <span class="it-main">
        <span class="cn">${esc(cn)}</span>${h.译名?`<span class="jp">${esc(h.馬名)}</span>`:""}
        ${mini(h)}
      </span>
      <span class="b ${b}">${esc(h.性別)}</span>
    </div>`;
  }).join("")||`<div class="empty">未找到匹配的产驹</div>`;
}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderPedigree(h){
  const p=h.pedigree||{};
  const f=p.父||[],m=p.母||[];
  if(!f.length&&!m.length)return`<h3>血统 · PEDIGREE</h3><div class="pedi-empty">暂无血统数据</div>`;
  const cell=(n,g,i,off)=>{
    const rows=16/2**g;
    const rs=off+1+i*rows,re=off+1+(i+1)*rows;
    if(!n)return`<div class="pcell x" style="grid-row:${rs}/${re}"></div>`;
    const fs=g<=1?13:g===2?12:11;
    return `<div class="pcell${n.sex?` ${n.sex==="牝"?"f":"m"}`:""}" style="grid-row:${rs}/${re};font-size:${fs}px" title="${esc([n.name,n.year&&`${n.year}年生`,n.color].filter(Boolean).join(" · "))}">
      <div class="name">${esc(n.name)}</div>
      ${g<4&&(n.year||n.color)?`<div class="meta">${[n.year,n.color].filter(Boolean).join(" · ")}</div>`:""}
    </div>`;
  };
  const tree=(arr,off)=>{const out=[];for(let g=0;g<5;g++){const row=arr[g]||[];for(let i=0;i<2**g;i++)out.push(cell(row[i]||null,g,i,off));}return out.join("");};
  const foot=[] ;
  if(h.fno)foot.push(`<span><b>FNo</b> ${esc(h.fno)}</span>`);
  if(h.cross)foot.push(`<span><b>クロス</b> ${esc(h.cross)}</span>`);
  return`<h3>血统 · PEDIGREE <span style="font-weight:400;letter-spacing:0">${esc(h.馬名)} 5代血统表（可横向滚动）</span></h3>
    <div class="pedi-scroll"><div class="pside">${tree(f,0)}${tree(m,16)}</div></div>
    ${foot.length?`<div class="pedi-foot">${foot.join("")}</div>`:""}`;
}
async function renderDetail(h){
  sel=h.馬名;renderList();
  await YJ.ensureRaces(h);          // M5.4：详情页按需加载 races（v2 拆文件）
  await YJ.ensurePedigree(h);       // M5.4：详情页按需加载血统树（v2 拆文件）
  document.getElementById("detail").scrollTop=0;
  const items=parseKin(h).map(it=>{
    const isDate=DATE_RE.test(it.label);
    return `<div class="tl-item${isDate?" date":""}">
      <div class="tl-label"><b>${esc(it.label)}</b><span class="tag${isDate?" date":""}">${isDate?"近走":"来源"}</span></div>
      ${it.body?`<div class="tl-body">${esc(it.body)}</div>`:""}
    </div>`;
  }).join("")||`<div class="empty" style="padding:14px">暂无近况更新</div>`;
  const raceSec=RaceUI.section(h,1);
  document.getElementById("dinner").innerHTML=`
    <div class="hero">
      <div class="photo">
        <div class="frame"><span class="init">${esc((h.译名||h.馬名)[0])}</span><span class="tip">照片待补</span></div>
        <div class="cap">${esc(h.生産牧場||h.生产牧场)} 提供</div>
      </div>
      <div class="hero-main">
        <div class="kicker">${esc(h.生年||h._source)} 年生 · ${esc(h.登録状態||"")} ${h.馬齢?esc(h.馬齢):""}</div>
        <div class="d-title"><h1>${esc(h.译名||h.馬名)}</h1>${h.译名?`<span class="jp">${esc(h.馬名)}</span>`:""}</div>
        <div class="badges">
          ${h.性別?`<span class="badge ${h.性別==="牡"?"m":"f"}">${esc(h.性別)}</span>`:""}
          ${h.毛色?`<span class="badge">${esc(h.毛色)}</span>`:""}
          ${h.馬主?`<span class="badge">${esc(h.馬主)}</span>`:""}
          ${h.総賞金?`<span class="badge prize">${esc(h.総賞金)}万円</span>`:""}
        </div>
        ${h.通算成績?`<div class="sum">通算成绩 ${esc(h.通算成績)}${h.主な勝鞍?` · 主胜鞍 ${esc(h.主な勝鞍)}`:""}</div>`:""}
        ${RaceUI.statsHTML(h)}
      </div>
    </div>

    <div class="pedi">${renderPedigree(h)}</div>

    <div class="facts">
      <div class="f"><div class="k">生产牧场</div><div class="v jap">${esc(h.生産牧場||h.生产牧场)}</div></div>
      <div class="f"><div class="k">管理调教师</div><div class="v">${esc(h.調教師||h.管理調教師)}</div></div>
      <div class="f"><div class="k">马主</div><div class="v">${esc(h.馬主)}</div></div>
      <div class="f"><div class="k">出生年月日</div><div class="v">${esc(h.生年月日)}</div></div>
      <div class="f"><div class="k">产地</div><div class="v jap">${esc(h.産地)}</div></div>
      <div class="f"><div class="k">母 · 母父</div><div class="v">${esc(h.母名)}${h.母父名?` / ${esc(h.母父名)}`:""}</div></div>
    </div>

    ${raceSec.html}

    <div class="sec">
      <div class="sec-head"><span class="n">2</span><h2>数据源</h2><span class="hint">主源 netkeiba · 血统 netkeiba/JBIS 兜底</span></div>
      <div class="sbox note"><p>${h.nk_id?`netkeiba: <a href="https://db.netkeiba.com/horse/${esc(h.nk_id)}/" target="_blank" rel="noreferrer" style="color:var(--green)">${esc(h.nk_id)}</a>`:""}${h.jbis_id?`${h.nk_id?" · ":""}JBIS: <a href="https://www.jbis.or.jp/horse/${esc(h.jbis_id)}/pedigree/" target="_blank" rel="noreferrer" style="color:var(--green)">${esc(h.jbis_id)}</a>`:""}</p></div>
    </div>

    ${h.近况||h["近况更新/近走/牧场评价"]?`
    <div class="sec">
      <div class="sec-head"><span class="n">3</span><h2>近况更新 · 近走 · 牧场评价</h2><span class="hint">按时间倒序</span></div>
      <div class="tl">${items}</div>
    </div>`:""}

    ${h.血统分析?`
    <div class="sec">
      <div class="sec-head"><span class="n">4</span><h2>血统分析</h2><span class="hint">分析 · 钙奶</span></div>
      <div class="sbox"><p>${esc(h.血统分析)}</p></div>
    </div>`:""}

    ${h.备考?`
    <div class="sec">
      <div class="sec-head"><span class="n">5</span><h2>备考</h2></div>
      <div class="sbox note"><p>${esc(h.备考)}</p></div>
    </div>`:""}`;
  raceSec.bind(document.getElementById("race-sec"));
}
list.addEventListener("click",e=>{
  const it=e.target.closest(".item");if(!it)return;
  const h=HORSES.find(x=>x.馬名===it.dataset.k);
  if(h){renderDetail(h);history.replaceState(null,"","#"+encodeURIComponent(h.馬名));}
});document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim();renderList();});
document.querySelectorAll(".pane-filters").forEach(row=>row.addEventListener("click",e=>{
  const p=e.target.closest(".pill");if(!p)return;
  row.querySelectorAll(".pill").forEach(x=>x.classList.remove("on"));
  p.classList.add("on");
  if(p.dataset.y)y=p.dataset.y;
  if(p.dataset.sx)sx=p.dataset.sx;
  if(p.dataset.st)st=p.dataset.st;
  renderList();
}));
async function loadData(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
}
function applyData(hs,verLabel){
  // M5.4：crops v2 = {_meta,index,horses}；历史快照 v1 = 裸数组
  HORSES=(hs&&hs.horses)?hs.horses:hs;
  const keep=HORSES.find(h=>h.馬名===sel);
  sel=keep?keep.馬名:(HORSES[0]?.馬名||null);
  renderList();
  if(sel)renderDetail(HORSES.find(h=>h.馬名===sel));
  else document.getElementById("dinner").innerHTML=`<div class="empty" style="padding:80px 0">当前版本没有产驹数据</div>`;
}
(async function init(){
  let mf,hs;
  try{
    mf=await loadData("../data/manifest.json");
    hs=await loadData("../data/crops.json");
  }catch(e){
    list.innerHTML=`<div class="empty">数据加载失败（${e.message}），请通过 http 服务器访问</div>`;
    return;
  }
  try{
    const cur=mf.current||"";
    verEl.innerHTML=[
      `<option value="">当前版 (${cur})</option>`,
      ...(mf.versions||[]).filter(v=>v.id!==cur).map(v=>
        `<option value="${v.file}">历史 ${v.date} · ${v.count}匹${v.note?" · "+v.note:""}</option>`)
    ].join("");
    verEl.addEventListener("change",async()=>{
      verEl.classList.toggle("hist",!!verEl.value);
      try{
        const hs=verEl.value?await loadData("../"+verEl.value):await loadData("../data/crops.json");
        applyData(hs,verEl.value);
      }catch(e){alert("版本加载失败: "+e.message);}
    });
    applyData(hs,"");
  }catch(e){
    console.error(e);
    list.innerHTML=`<div class="empty">渲染失败：${e.message}</div>`;
  }
  const m=location.hash.slice(1);
  const hit=HORSES.find(h=>h.馬名===decodeURIComponent(m));
  if(hit){sel=hit.馬名;renderList();renderDetail(hit);}
})();
</script>
</body>
