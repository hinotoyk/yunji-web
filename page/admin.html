<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云迹 · 数据管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --card-soft:#fbf9f4;
  --line:#ece6da; --line-2:#ddd5c4;
  --ink:#34302a; --muted:#8d8678; --muted-2:#b3ab9a;
  --green:#3f8f78; --green-soft:#eef5f1; --green-line:#d8e8e0;
  --amber:#c98a3d; --amber-soft:#fbf4e6; --amber-line:#ecdcc0;
  --red:#c05c4a; --red-soft:#faf0ed; --red-line:#ecd8d2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;font-size:13.5px;overflow:hidden}
.shell{display:flex;height:100vh}
/* top */
.topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--card);z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-family:'Noto Serif SC',serif;font-weight:800;font-size:15px;letter-spacing:1px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);display:inline-block}
.logo em{font-style:normal;font-family:'Noto Sans SC';font-weight:400;font-size:11px;color:var(--muted-2);margin-left:6px}
.topbar a{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line-2);padding:4px 12px;border-radius:8px}
.topbar a:hover{color:var(--green);border-color:var(--green)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-size:12.5px;padding:5px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--muted-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#367f6a}
.btn.warn{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:3px 10px;font-size:12px}
/* status */
.status{margin-left:auto;font-size:11.5px;color:var(--muted)}
.status.dirty{color:var(--amber);font-weight:700}
/* layout */
.shell{padding-top:52px}
/* left */
.pane{flex:0 0 340px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;background:var(--card-soft)}
.pane-search{padding:12px 14px;border-bottom:1px solid var(--line)}
.input{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;height:38px}
.input:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(63,143,120,.12)}
.input svg{color:var(--muted-2);flex:none}
.input input{flex:1;border:none;outline:none;background:none;color:var(--ink);font:inherit;font-size:13px}
.pane-foot{padding:8px 14px;font-size:11px;color:var(--muted-2);border-top:1px solid var(--line)}
.list{flex:1;overflow-y:auto;padding:4px 10px 16px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.item:hover{background:var(--card);border-color:var(--line)}
.item.on{background:var(--card);border-color:var(--line-2);border-left:3px solid var(--amber);box-shadow:0 1px 4px rgba(90,80,60,.06)}
.item .cn{font-size:14px;font-weight:600;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .jp{font-size:10.5px;color:var(--muted-2);flex:none}
.item .b{font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);flex:none}
.empty{padding:40px 10px;text-align:center;color:var(--muted-2);font-size:12.5px}
/* editor */
.edit{flex:1;overflow-y:auto;min-width:0}
.e-inner{max-width:820px;margin:0 auto;padding:22px 28px 60px}
.e-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.e-head h1{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:800}
.e-head .jp{font-size:12.5px;color:var(--muted)}
.e-head .ops{margin-left:auto;display:flex;gap:6px}
.field{margin-top:16px}
.field label{display:block;font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-bottom:6px}
.field label b{color:var(--amber)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(63,143,120,.12)}
.field textarea{min-height:110px;line-height:1.8;resize:vertical;white-space:pre-wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.section-t{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--green);letter-spacing:2px;display:flex;align-items:center;gap:8px}
/* log */
.log{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:none}
.log.show{display:block}
.log h3{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.log pre{font-size:12px;line-height:1.9;color:var(--muted);white-space:pre-wrap;font-family:'Noto Sans SC'}
.log pre .ok{color:var(--green)}
.log pre .err{color:var(--red)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(52,48,42,.45);display:none;align-items:center;justify-content:center;z-index:50}
.mask.show{display:flex}
.modal{width:420px;background:var(--card);border-radius:14px;padding:22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal h2{font-size:15px;font-weight:700;margin-bottom:4px}
.modal p{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:14px}
.modal .field{margin-top:10px}
.modal .m-ops{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.al-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.al-row input{flex:1;border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font:inherit;font-size:12px;min-width:0;outline:none}
.al-row input:focus{border-color:var(--green)}
.al-row .al-tgt{flex:1.2}
.al-row .al-note{flex:1.4}
.al-row select{border:1px solid var(--line-2);border-radius:8px;padding:6px;font:inherit;font-size:12px;background:var(--card)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="dot"></span>云迹<em>数据管理</em></div>
  <a href="index.html">← 返回查看</a>
  <span class="status" id="status"></span>
  <div class="top-actions">
    <button class="btn small" id="btnAlias">别名</button>
    <button class="btn small" id="btnLocal" disabled>保存草稿</button>
    <button class="btn small" id="btnExport">导出 JSON</button>
    <button class="btn small primary" id="btnGithub" disabled>提交到 GitHub</button>
  </div>
</div>

<div class="shell">
  <aside class="pane">
    <div class="pane-search">
      <div class="input">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="搜索马名 / 译名 / 母父…">
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="pane-foot" id="paneFoot">加载中…</div>
  </aside>

  <section class="edit">
    <div class="e-inner" id="editor">
      <div class="empty" style="padding:80px 0">请选择或新建一匹产驹</div>
    </div>
  </section>
</div>

<!-- 马名别名维护 -->
<div class="mask" id="alMask">
  <div class="modal" style="width:700px">
    <h2>马名别名维护</h2>
    <p>台账马名 ↔ 仓库马名关联。动作「映射」：台账名按目标马名挂到仓库已有马；「自动建档」：台账独有马（如 Grand Warrior）自动生成档案。保存后随「提交到 GitHub」一起写入 data/aliases.json。</p>
    <div id="alRows" style="max-height:300px;overflow-y:auto;margin-top:8px"></div>
    <div class="m-ops">
      <button class="btn small" id="alAdd">+ 新增条目</button>
      <span style="flex:1"></span>
      <button class="btn" id="alClose">取消</button>
      <button class="btn primary" id="alSave">保存</button>
    </div>
  </div>
</div>

<!-- GitHub 设置 -->
<div class="mask" id="ghMask">
  <div class="modal">
    <h2>GitHub 提交设置</h2>
    <p>填写仓库信息与 token，提交时浏览器直写仓库文件，GitHub Actions 会自动重新部署。Token 仅保存在本浏览器 localStorage。</p>
    <div class="field"><label>Owner / 用户名</label><input id="ghOwner" placeholder="hinotoyk"></div>
    <div class="field"><label>仓库名</label><input id="ghRepo" placeholder="yunji-web"></div>
    <div class="field"><label>Fine-grained Token（Contents: Read and write）</label><input id="ghToken" type="password" placeholder="github_pat_..."></div>
    <div class="m-ops">
      <button class="btn" id="ghClose">取消</button>
      <button class="btn primary" id="ghSave">保存设置</button>
    </div>
  </div>
</div>

<script src="data-util.js"></script>
<script>
const KEY_FIELDS=["馬名","性別","生年月日","毛色","産地","馬主","生産牧場","調教師","母名","母父名","総賞金","登録状態","生年","n年"];
const LONG_FIELDS=[["近况更新/近走/牧场评价","近况更新 / 近走 / 牧场评价"],["血统分析","血统分析"],["备考","备考"]];
let HORSES=[],sel=null,q="",dirty=false,CR_META={},CR_INDEX=null;
const listEl=document.getElementById("list"),editor=document.getElementById("editor"),
      statusEl=document.getElementById("status"),footEl=document.getElementById("paneFoot"),
      btnLocal=document.getElementById("btnLocal"),btnGithub=document.getElementById("btnGithub");
const LS_DATA="yunji_draft_data",LS_GH="yunji_gh_cfg";

function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function setDirty(d){dirty=d;statusEl.textContent=d?"有未保存修改":"已保存";statusEl.classList.toggle("dirty",d);btnLocal.disabled=!d;btnGithub.disabled=!d;}

function filtered(){
  return HORSES.filter(h=>{
    const hay=[h.馬名,h.译名,h.母名,h.母父名,h.生産牧場,h.生产牧场,h.調教師,h.管理調教師,h.馬主,h.産地].join(" ");
    return !q||hay.includes(q);
  });
}
function renderList(){
  const hs=filtered();
  footEl.textContent=`共 ${hs.length} 匹 / 总 ${HORSES.length}`;
  listEl.innerHTML=hs.map(h=>{
    const cn=h.译名||h.馬名;
    return `<div class="item${h.馬名===sel?" on":""}" data-k="${esc(h.馬名)}">
      <span class="cn">${esc(cn)}</span>${h.译名?`<span class="jp">${esc(h.馬名)}</span>`:""}
      <span class="b">${esc(h.生年||h._source)}</span>
    </div>`;
  }).join("")||`<div class="empty">未找到匹配的产驹</div>`;
}
function renderEditor(h){
  const rows=KEY_FIELDS.map(f=>{
    if(f==="生年")return `<div class="field"><label>生年</label><select data-f="生年"><option value="2023"${h.生年==="2023"?" selected":""}>2023年生</option><option value="2024"${h.生年==="2024"?" selected":""}>2024年生</option><option value="2025"${h.生年==="2025"?" selected":""}>2025年生</option><option value=""${!h.生年?" selected":""}>—</option></select></div>`;
    if(f==="n年")return `<div class="field"><label>备注字段预留</label><input disabled value="数据来自抓取，管理页仅可补录人工字段"></div>`;
    return `<div class="field"><label>${f}${f==="馬名"?" <b>*</b>":""}</label><input data-f="${f}" value="${esc(h[f]??"")}"></div>`;
  });
  const longs=LONG_FIELDS.map(([k,label])=>`<div class="field"><label>${label}</label><textarea data-f="${k}">${esc(h[k]??"")}</textarea></div>`).join("");
  editor.innerHTML=`
    <div class="e-head">
      <h1>${esc(h.译名||h.馬名)}</h1><span class="jp">${esc(h.馬名)}</span>
      <div class="ops">
        <button class="btn small" id="btnAdd">+ 新增产驹</button>
        <button class="btn small danger" id="btnDel">删除本匹</button>
      </div>
    </div>
    <div class="section-t">基本资料</div>
    <div class="row3">${rows.slice(0,3).join("")}</div>
    <div class="row3">${rows.slice(3,6).join("")}</div>
    <div class="row3">${rows.slice(6,9).join("")}</div>
    ${rows.slice(9).join("")}
    <div class="section-t">长文资料（近况每段以「・」开头，自动生成时间线）</div>
    ${longs}
  `;
  editor.querySelectorAll("input,select,textarea").forEach(el=>el.addEventListener("input",()=>{
    const f=el.dataset.f;const cur=HORSES.find(x=>x.馬名===sel);
    if(cur){cur[f]=el.value;if(f==="馬名"&&!cur.id)cur.id=el.value;setDirty(true);}
  }));
  document.getElementById("btnAdd").addEventListener("click",addNew);
  document.getElementById("btnDel").addEventListener("click",delCur);
}
function addNew(){
  const h={id:"",馬名:"",译名:"",性別:"",生年月日:"",毛色:"",産地:"",馬主:"",生産牧場:"",調教師:"",母名:"",母父名:"","生年":"2023",登録状態:"",総賞金:"","近况更新/近走/牧场评价":"","血统分析":"",备考:""};
  HORSES.unshift(h);sel="";setDirty(true);renderList();renderEditor(h);
  statusEl.textContent="已新建空条目（记得填马名）";
}
function delCur(){
  const h=HORSES.find(x=>x.馬名===sel);if(!h)return;
  if(!confirm(`确认删除「${h.译名||h.馬名}」？`))return;
  HORSES=HORSES.filter(x=>x.馬名!==sel);sel=HORSES[0]?.馬名||null;setDirty(true);renderList();
  editor.innerHTML=`<div class="empty" style="padding:80px 0">已删除，记得保存</div>`;
  if(sel){renderList();renderEditor(HORSES.find(x=>x.馬名===sel));}
}
function pick(h){sel=h.馬名;renderList();renderEditor(h);}

listEl.addEventListener("click",e=>{
  const it=e.target.closest(".item");if(!it)return;
  pick(HORSES.find(x=>x.馬名===it.dataset.k));
});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim();renderList();});

/* ---------- 草稿 ---------- */
btnLocal.addEventListener("click",()=>{
  localStorage.setItem(LS_DATA,JSON.stringify(HORSES));
  setDirty(false);statusEl.textContent="已保存草稿（本浏览器）";
});

/* ---------- 别名维护 ---------- */
let ALIASES={},ALIAS_ROWS=[];
const btnAlias=document.getElementById("btnAlias"),alMask=document.getElementById("alMask"),alRows=document.getElementById("alRows");
function aliasRowsToObj(){
  const o={};
  ALIAS_ROWS.forEach(r=>{
    const src=r.querySelector(".al-src").value.trim();
    if(!src)return;
    const act=r.querySelector(".al-act").value;
    const tgt=r.querySelector(".al-tgt").value.trim();
    const note=r.querySelector(".al-note").value.trim();
    if(!act&&!tgt&&!note)return;
    o[src]={action:act,target:tgt,note};
  });
  return o;
}
function renderAliasRows(){
  alRows.innerHTML=ALIAS_ROWS.map(r=>`<div class="al-row">
    <input class="al-src" value="${esc(r.src)}" placeholder="台账/海外马名">
    <select class="al-act"><option value="">待确认</option><option value="map"${r.action==="map"?" selected":""}>映射</option><option value="create"${r.action==="create"?" selected":""}>自动建档</option></select>
    <input class="al-tgt" value="${esc(r.target)}" placeholder="目标马名（映射时）">
    <input class="al-note" value="${esc(r.note)}" placeholder="备注">
    <button class="btn small danger al-del">删</button>
  </div>`).join("")||`<div class="empty">暂无别名条目</div>`;
  alRows.querySelectorAll(".al-del").forEach(b=>b.addEventListener("click",()=>b.closest(".al-row").remove()));
}
btnAlias.addEventListener("click",()=>{
  ALIAS_ROWS=Object.entries(ALIASES).map(([src,v])=>({src,action:v.action||"",target:v.target||"",note:v.note||""}));
  renderAliasRows();
  alMask.classList.add("show");
});
document.getElementById("alClose").addEventListener("click",()=>alMask.classList.remove("show"));
document.getElementById("alAdd").addEventListener("click",()=>{ALIAS_ROWS.push({src:"",action:"",target:"",note:""});renderAliasRows();});
document.getElementById("alSave").addEventListener("click",()=>{
  ALIASES=aliasRowsToObj();
  setDirty(true);
  alMask.classList.remove("show");
  statusEl.textContent="别名已更新（提交时写入 data/aliases.json）";
});

/* ---------- 导出 ---------- */
document.getElementById("btnExport").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(buildCropsOut(),null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`crops_${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);
});

/* ---------- GitHub ---------- */
const ghOwner=document.getElementById("ghOwner"),ghRepo=document.getElementById("ghRepo"),ghToken=document.getElementById("ghToken");
document.getElementById("btnGithub").addEventListener("click",()=>{
  const cfg=JSON.parse(localStorage.getItem(LS_GH)||"{}");
  ghOwner.value=cfg.owner||"";ghRepo.value=cfg.repo||"";ghToken.value=cfg.token||"";
  document.getElementById("ghMask").classList.add("show");
});
document.getElementById("ghClose").addEventListener("click",()=>document.getElementById("ghMask").classList.remove("show"));
document.getElementById("ghSave").addEventListener("click",()=>{
  if(!ghOwner.value.trim()||!ghRepo.value.trim()||!ghToken.value.trim()){alert("三项都要填");return;}
  localStorage.setItem(LS_GH,JSON.stringify({owner:ghOwner.value.trim(),repo:ghRepo.value.trim(),token:ghToken.value.trim()}));
  document.getElementById("ghMask").classList.remove("show");
  commitToGithub();
});

function b64(s){
  const bytes=new TextEncoder().encode(s);
  let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
}
function ghHeaders(token){return {Authorization:`Bearer ${token}`,"X-GitHub-Api-Version":"2022-11-28",Accept:"application/vnd.github+json"};}
async function ghApi(token,owner,repo,path,method,body){
  const opt={method,headers:ghHeaders(token)};
  if(body!==undefined)opt.body=JSON.stringify(body);
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/${path}`,opt);
  if(!r.ok)throw new Error(`${method} ${path} → ${r.status}`);
  return await r.json();
}
async function ghCommitAll(token,owner,repo,files,msg){
  // files: [{path, content}] → 单次 commit（Git Data API）
  const repoInfo=await ghApi(token,owner,repo,"", "GET");
  const branch=repoInfo.default_branch||"main";
  const ref=await ghApi(token,owner,repo,`git/refs/heads/${branch}`,"GET");
  const base=ref.object.sha;
  const entries=[];
  for(const f of files){
    const blob=await ghApi(token,owner,repo,"git/blobs","POST",{content:b64(f.content),encoding:"base64"});
    entries.push({path:f.path,mode:"100644",type:"blob",sha:blob.sha});
  }
  const tree=await ghApi(token,owner,repo,"git/trees","POST",{base_tree:base,tree:entries});
  const commit=await ghApi(token,owner,repo,"git/commits","POST",{message:msg,tree:tree.sha,parents:[base]});
  await ghApi(token,owner,repo,`git/refs/heads/${branch}`,"PATCH",{sha:commit.sha,force:false});
  return branch;
}
function showLog(lines){
  const log=document.querySelector(".log");
  log.classList.add("show");
  log.querySelector("pre").innerHTML=lines.map(l=>l.ok?`<span class="ok">✔ ${esc(l.t)}</span>`:l.err?`<span class="err">✘ ${esc(l.t)}</span>`:esc(l.t)).join("\n");
  log.scrollIntoView({behavior:"smooth"});
}
/* M5.4：admin 改动人工字段后输出整份 crops v2。
 * v1 数据（旧快照裸数组）→ 包成 {_meta, index, horses}；v2 数据 → 保留 _meta、重建 index。 */
function buildCropsOut(){
  const horses=HORSES.map(h=>({...h}));
  const meta={schema:"crops/v2",built:new Date().toISOString(),count:horses.length,
              sources:(CR_META&&CR_META.sources)||{},manifest:(CR_META&&CR_META.manifest)||""};
  const index=YJ.rebuildIndex(horses);
  return {_meta:meta,index,horses};
}
async function commitToGithub(){
  const cfg=JSON.parse(localStorage.getItem(LS_GH)||"{}");
  if(!cfg.owner||!cfg.repo||!cfg.token){alert("请先配置 GitHub");return;}
  btnGithub.disabled=true;
  const ts=new Date(),id=`${String(ts.getFullYear())}${String(ts.getMonth()+1).padStart(2,"0")}${String(ts.getDate()).padStart(2,"0")}_${String(ts.getHours()).padStart(2,"0")}${String(ts.getMinutes()).padStart(2,"0")}${String(ts.getSeconds()).padStart(2,"0")}`;
  const msg=`云迹数据更新 ${ts.toLocaleString("zh-CN")} (${HORSES.length}匹)`;
  const lines=[];
  try{
    // 构造 manifest（客户端维护，最多保留 30 个版本）
    let mf={current:id,versions:[]};
    try{
      const r=await fetch("../data/manifest.json");if(r.ok)mf=await r.json();
    }catch(e){}
    mf.versions=[{id,file:`history/${id}.json`,date:ts.toLocaleString("zh-CN"),count:HORSES.length,note:"管理页提交"}].concat(mf.versions.filter(v=>v.id!==id&&v.id!==mf.current));
    mf.versions=mf.versions.slice(0,30);
    mf.current=id;
    // 单次 commit 写入文件（crops v2 + 快照 + manifest + aliases）
    const cropsOut=buildCropsOut();
    const files=[
      {path:"data/crops.json",content:JSON.stringify(cropsOut,null,2)},
      {path:`history/${id}.json`,content:JSON.stringify(HORSES,null,2)},
      {path:"data/manifest.json",content:JSON.stringify(mf,null,2)},
      {path:"data/aliases.json",content:JSON.stringify(ALIASES,null,2)}
    ];
    const branch=await ghCommitAll(cfg.token,cfg.owner,cfg.repo,files,msg);
    lines.push({t:`已提交 1 个 commit（branch: ${branch}）· crops.json（${HORSES.length} 匹）+ 快照 + manifest + aliases`,ok:true});
    setDirty(false);
    lines.push({t:`完成。GitHub Actions 将自动部署（约 1 分钟内生效），可在仓库 Actions 页查看进度。`,ok:true});
  }catch(e){
    lines.push({t:`提交失败：${e.message}（可先「导出 JSON」手动提交，或重新保存设置后重试）`,err:true});
  }
  btnGithub.disabled=false;
  showLog(lines);
}

/* ---------- 初始化 ---------- */
(async function init(){
  try{
    const {horses,meta,index}=await YJ.loadCrops("../data/crops.json");   // M5.4：兼容 v1/v2
    HORSES=horses;CR_META=meta;CR_INDEX=index;
  }catch(e){
    listEl.innerHTML=`<div class="empty">数据加载失败（${e.message}）</div>`;
    return;
  }
  // 若有草稿则提示可恢复
  const draft=localStorage.getItem(LS_DATA);
  footEl.textContent=`共 ${HORSES.length} 匹${draft?" · 有本地草稿":""}`;
  // 加载别名表
  try{const ar=await fetch("../data/aliases.json");if(ar.ok)ALIASES=await ar.json();}catch(e){}
  renderList();
  sel=HORSES[0]?.馬名||null;
  if(sel)renderEditor(HORSES.find(x=>x.馬名===sel));
  const cfg=JSON.parse(localStorage.getItem(LS_GH)||"{}");
  if(cfg.owner)statusEl.textContent="已配置 GitHub（"+cfg.owner+"/"+cfg.repo+"）";
})();
</script>
