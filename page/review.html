<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云迹 · 比赛差异审核</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --card-soft:#fbf9f4;
  --line:#ece6da; --line-2:#ddd5c4;
  --ink:#34302a; --muted:#8d8678; --muted-2:#b3ab9a;
  --green:#3f8f78; --green-soft:#eef5f1; --green-line:#d8e8e0;
  --amber:#c98a3d; --amber-soft:#fbf4e6; --amber-line:#ecdcc0;
  --red:#b0563f; --red-soft:#faf0ed; --red-line:#ecd8d2;
  --blue:#1a6fb5; --blue-soft:#eaf2fa; --blue-line:#cfe0f2;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;font-size:13.5px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-family:'Noto Serif SC',serif;font-weight:800;font-size:15px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);display:inline-block}
.logo em{font-style:normal;font-family:'Noto Sans SC';font-weight:400;font-size:11px;color:var(--muted-2);margin-left:6px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--card-soft);border:1px solid var(--line);border-radius:9px;padding:4px 12px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink);font-size:13px}
.stat.pending b{color:var(--amber)}
.stat.done b{color:var(--green)}
.stat.ignored b{color:var(--muted-2)}
.btn{font-size:12.5px;padding:6px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--muted-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.layout{display:flex;min-height:calc(100vh - 57px)}
aside{flex:0 0 250px;border-right:1px solid var(--line);background:var(--card-soft);padding:14px 12px;overflow-y:auto}
aside h3{font-size:11px;color:var(--muted-2);letter-spacing:2px;margin:10px 0 8px}
.cat{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;border:1px solid transparent;margin-bottom:2px}
.cat:hover{background:var(--card)}
.cat.on{background:var(--card);border-color:var(--line-2);font-weight:600}
.cat .n{margin-left:auto;font-size:11px;color:var(--muted-2);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.cat.pending .n{color:var(--amber);border-color:var(--amber-line)}
main{flex:1;padding:18px 24px 60px;overflow-y:auto;min-width:0}
.banner{background:var(--blue-soft);border:1px solid var(--blue-line);color:#234a6b;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.8}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.sec-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-head h2{font-size:14px;font-weight:700}
.sec-head .tag{font-size:10.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted)}
.sec-head .ops{margin-left:auto;display:flex;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:12.5px}
.row:last-child{border-bottom:none}
.row:hover{background:#fbf9f4}
.row.done{opacity:.55}
.row.ignored{opacity:.4}
.rk{font-family:Consolas,Menlo,monospace;font-size:11px;color:var(--muted-2);min-width:170px}
.rk b{color:var(--ink)}
.fld{font-size:11px;background:var(--card-soft);border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);flex:none}
.val{display:flex;align-items:center;gap:6px;flex:1;min-width:220px;flex-wrap:wrap}
.val .lbl{font-size:10px;color:var(--muted-2)}
.val .box{background:var(--card-soft);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px}
.val .box.a{background:var(--green-soft);border-color:var(--green-line)}
.val .box.b{background:var(--blue-soft);border-color:var(--blue-line)}
.val .arrow{color:var(--muted-2)}
.dec{display:flex;gap:5px;flex:none}
.dec button{font-size:11.5px;padding:3px 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-family:inherit;color:var(--muted)}
.dec button:hover{border-color:var(--muted-2);color:var(--ink)}
.dec button.on-ledger{background:var(--green);border-color:var(--green);color:#fff}
.dec button.on-netkeiba{background:var(--blue);border-color:var(--blue);color:#fff}
.dec button.on-custom{background:var(--amber);border-color:var(--amber);color:#fff}
.dec button.on-ignore{background:var(--muted-2);border-color:var(--muted-2);color:#fff}
.dec input{width:90px;border:1px solid var(--line-2);border-radius:6px;padding:3px 7px;font:inherit;font-size:11.5px}
.empty{padding:50px;text-align:center;color:var(--muted-2)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;background:var(--green);transition:width .2s}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>云迹<em>比赛差异审核</em></div>
  <div class="stats">
    <span class="stat">总差异 <b id="stTotal">0</b></span>
    <span class="stat pending">待审 <b id="stPending">0</b></span>
    <span class="stat done">已裁决 <b id="stDone">0</b></span>
    <span class="stat ignored">已忽略 <b id="stIgnored">0</b></span>
  </div>
  <button class="btn" id="btnExport">导出裁决 JSON</button>
  <button class="btn warn" id="btnClear">清空本地裁决</button>
</header>
<div class="layout">
  <aside>
    <h3>视图</h3>
    <div class="cat on" data-f="all">全部 <span class="n" id="nAll">0</span></div>
    <div class="cat" data-f="pending">仅待审 <span class="n" id="nPending">0</span></div>
    <h3>类别</h3>
    <div id="cats"></div>
  </aside>
  <main>
    <div class="banner">数据源：<b>台账</b>（Google Sheets，主）vs <b>netkeiba</b>（成绩页，校验参照）。逐条或按类批量裁决，最终以你确认的为准。裁决保存在本浏览器，点「导出裁决 JSON」下载后提交入库。</div>
    <div id="content"><div class="empty">加载中…</div></div>
  </main>
</div>

<script>
const LS_KEY="yunji_review_decisions";
let DIFFS=[],DEC={},view="all",catFilter=null;

/* 分类（与 compare-races.py 的汇总口径一致） */
function classify(x){
  if(x.field==="__row__") return "行级差异（场次对不上）";
  if(x.field==="騎手") return "骑手（netkeiba 截断外籍名）";
  if(x.field==="レース名"){
    const l=String(x.ledger||""),n=String(x.netkeiba||"");
    if(l.startsWith("メイクデビュー")&&n==="2歳新馬") return "命名惯例：メイクデビュー / 2歳新馬";
    if(n.includes("(")&&!l.includes("(")) return "命名惯例：赛名带 (L) 后缀";
    return "レース名：其他";
  }
  return "数值类（赏金/头数/天气等）";
}
const CATS=["行级差异（场次对不上）","骑手（netkeiba 截断外籍名）","命名惯例：メイクデビュー / 2歳新馬","命名惯例：赛名带 (L) 后缀","レース名：其他","数值类（赏金/头数/天气等）"];

function keyOf(x){return x.馬名+"#"+x.race_key+"#"+x.field;}
function decOf(x){return DEC[keyOf(x)];}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function fmt(v){return v===null||v===undefined||v===""?"—":esc(v);}

function refreshStats(){
  const pending=DIFFS.filter(x=>!decOf(x)||decOf(x).action==="pending").length;
  const done=DIFFS.filter(x=>decOf(x)&&decOf(x).action!=="ignore"&&decOf(x).action!=="pending").length;
  const ignored=DIFFS.filter(x=>decOf(x)&&decOf(x).action==="ignore").length;
  stTotal.textContent=DIFFS.length;stPending.textContent=pending;stDone.textContent=done;stIgnored.textContent=ignored;
  nAll.textContent=DIFFS.length;nPending.textContent=pending;
}

function renderCats(){
  const cnt={};DIFFS.forEach(x=>{const c=classify(x);cnt[c]=(cnt[c]||0)+1;});
  cats.innerHTML=CATS.map(c=>`<div class="cat" data-c="${esc(c)}">${esc(c)} <span class="n">${cnt[c]||0}</span></div>`).join("");
  cats.querySelectorAll(".cat").forEach(el=>el.onclick=()=>{
    cats.querySelectorAll(".cat").forEach(x=>x.classList.remove("on"));
    el.classList.add("on");catFilter=el.dataset.c;render();
  });
}

function visible(){
  return DIFFS.filter(x=>{
    if(catFilter&&classify(x)!==catFilter)return false;
    if(view==="pending"){const d=decOf(x);return !d||d.action==="pending";}
    return true;
  });
}

function decide(x,action,value){
  DEC[keyOf(x)]={action,value:value??"",ts:new Date().toISOString().slice(0,16).replace("T"," ")};
  localStorage.setItem(LS_KEY,JSON.stringify(DEC));
  refreshStats();render();
}

function rowHTML(x){
  const d=decOf(x);
  const cls=d&&d.action==="ignore"?"ignored":d&&d.action!=="pending"?"done":"";
  const isRow=x.field==="__row__";
  const decBtns=isRow?`<button class="btn-ignore" onclick="decideRow('${keyOf(x)}','ledger')">以台账为准</button><button onclick="decideRow('${keyOf(x)}','netkeiba')">以netkeiba为准</button>`
    :`<button class="${d&&d.action==="ledger"?"on-ledger":""}" onclick="decideRow('${keyOf(x)}','ledger')">台账</button>
      <button class="${d&&d.action==="netkeiba"?"on-netkeiba":""}" onclick="decideRow('${keyOf(x)}','netkeiba')">网</button>
      <button class="${d&&d.action==="custom"?"on-custom":""}" onclick="decideRow('${keyOf(x)}','custom')">自定义</button>
      <input placeholder="自定义值" value="${esc(d&&d.action==="custom"?d.value:"")}" onchange="customVal('${keyOf(x)}',this.value)">
      <button class="${d&&d.action==="ignore"?"on-ignore":""}" onclick="decideRow('${keyOf(x)}','ignore')">忽略</button>`;
  return `<div class="row ${cls}" data-k="${keyOf(x)}">
    <span class="rk">${esc(x.馬名)}<br><b>${esc(x.race_key)}</b></span>
    <span class="fld">${isRow?"场次":esc(x.field)}</span>
    <span class="val">
      <span class="lbl">台账</span><span class="box a">${isRow?fmt(x.ledger):fmt(x.ledger)}</span>
      <span class="arrow">↔</span>
      <span class="lbl">netkeiba</span><span class="box b">${isRow?fmt(x.netkeiba):fmt(x.netkeiba)}</span>
    </span>
    <span class="dec">${decBtns}</span>
  </div>`;
}

function render(){
  const vs=visible();
  content.innerHTML=vs.length?vs.map(rowHTML).join(""):`<div class="empty">当前视图无差异</div>`;
  refreshStats();
}

/* 全局暴露给 inline onclick */
function decideRow(k,action){
  const x=DIFFS.find(d=>keyOf(d)===k);
  if(x&&action==="ignore"){decide(x,"ignore");return;}
  if(x)decide(x,action);
}
function customVal(k,v){
  const x=DIFFS.find(d=>keyOf(d)===k);
  if(x)decide(x,"custom",v);
}

/* 批量 */
function batch(cat,action){
  const xs=DIFFS.filter(x=>classify(x)===cat);
  xs.forEach(x=>decide(x,action));
}
function renderSecHead(cat){
  const n=DIFFS.filter(x=>classify(x)===cat).length;
  return `<div class="sec-head"><h2>${esc(cat)}</h2><span class="tag">${n} 条</span>
    <span class="ops">
      <button class="btn" onclick="batch('${cat.replace(/'/g,"\\'")}','ledger')">全部以台账为准</button>
      <button class="btn" onclick="batch('${cat.replace(/'/g,"\\'")}','netkeiba')">全部以netkeiba为准</button>
      <button class="btn warn" onclick="batch('${cat.replace(/'/g,"\\'")}','ignore')">全部忽略</button>
    </span></div>`;
}

/* 覆盖 render：按类别分区块（保留视图过滤） */
function render(){
  const vs=visible();
  if(!vs.length){content.innerHTML=`<div class="empty">当前视图无差异</div>`;refreshStats();return;}
  content.innerHTML=CATS.filter(c=>vs.some(x=>classify(x)===c)).map(c=>{
    const rows=vs.filter(x=>classify(x)===c);
    return `<div class="sec">${renderSecHead(c)}${rows.map(rowHTML).join("")}</div>`;
  }).join("");
  refreshStats();
}

document.querySelectorAll("aside .cat[data-f]").forEach(el=>el.onclick=()=>{
  document.querySelectorAll("aside .cat[data-f]").forEach(x=>x.classList.remove("on"));
  el.classList.add("on");view=el.dataset.f;render();
});
document.getElementById("btnExport").addEventListener("click",()=>{
  const out=DIFFS.map(x=>{const d=decOf(x);return {...x,action:d?d.action:"pending",resolved:d&&d.value!==""?d.value:null};});
  const blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`race-diffs_decided_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);
});
document.getElementById("btnClear").addEventListener("click",()=>{
  if(!confirm("清空本浏览器的全部裁决记录？"))return;
  DEC={};localStorage.removeItem(LS_KEY);render();
});

(async function init(){
  try{
    const r=await fetch("../data/race-diffs.json");
    if(!r.ok)throw new Error("HTTP "+r.status);
    DIFFS=await r.json();
  }catch(e){content.innerHTML=`<div class="empty">加载失败：${e.message}（请通过 http 服务器访问）</div>`;return;}
  try{DEC=JSON.parse(localStorage.getItem(LS_KEY)||"{}");}catch(e){DEC={};}
  renderCats();render();
})();
</script>
</body>
</html>
