<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据大盘 · 云迹 · 铁鸟翱天产驹资料库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --card-soft:#fbf9f4;
  --line:#ece6da; --line-2:#ddd5c4;
  --ink:#34302a; --muted:#8d8678; --muted-2:#b3ab9a;
  --green:#3f8f78; --green-soft:#eef5f1; --green-line:#d8e8e0;
  --amber:#c98a3d; --amber-soft:#fbf4e6; --amber-line:#ecdcc0;
  --blue:#1a6fb5; --blue-soft:#e3f0fb;
  --red:#b02a2a; --red-soft:#fbe7e7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;font-size:13.5px;min-height:100vh}
a{text-decoration:none}
/* nav */
nav{display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-family:'Noto Serif SC',serif;font-weight:800;font-size:15px;letter-spacing:1px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.logo em{font-style:normal;font-family:'Noto Sans SC';font-weight:400;font-size:11px;color:var(--muted-2);margin-left:6px}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-link{font-size:12.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:8px;padding:5px 12px;background:var(--card);transition:all .12s}
.nav-link:hover{color:var(--green);border-color:var(--green)}
.nav-link.on{color:#fff;background:var(--green);border-color:var(--green);font-weight:500}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
h1.pg{font-family:'Noto Serif SC',serif;font-size:20px;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.sub b{color:var(--green)}
/* KPI 汇总 */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:22px;font-weight:800;font-family:'Noto Serif SC',serif}
.kpi .v.good{color:var(--green)} .kpi .v.amber{color:var(--amber)} .kpi .v.blue{color:var(--blue)}
.kpi .k{font-size:10.5px;color:var(--muted-2);margin-top:3px;letter-spacing:1px}
/* 布局：左侧筛选 + 右侧结果 */
.dash{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto}
.filters h3{font-size:12px;color:var(--muted);letter-spacing:1px;margin:14px 0 8px}
.filters h3:first-child{margin-top:0}
.fchip{display:flex;align-items:center;gap:8px;padding:5px 10px;margin-bottom:4px;border:1px solid var(--line-2);border-radius:8px;background:var(--card-soft);cursor:pointer;font-size:12px;color:var(--ink);transition:all .1s}
.fchip:hover{border-color:var(--muted-2)}
.fchip.on{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:500}
.fchip .n{font-size:10px;color:var(--muted-2);margin-left:auto;font-variant-numeric:tabular-nums}
.fchip.on .n{color:var(--green)}
.fchip .x{color:var(--muted-2);font-size:10px}
.fclear{display:block;width:100%;margin-top:6px;padding:6px 0;border:1px dashed var(--line-2);border-radius:8px;background:none;color:var(--muted);font:inherit;font-size:11.5px;cursor:pointer}
.fclear:hover{color:var(--red);border-color:var(--red)}
/* 结果 */
.results{min-width:0}
.res-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.res-head .cnt{font-size:13px;color:var(--muted)}
.res-head .cnt b{color:var(--green);font-size:16px}
.res-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .12s}
.hcard:hover{border-color:var(--green-line);box-shadow:0 2px 8px rgba(63,143,120,.08);transform:translateY(-1px)}
.hcard .cn{font-family:'Noto Serif SC',serif;font-size:14.5px;font-weight:600}
.hcard .jp{font-size:10.5px;color:var(--muted-2);margin-left:6px}
.hcard .meta{font-size:11px;color:var(--muted);margin-top:4px}
.hcard .tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);margin-right:5px;margin-top:6px}
.hcard .tag.good{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted-2);font-size:12.5px;padding:40px 0}
/* 汇总分布条 */
.dist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}
.dist h2{font-size:13px;font-family:'Noto Serif SC',serif;margin-bottom:12px}
.drow{margin-bottom:8px}
.drow .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}
.drow .lbl b{color:var(--ink)}
.dbar{height:9px;background:var(--card-soft);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--green);border-radius:99px}
footer{margin-top:30px;padding:18px 0;text-align:center;color:var(--muted-2);font-size:11.5px;border-top:1px solid var(--line)}
@media(max-width:820px){.dash{grid-template-columns:1fr}.filters{position:static;max-height:none}.kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<nav>
  <div class="logo"><span class="dot"></span>云迹<em>数据大盘</em></div>
  <div class="nav-r">
    <a class="nav-link" href="index.html">列表</a>
    <a class="nav-link on" href="dashboard.html">大盘</a>
    <a class="nav-link" href="admin.html">管理</a>
  </div>
</nav>

<div class="wrap">
  <h1 class="pg">产驹数据大盘</h1>
  <div class="sub" id="sub">加载中…</div>

  <div class="kpis" id="kpis"></div>

  <div class="dash">
    <aside class="filters" id="filters"></aside>
    <section class="results">
      <div class="res-head"><span class="cnt">共 <b id="cnt">0</b> 匹</span></div>
      <div class="res-list" id="list"></div>
    </section>
  </div>

  <div class="dist" id="dist"></div>
</div>

<footer>云迹 · 数据仅供分享交流，严禁用于赌博或违法行为</footer>

<script src="data-util.js"></script>
<script>
(function(){
"use strict";
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
let HORSES=[],INDEX={},META={};
const active={};   // {字段: [值,…]} 当前激活的分面
let cur="all";     // 场次筛选 all/raced/unraced/graded

/* 分面字段定义：字段名 → 展示标题（来自 _meta.index；缺失则回退扫描 horses） */
const FACET_FIELDS=["性別","登録状態","調教師","馬主","生産牧場","騎手","場名","格","主要場地","fno","生年"];

function norm(v){return String(v??"").normalize("NFKC").replace(/\s+/g,"").toLowerCase();}

function initFacets(){
  // 有 _meta.index 直接用；否则（v1 或 index 空）扫描 horses 补全
  if(INDEX&&Object.keys(INDEX).length){
    FACET_FIELDS.forEach(f=>{
      if(!INDEX[f])delete INDEX[f];
    });
    return;
  }
  INDEX={};
  FACET_FIELDS.forEach(f=>{INDEX[f]={};});
  HORSES.forEach(h=>{
    const id=h.id;
    const put=(field,val)=>{const v=norm(val);if(v){(INDEX[field]=INDEX[field]||{})[v]=(INDEX[field][v]||[]);if(!INDEX[field][v].includes(id))INDEX[field][v].push(id);}};
    FACET_FIELDS.forEach(f=>{
      if(Array.isArray(h[f]))h[f].forEach(v=>put(f,v));
      else if(h[f])put(f,h[f]);
    });
  });
}

function matches(h,excludeField){
  if(cur==="raced"&&!h.race_count)return false;
  if(cur==="unraced"&&h.race_count)return false;
  if(cur==="graded"&&!(h.stats&&h.stats.重賞出走))return false;
  return Object.keys(active).every(field=>{
    if(field===excludeField)return true;   // 计数时不排除自身字段，保证"点选后剩余"直觉
    const vals=active[field];
    if(!vals||!vals.length)return true;
    const f=h.facet||{};
    const got=(f[field]!=null?f[field]:h[field]);
    const arr=Array.isArray(got)?got:[got];
    const nfArr=arr.map(v=>norm(v));
    return vals.some(v=>nfArr.includes(v));
  });
}

function facetCounts(field){
  // 该字段各值下"匹配其他已激活分面"的匹数（自身字段未激活时全计）
  const idx=INDEX[field]||{};
  const out={};
  Object.keys(idx).forEach(v=>{
    out[v]=idx[v].filter(id=>{
      const h=HORSES.find(x=>x.id===id);
      return h&&matches(h,field);
    }).length;
  });
  return out;
}

function renderFilters(){
  const el=document.getElementById("filters");
  let html=`<h3>出赛</h3>
    <div class="fchip${cur==="all"?" on":""}" data-cur="all"><span>全部</span><span class="n">${HORSES.length}</span></div>
    <div class="fchip${cur==="raced"?" on":""}" data-cur="raced"><span>已出赛</span><span class="n">${HORSES.filter(h=>h.race_count).length}</span></div>
    <div class="fchip${cur==="unraced"?" on":""}" data-cur="unraced"><span>未出赛</span><span class="n">${HORSES.filter(h=>!h.race_count).length}</span></div>
    <div class="fchip${cur==="graded"?" on":""}" data-cur="graded"><span>重赏马</span><span class="n">${HORSES.filter(h=>h.stats&&h.stats.重賞出走).length}</span></div>`;
  FACET_FIELDS.forEach(field=>{
    const counts=facetCounts(field);
    const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12);
    if(!entries.length)return;
    html+=`<h3>${field}</h3>`;
    entries.forEach(([v,c])=>{
      const on=(active[field]||[]).includes(v);
      html+=`<div class="fchip${on?" on":""}" data-field="${field}" data-val="${esc(v)}"><span>${esc(v)}</span><span class="n">${c}</span></div>`;
    });
    if(active[field]&&active[field].length){
      html+=`<button class="fclear" data-clr="${field}">✕ 清除${field}</button>`;
    }
  });
  html+=`<button class="fclear" data-clr="all" style="margin-top:12px">✕ 清除全部筛选</button>`;
  el.innerHTML=html;
  el.querySelectorAll(".fchip").forEach(c=>c.addEventListener("click",()=>{
    if(c.dataset.cur){cur=c.dataset.cur;render();return;}
    const field=c.dataset.field,val=c.dataset.val;
    if((active[field]||[]).includes(val))active[field]=active[field].filter(x=>x!==val);
    else (active[field]=active[field]||[]).push(val);
    render();
  }));
  el.querySelectorAll(".fclear").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.clr;
    if(k==="all"){Object.keys(active).forEach(f=>delete active[f]);cur="all";}
    else delete active[k];
    render();
  }));
}

function renderKpis(){
  const n=HORSES.length;
  const raced=HORSES.filter(h=>h.race_count).length;
  const wins=HORSES.reduce((a,h)=>a+((h.stats&&h.stats.勝)||0),0);
  const prize=HORSES.reduce((a,h)=>a+((h.stats&&h.stats.賞金合計)||0),0);
  const shutoku=HORSES.reduce((a,h)=>a+((h.stats&&h.stats.収得賞金&&h.stats.収得賞金.平地)||0),0);
  const graded=HORSES.filter(h=>h.stats&&h.stats.重賞出走).length;
  const gwin=HORSES.filter(h=>h.stats&&h.stats.重賞勝ち).length;
  const card=(v,k,c)=>`<div class="kpi"><div class="v ${c||""}">${v}</div><div class="k">${k}</div></div>`;
  document.getElementById("kpis").innerHTML=
    card(n,"收录产驹")+
    card(raced,"已出赛","good")+
    card(wins,"累计胜利","good")+
    card((prize/10000).toFixed(0)+"万","赏金合计(円)","amber")+
    card((shutoku/10000).toFixed(0)+"万","収得赏金(平地)","blue")+
    card(gwin+" / "+graded,"重赏胜 / 重赏马","amber");
}

function renderDist(){
  // 数值分布：直接扫描当前筛选后的 stats（赏金/収得），不能用枚举 index
  const hs=HORSES.filter(matches);
  const prizeBins={};
  const shutokuBins={};
  hs.forEach(h=>{
    const p=(h.stats&&h.stats.賞金合計)||0;
    const s=(h.stats&&h.stats.収得賞金&&h.stats.収得賞金.平地)||0;
    const pbin=p>=100000000?9:Math.min(8,Math.floor(p/10000000));
    const sbin=s>=100000000?9:Math.min(8,Math.floor(s/10000000));
    prizeBins[pbin]=(prizeBins[pbin]||0)+1;
    shutokuBins[sbin]=(shutokuBins[sbin]||0)+1;
  });
  const plbl={0:"<1千万",1:"1-2千万",2:"2-3千万",3:"3-4千万",4:"4-5千万",5:"5-6千万",6:"6-7千万",7:"7-8千万",8:"8千万-1亿",9:"≥1亿"};
  const render=(title,bins,total)=>Object.keys(bins).sort((a,b)=>a-b).map(k=>{
    const pct=total?Math.round(bins[k]/total*100):0;
    const max=Math.max(...Object.values(bins));
    return `<div class="drow"><div class="lbl"><span>${plbl[k]||k}</span><b>${bins[k]}匹 (${pct}%)</b></div><div class="dbar"><i style="width:${max?Math.round(bins[k]/max*100):0}%"></i></div></div>`;
  }).join("");
  const el=document.getElementById("dist");
  el.innerHTML=`<h2>赏金分布（当前筛选 ${hs.length} 匹）</h2>${render("prize",prizeBins,hs.length)||'<div class="empty">无数据</div>'}
    <h2 style="margin-top:18px">収得赏金分布（平地）</h2>${render("shutoku",shutokuBins,hs.length)||'<div class="empty">无数据</div>'}`;
}

function render(){
  const hs=HORSES.filter(matches);
  document.getElementById("cnt").textContent=hs.length;
  document.getElementById("list").innerHTML=hs.slice(0,60).map(h=>{
    const s=h.stats||{};
    const chip=s.賞金合計?`<span class="tag">${(s.賞金合計/10000).toFixed(0)}万</span>`:"";
    const gchip=s.重賞勝ち?`<span class="tag good">重赏${s.重賞勝ち}胜</span>`:"";
    return `<div class="hcard" data-k="${esc(h.馬名)}">
      <span class="cn">${esc(h.译名||h.馬名)}</span>${h.译名?`<span class="jp">${esc(h.馬名)}</span>`:""}
      <div class="meta">${h.生年||"?"}年生 · ${h.性別||"?"} · ${h.調教師||"—"}</div>
      ${h.race_count?`<span class="tag">${h.race_count}战 ${s.勝||0}胜</span>`:""}${chip}${gchip}
    </div>`;
  }).join("")||`<div class="empty">当前筛选无匹配产驹</div>`;
  document.getElementById("list").querySelectorAll(".hcard").forEach(c=>c.addEventListener("click",()=>{
    location.href="detail.html#"+encodeURIComponent(c.dataset.k);
  }));
  renderFilters();
  renderDist();
}

(async function init(){
  try{
    const {horses,meta,index}=await YJ.loadCrops("../data/crops.json");
    HORSES=horses;META=meta;INDEX=index;
  }catch(e){
    document.getElementById("sub").innerHTML="数据加载失败："+e.message;
    return;
  }
  initFacets();
  document.getElementById("sub").innerHTML=`数据源 ${META.schema||"crops/v1"} · 构建 ${META.built||"—"} · manifest ${META.manifest||"—"} · 收录 <b>${HORSES.length}</b> 匹`;
  renderKpis();
  render();
})();
})();
</script>
</body>
</html>
