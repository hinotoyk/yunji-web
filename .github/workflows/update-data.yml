name: update-data

# 数据自动更新（data/ 数据仓库模式：跑完有变化就 commit+push，触发 Pages 部署由仓库其它流程负责）
# 前置要求：仓库 Settings → Actions → Workflow permissions → 勾选 "Read and write permissions"
on:
  schedule:
    - cron: '0 22 * * *'          # 每天 UTC 22:00（北京时间 06:00）跑 CI 全自动
  workflow_dispatch:              # 手动触发：可选更新策略
    inputs:
      strategy:
        description: 更新策略
        required: true
        default: 'ci'
        type: choice
        options:
          - ci            # 基本增量 + 比赛增量 + 校验 + 提交
          - basic         # 只更新基本数据
          - races         # 只更新比赛数据
          - races-force   # 比赛全量刷新（历史数据修正）
          - check         # 只校验（报告不一致项）
          - ledger        # 仅台账海外并入
          - init          # 初始化：删空 data/ 从 0 全量
          - horse         # 定向更新指定 id 的马
      year:
        description: 建档年份（basic / ci 用，逗号分隔，如 2025,2026）
        required: false
        type: string
        default: ''
      since:
        description: 时段增量天数（races 用，只抓最近 N 天出赛的马）
        required: false
        type: number
        default: 7
      horse_ids:
        description: 定向 id（horse 用，逗号分隔）
        required: false
        type: string
        default: ''
      fix_check:
        description: check 后自动补跑修复（check 用）
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180          # 初始化全量最长约 1.5~2 小时
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml

      - name: 组装策略参数
        id: args
        run: |
          S="${{ inputs.strategy }}"
          CMD=""
          case "$S" in
            ci)         CMD="--ci" ;;
            basic)      CMD="--basic" ;;
            races)      CMD="--races" ;;
            races-force) CMD="--races-force" ;;
            check)      CMD="--check" ;;
            ledger)     CMD="--ledger" ;;
            init)       CMD="--init" ;;
            horse)      CMD="--horse ${{ inputs.horse_ids }}" ;;
          esac
          [ -n "${{ inputs.year }}" ] && [ "$S" = "basic" -o "$S" = "ci" ] && CMD="$CMD --year ${{ inputs.year }}"
          [ "${{ inputs.since }}" != "0" ] && [ "$S" = "races" ] && CMD="$CMD --since ${{ inputs.since }}"
          [ "${{ inputs.fix_check }}" = "true" ] && [ "$S" = "check" ] && CMD="$CMD --fix"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: 运行更新
        run: python run_update.py ${{ steps.args.outputs.cmd }}

      - name: 提交数据（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: auto update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "::notice::data/ 已更新并推送"
          else
            echo "::notice::data/ 无变化，跳过提交"
          fi

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log-${{ github.run_id }}
          path: test-logs/
          retention-days: 14
