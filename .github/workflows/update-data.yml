name: Sync yunji data

on:
  # 每日 JST 07:00（UTC 22:00）：新马/改名对账（--new）→ 台账 → netkeiba 成绩 → 重建。
  # 每周日 JST 11:00（UTC 02:00）：netkeiba 血统/クロス（--ped）+ JBIS 兜底补填（--fill）→ 重建。
  # 注意：仓库闲置 60 天定时任务会被 GitHub 暂停，届时手动 Run workflow 一次即恢复。
  schedule:
    - cron: "0 22 * * *"    # 每日 → daily
    - cron: "0 2 * * 0"     # 每周日 → weekly
  workflow_dispatch:
    inputs:
      mode:
        description: 同步模式
        type: choice
        required: true
        default: daily
        options:
          - daily    # 每日：netkeiba --new（新马/改名）+ 台账 + 成绩 + 重建
          - weekly   # 每周：netkeiba --ped（血统/クロス）+ jbis --fill + 重建
          - all      # 全量抓取（重，慎用）
          - single   # 单匹更新（需填马名）
      horse_name:
        description: 马名（仅 single 模式，日文名）
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      # ── 解析本次运行模式：手动走 inputs；定时走「周日=weekly，其余=daily」──
      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode || 'daily' }}" >> "$GITHUB_OUTPUT"
          else
            if [ "$(date +%u)" = "7" ]; then
              echo "mode=weekly" >> "$GITHUB_OUTPUT"
            else
              echo "mode=daily" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ── 每日：netkeiba 新马/改名对账（D0：--new 只收新马/改名，零请求增量）──
      - name: netkeiba 新马/改名对账 (daily/weekly)
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'weekly'
        run: python scripts/scrape_netkeiba.py --new --sleep 1.0

      # ── 每日：拉台账（契约B 权威源）──
      - name: Pull race ledger
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'weekly'
        run: python scripts/pull_races.py

      # ── 每日：netkeiba 成绩页（--races，双轨制 Track B）──
      - name: netkeiba 成绩 (daily)
        if: steps.mode.outputs.mode == 'daily'
        run: python scripts/scrape_netkeiba.py --races --sleep 1.0

      # ── 每日：骑手字典增量（build_jockeys.py，扫 netkeiba_races.json 补缺失 jockey_id 全名）──
      - name: 骑手字典增量 (jockeys.json)
        if: steps.mode.outputs.mode == 'daily'
        run: python scripts/tools/build_jockeys.py --sleep 1.0

      # ── 每周：netkeiba 血统/クロス 补全（--ped）──
      - name: netkeiba 血统/クロス (weekly)
        if: steps.mode.outputs.mode == 'weekly'
        run: python scripts/scrape_netkeiba.py --ped --sleep 1.0

      # ── 每周：JBIS 兜底补填（--fill，缺 血统/クロス 增量重抓）──
      - name: JBIS 兜底补填 (weekly)
        if: steps.mode.outputs.mode == 'weekly'
        run: python scripts/scrape_jbis.py --fill --sleep 3.0

      # ── 手动：全量抓取（重，慎用）──
      - name: netkeiba 全量 (mode=all)
        if: steps.mode.outputs.mode == 'all'
        run: python scripts/scrape_netkeiba.py --all --sleep 1.0
      - name: JBIS 全量 (mode=all)
        if: steps.mode.outputs.mode == 'all'
        run: python scripts/scrape_jbis.py --all --sleep 1.2

      # ── 手动：单匹更新 ──
      - name: netkeiba 单匹 (mode=single)
        if: steps.mode.outputs.mode == 'single'
        run: python scripts/scrape_netkeiba.py --name "${{ inputs.horse_name }}" --sleep 1.0
      - name: JBIS 单匹 (mode=single)
        if: steps.mode.outputs.mode == 'single'
        run: python scripts/scrape_jbis.py --horse "${{ inputs.horse_name }}" --sleep 1.2

      # ── 构建（契约A + 契约B → crops.json）+ 契约校验 ──
      - name: Build crops.json
        run: python scripts/build-data.py --note "${{ steps.mode.outputs.mode }} 同步"

      - name: Contract & data test
        run: python scripts/test-data.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync data (${{ steps.mode.outputs.mode }})"
          git push
