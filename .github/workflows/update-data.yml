name: update-data

# 数据自动更新（data/ 数据仓库模式：跑完有变化就 commit+push，触发 Pages 部署由仓库其它流程负责）
# 前置要求：仓库 Settings → Actions → Workflow permissions → 勾选 "Read and write permissions"
on:
  schedule:
    - cron: '0 22 * * *'          # 每天 UTC 22:00（北京时间 06:00）跑 CI 全自动
  workflow_dispatch:              # 手动触发：可选更新策略
    inputs:
      strategy:
        description: 更新策略
        required: true
        default: 'ci'
        type: choice
        options:
          - ci            # 基本增量 + 比赛增量 + 校验 + 提交
          - basic         # 只更新基本数据
          - races         # 只更新比赛数据
          - races-force   # 比赛全量刷新（历史数据修正）
          - check         # 只校验（报告不一致项）
          - ledger        # 仅台账海外并入
          - init          # 初始化：删空 data/ 从 0 全量
          - horse         # 定向更新指定 id 的马
          - day           # 按指定日期快速更新（SP 结果页，快、不依赖马匹成绩页滞后）
      year:
        description: 建档年份（basic / ci 用，逗号分隔，如 2025,2026）
        required: false
        type: string
        default: ''
      since:
        description: 时段增量天数（races 用，只抓最近 N 天出赛的马）
        required: false
        type: number
        default: 7
      horse_ids:
        description: 定向 id（horse 用，逗号分隔）
        required: false
        type: string
        default: ''
      day_dates:
        description: 日期（day 用，YYYYMMDD 或逗号分隔多个）
        required: false
        type: string
        default: ''
      fix_check:
        description: check 后自动补跑修复（check 用）
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180          # 初始化全量最长约 1.5~2 小时
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 日期图断言校验（tests/_verify-datechart.cjs，--ci 末尾跑）需要 node；仅 stdlib，无需 npm install
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml fonttools brotli

      - name: 组装策略参数
        id: args
        run: |
          # ⚠ 定时触发时 workflow_dispatch 的 inputs 为空（输入默认值只在手动触发时生效），
          # 不加兜底会让 CMD 为空 → `python run_update.py` 因缺策略参数 argparse 报错退出 2。
          S="${{ inputs.strategy }}"
          S="${S:-ci}"
          CMD=""
          case "$S" in
            ci)         CMD="--ci" ;;
            basic)      CMD="--basic" ;;
            races)      CMD="--races" ;;
            races-force) CMD="--races-force" ;;
            check)      CMD="--check" ;;
            ledger)     CMD="--ledger" ;;
            init)       CMD="--init" ;;
            horse)      CMD="--horse ${{ inputs.horse_ids }}" ;;
            day)        CMD="--day $(TZ=Asia/Shanghai date +%Y%m%d)" ;;
          esac
          # --day 支持任意日期（含历史补数据）；留空则跑今天（北京时区）
          [ "$S" = "day" ] && [ -n "${{ inputs.day_dates }}" ] && CMD="--day ${{ inputs.day_dates }}"
          [ -n "${{ inputs.year }}" ] && [ "$S" = "basic" -o "$S" = "ci" ] && CMD="$CMD --year ${{ inputs.year }}"
          [ "${{ inputs.since }}" != "0" ] && [ "$S" = "races" ] && CMD="$CMD --since ${{ inputs.since }}"
          [ "${{ inputs.fix_check }}" = "true" ] && [ "$S" = "check" ] && CMD="$CMD --fix"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: 运行更新
        run: python run_update.py ${{ steps.args.outputs.cmd }}

      # 字体子集语料含 data/ 全部用字（新马名带新汉字）→ 数据更新后立刻重算产物，
      # 随下方 commit 一并提交；deploy/CF 构建只消费已提交产物（gen-font 缺依赖时 fail-soft）。
      # 源字体不落仓库：ubuntu runner 没有 C:/Windows/Fonts，从 google/fonts 官方仓库现拉。
      - name: 重新生成字体子集（fail-soft）
        run: |
          mkdir -p front/assets/fonts/src
          # 源字体在 google/fonts 上游：拉取失败只告警跳过、沿用仓库已提交产物，不得卡死每日数据更新（与 build 期 fail-soft 同定位）
          if curl -fsSL --retry 2 -o front/assets/fonts/src/NotoSansSC-VF.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"; then
            node front/scripts/gen-font.mjs --force
          else
            echo "::warning::源字体拉取失败，跳过字体子集重生成（沿用已提交产物，新汉字暂走系统字体回退）"
          fi

      - name: 提交数据（有变化才提交）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fetch_log.jsonl（抓取观测日志）随提交入库、滚动只留 60 天（scripts/core/net.py::trim_fetch_log
          # 在每次 log_fetch 后自动裁剪）；并发任务对同一文件的追加由 .gitattributes merge=union 在
          # rebase 时自动并集合并（2026-10-16 CSV 冲突的根治，不再靠排除规避）。
          git add data/ front/assets/fonts/noto-sc.css front/assets/fonts/noto-sc-subset.woff2
          if ! git diff --cached --quiet; then
            git commit -m "data: auto update $(date -u +%Y-%m-%dT%H:%MZ)"
            # 运行期间 main 可能被 status-task / 编辑台 / deploy 推进 → push 前先 rebase。
            # 冲突（罕见：basic/timeline 与 deploy 落库重叠）则放弃本次提交并显式失败，下次调度自动重算。
            git pull --rebase origin main || { git rebase --abort; echo "::error::远端冲突，本次数据提交放弃（下次调度自动重算）"; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::data/ 已更新并推送"
          else
            echo "::notice::data/ 无变化，跳过提交"
          fi

      # 关键：本工作流用默认 GITHUB_TOKEN 推送，不会触发 deploy.yml 的 push 事件（GitHub 防递归机制），
      # 导致线上站点一直停在最后一次手动部署。这里在确实 push 了数据后显式 dispatch deploy.yml
      # （deploy.yml 已带 workflow_dispatch 触发器；dispatch 不受 GITHUB_TOKEN push 限制）。
      - name: 触发 Pages 部署
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "::notice::已触发 deploy.yml 重新部署"

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log-${{ github.run_id }}
          path: test-logs/
          retention-days: 14
