name: update-day

# 数据快速更新（按天）：每天北京时间 21:00 跑「当天」产驹出赛（SP 结果页，更新快、不依赖 netkeiba 马匹成绩页滞后）。
# 与 update-data.yml（每天北京 06:00，全量 CI）并存：本任务用 --day 快速补当天，06:00 CI 继续做全量判变+校验；
# 两者落库按 race_id/馬名+日付 幂等去重，互不覆盖。
# 前置要求：仓库 Settings → Actions → Workflow permissions → 勾选 "Read and write permissions"
on:
  schedule:
    - cron: '0 13 * * *'          # 每天 UTC 13:00（北京时间 21:00）跑当天
  workflow_dispatch:              # 手动触发：可指定任意日期（含历史补数据）
    inputs:
      dates:
        description: 日期（YYYYMMDD 或逗号分隔多个；留空=今天）
        required: false
        type: string
        default: ''
      jra_only:
        description: 只扫中央 JRA（跳过 NAR 地方）
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml

      - name: 组装 --day 参数（定时跑今天，北京时区；手动可指定任意日期）
        id: args
        run: |
          D="${{ inputs.dates }}"
          D="${D:-$(TZ=Asia/Shanghai date +%Y%m%d)}"
          J=""
          [ "${{ inputs.jra_only }}" = "true" ] && J="--jra-only"
          echo "cmd=--day $D $J" >> "$GITHUB_OUTPUT"

      - name: 运行按天更新
        run: python run_update.py ${{ steps.args.outputs.cmd }}

      - name: 提交数据（有变化才提交）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: day update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || { git rebase --abort; echo "::error::远端冲突，本次数据提交放弃（下次调度自动重算）"; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::data/ 已按天更新并推送"
          else
            echo "::notice::data/ 无变化，跳过提交"
          fi

      # 本工作流用默认 GITHUB_TOKEN 推送，不会触发 deploy.yml 的 push 事件（GitHub 防递归机制）→
      # 确实 push 了数据后显式 dispatch deploy.yml（与 update-data.yml 同款，Pages 部署唯一触发口）。
      - name: 触发 Pages 部署
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "::notice::已触发 deploy.yml 重新部署"

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-day-log-${{ github.run_id }}
          path: test-logs/
          retention-days: 14
