<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云迹 · Contrail 产驹资料库</title>
<link rel="stylesheet" href="pages/theme.css">
<style>
body{overflow:hidden}
.app{display:flex;height:100vh}
/* 左侧导航（桌面） */
.sidebar{width:220px;flex:none;border-right:1px solid hsl(var(--border));background:hsl(var(--card));display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid hsl(var(--border))}
.brand .logo{width:30px;height:30px;border-radius:8px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.brand .t{font-weight:600;font-size:15px;letter-spacing:.5px}
.brand .t small{display:block;font-size:10px;font-weight:400;color:hsl(var(--muted-foreground));letter-spacing:1px}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-g{font-size:10px;letter-spacing:1.5px;color:hsl(var(--muted-foreground));padding:12px 10px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:hsl(var(--muted-foreground));cursor:pointer;font-size:13px;margin-bottom:2px}
.nav-item:hover{background:hsl(var(--muted)/.4);color:hsl(var(--foreground))}
.nav-item.on{background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-weight:500}
.nav-item .ic{width:18px;text-align:center;font-size:14px;opacity:.9}
.foot{padding:12px 16px;border-top:1px solid hsl(var(--border));font-size:11px;color:hsl(var(--muted-foreground))}
/* 内容区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;flex:none;border-bottom:1px solid hsl(var(--border));display:flex;align-items:center;padding:0 20px;gap:12px;background:hsl(var(--card))}
.topbar .crumb{font-size:13px;color:hsl(var(--muted-foreground))}
.topbar .crumb b{color:hsl(var(--foreground));font-weight:600}
.topbar .spacer{flex:1}
.topbar .hint{font-size:11px;color:hsl(var(--muted-foreground))}
.menu-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid hsl(var(--border));background:hsl(var(--background));color:hsl(var(--foreground));cursor:pointer;font-size:18px;line-height:1;flex:none}
.frame-wrap{flex:1;min-height:0}
.frame-wrap iframe{width:100%;height:100%;border:none;display:block;background:hsl(var(--background))}
/* 抽屉遮罩（仅手机用） */
.backdrop{display:none}

/* ---------- 手机（≤768px）：侧边栏收起为抽屉 ---------- */
@media (max-width:768px){
  .menu-btn{display:inline-flex}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:240px;z-index:40;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 24px rgba(0,0,0,.12);
  }
  .sidebar.open{transform:translateX(0)}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s}
  .backdrop.show{opacity:1;visibility:visible}
  .topbar{padding:0 12px;gap:8px}
  .topbar .hint{display:none}
  .foot{display:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">雲</div>
      <div class="t">云迹<small>Contrail 产驹资料库</small></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-g">云崽档案</div>
      <div class="nav-item" data-href="pages/profile.html"><span class="ic">ℹ</span>基本信息</div>
      <div class="nav-item" data-href="pages/pedigree.html"><span class="ic">🌳</span>血统图</div>
      <div class="nav-item" data-href="pages/races.html"><span class="ic">🏇</span>比赛记录</div>
      <div class="nav-g">统计</div>
      <div class="nav-item" data-href="pages/stats.html"><span class="ic">📊</span>统计总览</div>
      <div class="nav-item" data-href="pages/datechart.html"><span class="ic">📅</span>日期图</div>
      <div class="nav-item" data-href="pages/timeline.html"><span class="ic">🧭</span>时间线</div>
    </nav>
    <div class="foot">云迹 · 数据仅供分享交流</div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <!-- 内容区 -->
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="打开菜单">☰</button>
      <span class="crumb" id="crumb"><b>基本信息</b></span>
      <span class="spacer"></span>
      <span class="hint">数据尚未接入 · 子页面为占位</span>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" src="pages/profile.html" title="内容"></iframe>
    </div>
  </div>
</div>

<script>
var items=[].slice.call(document.querySelectorAll('.nav-item'));
var titles={};
items.forEach(function(it){titles[it.dataset.href]=it.textContent.replace(/^\S+\s*/,'');});
var sidebar=document.getElementById('sidebar');
var backdrop=document.getElementById('backdrop');
var menuBtn=document.getElementById('menuBtn');
function closeDrawer(){
  sidebar.classList.remove('open');
  backdrop.classList.remove('show');
  document.body.style.overflow='hidden'; /* 恢复外壳原本 overflow:hidden */
}
menuBtn.addEventListener('click',function(){
  sidebar.classList.add('open');
  backdrop.classList.add('show');
});
backdrop.addEventListener('click',closeDrawer);
function go(href){
  document.getElementById('frame').src=href;
  items.forEach(function(it){it.classList.toggle('on',it.dataset.href===href);});
  document.getElementById('crumb').innerHTML='<b>'+ (titles[href]||'') +'</b>';
  closeDrawer();
}
items.forEach(function(it){it.addEventListener('click',function(){go(it.dataset.href);});});
</script>
</body>
</html>
