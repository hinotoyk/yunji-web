<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日期图 · 云迹</title>
<link rel="stylesheet" href="theme.css">
<style>
.page{max-width:920px;margin:0 auto;padding:26px 24px 60px}
.ph{border:1px dashed hsl(var(--border));border-radius:10px;padding:48px 20px;text-align:center;color:hsl(var(--muted-foreground));background:hsl(var(--muted)/.15)}
.ph h2{color:hsl(var(--foreground));font-size:18px;font-weight:600;margin-bottom:8px}
.ph p{font-size:13px}
</style>
</head>
<body>
<div class="page">
  <div class="sec-title">日期图 · DATE CHART</div>
  <div class="ph">
    <h2>日期图页 · 占位</h2>
    <p>可按 <strong>天 / 周 / 月 / 年</strong> 切换：柱状图显示每单位胜场数，下方列出该单位赢的马和赛事，重赏/分级赛突出标记。<br>当前为布局占位，日期聚合随后接入。</p>
  </div>
</div>
</body>
</html>
