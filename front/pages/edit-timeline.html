<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../rehome.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航迹线编辑 · {{YJ_SITE_NAME}}</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=1">
<link rel="stylesheet" href="theme.css">
</head>
<body class="bg-muted/50 text-foreground antialiased">

<!-- 2026-09 定稿（docs/UI优化记录.md §82/§82.4 · B 稿）：时间线人工节点独立编辑页。
     全站一份 timeline_manual.json；草稿箱提交后 CI 自动 merge + build_timeline 重算（约 2 分钟）。
     人工节点两种入口：引用比赛（选马选场自动填 date/title/link）· 自填荣誉（自由卡片）。
     §82.13：mb 端不开放编辑——应用容器 max-md 隐藏，只留电脑端提示。 -->
<div class="hidden max-md:block mx-auto w-full max-w-[880px] px-4 pt-16 pb-[60px] text-center">
  <div class="text-[42px] leading-none">🖥️</div>
  <div class="mt-3 text-[15px] font-bold">编辑台请在电脑端使用</div>
  <div class="mt-1.5 text-[12.5px] leading-[1.7] text-muted-foreground">手机端只浏览：页面上的编辑入口在窄屏下一律隐藏。</div>
</div>

<div class="mx-auto w-full max-w-[880px] px-4 pt-5 pb-[108px] max-md:px-3 max-md:pt-3 max-md:pb-[132px] max-md:hidden">

  <header class="rounded-xl border border-border bg-card px-4 py-3 shadow-sm">
    <div id="mast" class="flex flex-wrap items-center gap-x-3 gap-y-2"></div>
  </header>

  <section class="mt-3 rounded-[14px] border border-border bg-card p-5 shadow-sm max-md:p-4">
    <div id="tl"><div class="hint-empty">时间线表加载中…</div></div>
  </section>
</div>

<div id="savebar" class="fixed inset-x-0 bottom-0 z-50 border-t border-border bg-background/95 backdrop-blur max-md:hidden">
  <div class="relative mx-auto flex max-w-[880px] flex-wrap items-center gap-2 px-4 py-2.5 max-md:px-3 max-md:pb-[calc(10px+env(safe-area-inset-bottom))]">
    <div id="box"></div>
    <span class="flex items-center gap-1.5 text-[10px] font-bold tracking-[.4px] text-muted-foreground">
      <i class="inline-block h-[7px] w-[7px] flex-none rounded-full bg-chart3"></i>草稿箱模式 · 提交后约 2 分钟生效
    </span>
    <div id="report" class="order-last w-full max-md:max-h-[60px] max-md:overflow-y-auto"></div>
    <span id="count" class="whitespace-nowrap text-[10.5px] font-semibold tabular-nums text-muted-foreground"></span>
    <span class="ml-auto flex flex-wrap items-center justify-end gap-2">
      <button id="save" class="yj-ed-op yj-ed-op--primary h-8 px-3.5 text-[12.5px] font-bold" type="button" disabled>提交到 GitHub</button>
      <button id="boxBtn" class="yj-ed-op h-8 px-3" type="button">草稿箱</button>
    </span>
  </div>
</div>

<script src="../site-config.js"></script>
<script src="../data-config.js"></script>
<script src="../yj-util.js?v=4"></script>
<script src="../i18n.js?v=1"></script>
<script src="../device.js"></script>
<script src="../yj-cache.js?v=1"></script>
<script src="../selector.js?v=9"></script>
<script src="../race-bundle.js?v=1"></script>
<script src="../editor.js?v=10"></script>
<script>
YJ.editor.init({
  mode: "timeline",
  mast: "mast", tl: "tl",
  report: "report", save: "save", count: "count",
  box: "box", boxBtn: "boxBtn"
});
</script>
</body>
</html>
