<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../rehome.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航迹线编辑 · {{YJ_SITE_NAME}}</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=1">
<link rel="stylesheet" href="theme.css">
<!-- 卡片视觉原子：与 timeline.html 共用同一份（2026-10-30 UI 审查 §26）。
     此前这里是「复制自 timeline.html 页内 <style>」的 .yj-pv 副本，靠人工同步；
     现在抽到 timeline-cards.css，正式页与预览页引用同一个文件，改一次两边同步。
     ★ 徽章变体（.yj-grade 不缩进 / .yj-no 22px）也已在共享文件里按 .tl / .yj-pv 双作用域定义。 -->
<link rel="stylesheet" href="timeline-cards.css">
<style>
/* ===== 本页专属：预览卡的「单侧一行」布局骨架 =====
 * 与正式页的「居中轴线 + 左右交替」不同（预览只有一侧，不需要 .tl 轴线与 .tl::before），
 * 所以 grid 骨架留在这里，卡片视觉原子一律走 timeline-cards.css。 */
.yj-pv .tl-item{display:grid;grid-template-columns:auto 26px minmax(0,1fr);grid-template-areas:"date node card";align-items:center}
.yj-pv .tl-date{grid-area:date;text-align:right;padding-right:2px}
.yj-pv .tl-node{grid-area:node;justify-self:center;background-color:#8a9096}   /* 人工节点恒 manual 灰（build_timeline.to_manual_event 硬编码） */
.yj-pv .tl-cardwrap{grid-area:card;min-width:0;width:min(480px,100%);justify-self:start}
</style>
</head>
<body class="bg-muted/50 text-foreground antialiased">

<!-- 2026-10 v3「工作台」改版（docs/UI优化记录.md §90）：页首「编辑」分段导航与基本信息页同构；
     空态 = 「引用比赛 / 自填荣誉」两张入口邀请卡（signature），有节点后工具条 + 盒装列表。
     全站一份 timeline_manual.json；草稿箱提交后 CI 自动 merge + build_timeline 重算（约 2 分钟）。
     人工节点两种入口：引用比赛（选马选场自动填 date/title/link）· 自填荣誉（自由卡片）。
     §82.13：mb 端不开放编辑——应用容器 max-md 隐藏，只留电脑端提示。 -->
<div class="hidden max-md:block mx-auto w-full max-w-[880px] px-4 pt-16 pb-[60px] text-center">
  <div class="text-[42px] leading-none">🖥️</div>
  <div class="mt-3 text-[15px] font-bold">编辑台请在电脑端使用</div>
  <div class="mt-1.5 text-[12.5px] leading-[1.7] text-muted-foreground">手机端只浏览：页面上的编辑入口在窄屏下一律隐藏。</div>
</div>

<div class="mx-auto w-full max-w-[880px] px-4 pt-6 pb-[108px] max-md:px-3 max-md:pt-3 max-md:pb-[132px] max-md:hidden">

  <header class="rounded-xl border border-border bg-card px-4 py-3 shadow-sm">
    <!-- 页内页签已撤下（2026-10-25 用户定稿）：编辑台导航统一收进外壳侧栏「编辑」组（front/index.html #editNav） -->
    <div id="mast" class="flex flex-wrap items-center gap-x-3 gap-y-2"></div>
  </header>

  <section class="mt-3 rounded-[14px] border border-border bg-card p-5 shadow-sm max-md:p-4">
    <div id="tl"><div class="hint-empty">时间线表加载中…</div></div>
  </section>
</div>

<div id="savebar" class="fixed inset-x-0 bottom-0 z-50 border-t border-border bg-background/95 backdrop-blur max-md:hidden">
  <div class="relative mx-auto flex max-w-[880px] flex-wrap items-center gap-2.5 px-4 py-2.5">
    <div id="box"></div>
    <span class="flex items-center gap-1.5 whitespace-nowrap text-[11px] text-muted-foreground">
      <i class="yj-ed-chipdot bg-chart3"></i>草稿箱模式 · 提交后约 2 分钟生效
    </span>
    <div id="report" class="order-last w-full max-md:max-h-[60px] max-md:overflow-y-auto"></div>
    <span class="ml-auto flex flex-none items-center justify-end gap-2">
      <button id="save" class="yj-ed-op yj-ed-op--primary h-8 px-4 text-[12.5px] font-bold" type="button" disabled>提交到 GitHub</button>
      <button id="boxBtn" class="yj-ed-op h-8 px-3" type="button">草稿箱</button>
    </span>
  </div>
</div>

<script src="../site-config.js"></script>
<script src="../data-config.js"></script>
<script src="../yj-util.js"></script>
<script src="../i18n.js"></script>
<script src="../device.js"></script>
<script src="../yj-cache.js"></script>
<script src="../selector.js"></script>
<script src="../race-rows.js"></script>
<script src="../race-bundle.js"></script>
<script src="../editor.js"></script>
<script>
YJ.editor.init({
  mode: "timeline",
  mast: "mast", tl: "tl",
  report: "report", save: "save",
  box: "box", boxBtn: "boxBtn"
});
</script>
</body>
</html>
