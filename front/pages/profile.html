<script>
var esc = YJ.util.esc;  /* HTML 转义：单一出处 public/yj-util.js */
var sexOf = YJ.util.sexOf;  /* 当前性别（性別_当前 优先，回退官方 性別）：单一出处同上 */

/* 编辑入口默认不进视野（2026-10-02 用户定稿）：本页「回编辑台 ↗」等直跳编辑页的入口
   仅 URL 带 ?edit=1 时出现 —— 与外壳 index.html「编辑」导航组同一开关
   （外壳加载子页时把 edit=1 透传进 iframe；直接开本页也可自行拼接）。 */
var EDIT_MODE = YJ.util.qs("edit") === "1";

/* ── 编辑台草稿叠加（2026-09 预览定稿）：读 editor.js 草稿箱（localStorage，键同源）──
 * 把本马未提交的五字段改动叠加在 basic 值上渲染 + 页顶「草稿预览」提示条；
 * 图片草稿是 IndexedDB 二进制，不内嵌显示，只在提示条报张数。读不到 = 原样渲染、零开销。 */
var DRAFT = {};   /* 草稿键单一出处 = YJ.util.DRAFT_KEY（2026-xx 收口，与 editor.js 共用；取值时求值，§105） */
try { var _dj = JSON.parse(localStorage.getItem(YJ.util.DRAFT_KEY) || "{}"); DRAFT = (_dj && typeof _dj === "object") ? _dj : {}; } catch (e) { DRAFT = {}; }
function draftOv(id){ var e = DRAFT.ov && DRAFT.ov[String(id)]; return (e && typeof e === "object") ? e : null; }
function draftPh(id){ var e = DRAFT.ph && DRAFT.ph[String(id)]; return (e && typeof e === "object" && Array.isArray(e.list)) ? e : null; }
function draftHas(id){ return !!(draftOv(id) || draftPh(id)); }
function draftFieldCount(id){
  var e = draftOv(id);
  return e ? Object.keys(e).filter(function(k){ return k.charAt(0) !== "_"; }).length : 0;
}

/* 性别徽章（沿用搜索列表的配色语言：牡/牝/セン 原生显示） */
function sexBadge(v){
  if(v==="牡") return '<span class="inline-flex items-center rounded-full bg-[#C9EFFE] px-2 py-0.5 text-[11px] font-bold leading-[1.6] text-[#0B5A8C]">♂ 牡</span>';
  if(v==="牝") return '<span class="inline-flex items-center rounded-full bg-[#FFDBD5] px-2 py-0.5 text-[11px] font-bold leading-[1.6] text-[#B03A30]">♀ 牝</span>';
  if(v==="セ") return '<span class="inline-flex items-center rounded-full bg-[#EFEFEF] px-2 py-0.5 text-[11px] font-bold leading-[1.6] text-[#5A5A5A]">⚲ 骟</span>';
  return esc(v||"—");
}

/* iframe 高度自适应：嵌入内容随内容伸缩，避免无边框下的空白框。
 * 血统图(pedframe)：高度取 max(内容高, 所在栏高) —— 内容矮时填满右栏与资料表对齐，内容高时撑开整块 */
function fitFrames(){
  [".pedframe",".raceframe"].forEach(function(sel){
    var fr=document.querySelector(sel);
    if(!fr) return;
    var tries=0;
    (function tick(){
      if(tries++>50) return;
      try{
        var w=fr.contentWindow, d=w&&w.document;
        if(!d) return;
        var h=Math.max(d.body?d.body.scrollHeight:0, d.documentElement?d.documentElement.scrollHeight:0);
        if(h>40 && Math.abs(h-fr.offsetHeight)>2){
          var minH=0;
          if(sel===".pedframe"){
            var card=fr.closest?fr.closest(".pedcard"):null;
            if(card) minH=Math.max(0,card.offsetHeight-24); /* p-3 上下 padding 各 12px */
          }
          fr.style.height=Math.min(Math.max(h,minH),1400)+"px";
        }
      }catch(e){}
      setTimeout(tick,180);
    })();
  });
}

/* 头像：photo 兼容 数组/网络/本地；多图 → 相册：点击左/右切换，悬停提示
 * 照片区为弹性大区域（flex-1 撑满剩余宽度）；照片完整展示（object-contain + max 约束，
 * 不拉伸不裁切），铺满宽度/高度中取最大适配，放不下/不够大时居中 */
function avatarHTML(photo){
  var list=[];
  if(Array.isArray(photo)) list=photo.slice();
  else if(typeof photo==="string" && photo) list=[photo];
  list=list.filter(function(p){return p;});
  var wrap='relative flex min-h-[340px] min-w-0 flex-1 items-center justify-center overflow-hidden rounded-[14px] border border-border bg-muted/20 max-md:h-[240px] max-md:min-h-0 max-md:flex-none max-md:w-full';
  if(!list.length) return '<div class="'+wrap+'"><span class="text-[64px] text-muted-foreground opacity-50">🐎</span></div>';
  list=list.map(function(p){ return (String(p).indexOf("data/")===0) ? YJ_DATA.url(p) : p; });
  /* 图片标记统一走 YJ.ui.img：loading=lazy + decoding=async + 写死占位尺寸（防 CLS）。
   * 占位盒由上面的 wrap（min-h-[340px] / mb 240px）承担，width/height 给的是库内实拍比例 1108×1477，
   * 让浏览器在解码前就定好比例；object-contain + absolute inset-0 再由 CSS 覆盖实际渲染尺寸。 */
  if(list.length===1){
    return '<div class="'+wrap+'">'+YJ.ui.img({src:list[0], cls:'absolute inset-0 h-full w-full object-contain', w:1108, h:1477,
      attrs:'alt="头像" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=&quot;text-[64px] text-muted-foreground opacity-50&quot;>🐎</span>\'"'})+'</div>';
  }
  return '<div class="'+wrap+' group" data-photos="'+esc(list.join("|"))+'">'+
    YJ.ui.img({src:list[0], cls:'pav-img absolute inset-0 h-full w-full object-contain', w:1108, h:1477, alt:'头像', attrs:'onerror="this.style.display=\'none\'"'})+
    '<button type="button" class="pav-nav pav-prev absolute top-1/2 left-2.5 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full bg-transparent text-[34px] font-light leading-none text-foreground/90 [text-shadow:0_1px_1px_rgba(0,0,0,0.3),0_0_12px_rgba(255,255,255,0.85)] transition-all duration-200 hover:scale-110 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/60 cursor-pointer select-none" title="上一张">‹</button>'+
    '<button type="button" class="pav-nav pav-next absolute top-1/2 right-2.5 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full bg-transparent text-[34px] font-light leading-none text-foreground/90 [text-shadow:0_1px_1px_rgba(0,0,0,0.3),0_0_12px_rgba(255,255,255,0.85)] transition-all duration-200 hover:scale-110 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/60 cursor-pointer select-none" title="下一张">›</button>'+
    '<div class="pav-count absolute top-2.5 right-3 rounded-full border border-black/15 bg-white/90 px-2.5 py-0.5 text-[11px] font-semibold tabular-nums tracking-[.5px] text-foreground/75 shadow-md backdrop-blur-sm">1/'+list.length+'</div>'+
  '</div>';
}

/* 相册切换：点击左半/右半 → 上一张/下一张（‹ › 箭头同理，环形循环） */
function avatarBind(){
  var el=document.querySelector(".pava.multi") || document.querySelector("[data-photos]");
  if(!el) return;
  var photos=el.getAttribute("data-photos").split("|");
  var img=el.querySelector(".pav-img");
  var count=el.querySelector(".pav-count");
  var idx=0;
  /* 相邻一张预加载（§5.3.2）：头像已改 loading=lazy，切换时不该再等一次网络往返；
   * 同一 src 只预拉一次（seen 去重），环形序列 = 下一张 + 上一张 */
  var seen={};
  function preload(n){
    var src=photos[((n%photos.length)+photos.length)%photos.length];
    if(!src || seen[src]) return;
    seen[src]=1;
    var im=new Image();
    im.decoding="async";
    im.src=src;
  }
  function show(n){
    idx=(n+photos.length)%photos.length;
    img.src=photos[idx];
    if(!img.decoding) img.decoding="async";
    count.textContent=(idx+1)+"/"+photos.length;
    preload(idx+1); preload(idx-1);
  }
  preload(1); preload(photos.length-1);   /* 首图已在外层懒加载，先把两端挂上 */
  el.addEventListener("click",function(e){
    var rect=el.getBoundingClientRect();
    if(e.clientX-rect.left < rect.width/2) show(idx-1); else show(idx+1);
  });
  var prev=el.querySelector(".pav-prev"), next=el.querySelector(".pav-next");
  if(prev) prev.addEventListener("click",function(e){e.stopPropagation();show(idx-1);});
  if(next) next.addEventListener("click",function(e){e.stopPropagation();show(idx+1);});
}

var detailCol=document.getElementById("detailCol");

/* 未选马：目录总览（让右侧不空白，兼做引导）。
 * 概览卡 = 实时合计等式：收录产驹总数 = 各年出生数之和（由 basic.json 现场聚合，
 * 数据新增年份自动扩展；非年份数值兜底排最后，保证「总和 = 各年之和」恒成立） */
function renderOverview(hs){
  var total=hs.length;
  var byYear={}, bySex={};
  hs.forEach(function(h){
    var y=h.生年||'未知'; byYear[y]=(byYear[y]||0)+1;
    var s=sexOf(h);
    if(s==='セ') s='セン'; /* セ/セン 两种写法都算骟马 */
    if(s) bySex[s]=(bySex[s]||0)+1;
  });
  var years=Object.keys(byYear).sort(function(a,b){
    var na=parseInt(a,10), nb=parseInt(b,10);
    var ka=isNaN(na), kb=isNaN(nb);
    if(ka||kb) return ka===kb?0:(ka?1:-1); /* 非年份（未知）排最后 */
    return nb-na; /* 年份降序，最新在前 */
  });
  var group=function(label, sub, inner, right){
    return '<div class="flex min-h-0 flex-1 flex-col rounded-[10px] border border-border bg-card p-5">'+
      '<div class="mb-3 flex items-center gap-2"><span class="text-[12px] font-bold uppercase tracking-[1px] text-secondary-foreground">'+label+'</span>'+(sub?'<span class="text-[10.5px] tracking-[.5px] text-muted-foreground">'+sub+'</span>':'')+
      (right?'<span class="ml-auto rounded-full bg-muted/60 px-3 py-1 text-[11px] text-muted-foreground">'+right+'</span>':'')+'</div>'+
      inner+'</div>';
  };
  /* ── 状态 · BY STATUS：方形面积图（treemap），类名+数字直标块内 ──
   * 分类口径与 statusChain（yj-util §48 单一出处）同源，由 登録状態/抹消_去向種別 两键现场聚合（不动数据）：
   *   現役 → 中央现役；确认去向 → 地方现役/繁殖/乘马/种马/死亡（空状态马有确认去向同样归入，如未出道即死亡）；
   *   抹消但去向未确认 → JRA抹消（JRA 注册状态原值当类名）；其余（空状态无去向，多为未出道马）→ 未登录。
   * 「现役」= 中央 + 地方（仍在出赛的两档）→ 面积图分两块、色系同族可对照。
   * 面积 ∝ 匹数；<2 匹小类（当前=死亡/种马）入右侧定宽格子栏（见 tmPaint 注）——大类面积零失真、小类诚实可见。
   * 配色 = 200 级低饱和浅底 + 同 hue 900 级深字（theme.css .yj-tm--* 纯 bg/text 类）；
   * 块渲染与概览/性别共用 tmHTML（仍在 renderOverview 内，§48 仅 2 处不出 public）。 */
  var CATS=[
    {k:'live',    n:'中央现役', c:'yj-tm--live',    tip:'JRA 登录中 · 现役在厩'},
    {k:'local',   n:'地方现役', c:'yj-tm--local',   tip:'JRA 抹消后移籍地方竞马，仍在出赛'},
    {k:'breed',   n:'繁殖',    c:'yj-tm--breed',   tip:'抹消后转入繁殖'},
    {k:'ride',    n:'乘马',    c:'yj-tm--ride',    tip:'抹消后转为乘马'},
    {k:'unknown', n:'JRA抹消', c:'yj-tm--unknown', tip:'已从 JRA 抹消 · 去向未确认（可能地方/繁殖/乘马）'},
    {k:'sire',    n:'种马',    c:'yj-tm--sire',    tip:'抹消后转为种公马'},
    {k:'dead',    n:'死亡',    c:'yj-tm--dead',    tip:'死亡（含未出道即死亡）'},
    {k:'unreg',   n:'未登录',  c:'yj-tm--unreg',   tip:'尚无 JRA 登录状态记录（多为未出道马）'}
  ];
  var catMap={}; CATS.forEach(function(c){ catMap[c.k]=c; });
  var bySt={};
  hs.forEach(function(h){
    var st=h.登録状態||'', d=h.抹消_去向種別||'', k;
    if(st==='現役') k='live';
    else if(d) k=({'地方競馬':'local','繁殖':'breed','乗馬':'ride','種馬':'sire','死亡':'dead','海外':'overseas'}[d]||'unknown');
    else if(st==='抹消') k='unknown';
    else k='unreg';
    bySt[k]=(bySt[k]||0)+1;
  });
  var cats=CATS.slice();
  if(bySt.overseas){   /* 海外去向当前无收录马：>0 才进图例/色块（枚举同 statusChain，不预设常量） */
    var oc={k:'overseas', n:'海外', c:'yj-tm--overseas', tip:'抹消后转往海外竞马'};
    cats.push(oc); catMap.overseas=oc;
  }
  /* 性别 · BY SEX：**三等分列**色块（非面积图——骟马匹数少，面积图会缩成细条太易忽视，等宽列平权）；
   * 色类 .yj-tm--male/female/gelding（theme.css），块形态与面积图同语言（浅底深字、类名数字在块内） */
  var SEXCATS=[
    {k:'牡',  n:'牡马', c:'yj-tm--male',   tip:'公马'},
    {k:'牝',  n:'牝马', c:'yj-tm--female', tip:'母马'},
    {k:'セン', n:'骟马', c:'yj-tm--gelding', tip:'去势马（セ/セン 同义）'}
  ];
  SEXCATS.forEach(function(c){ catMap[c.k]=c; });
  /* squarified treemap（Bruls et al.）：逐行贪心压向短边，worst 宽高比不再下降才换行；面积 ∝ 匹数。
   * 末行保底（MIN=28px）：短容器下 1-9 匹的尾行会细成 10-20px 的条——从相邻同向前一行「保宽削厚」
   * 借厚度到 28px（内联「类名+数字」的最低预算），容器仍精确铺满、无叠无漏；借厚上限 = 前行厚-10。
   * W/H = 实测容器像素（tmPaint 里量）→ 选马后 DOM 被替换，函数随作用域废弃，无泄漏。 */
  function tmSquarify(items,W,H){
    var MIN=28;
    var total=0; items.forEach(function(v){ total+=v.n; });
    var sc=total>0 ? (W*H)/total : 0;
    var its=items.map(function(v){ return {k:v.k, a:v.n*sc}; });
    var rows=[], x=0, y=0, w=W, h=H, i=0;
    while(i<its.length){
      var horiz=w>=h, len=horiz?w:h, j=i, sum=0, best=Infinity;
      while(j<its.length){
        var s=sum+its[j].a, th=s/len, worst=0;
        for(var q=i;q<=j;q++){ var o=its[q].a/th, ar=Math.max(th/o,o/th); if(ar>worst) worst=ar; }
        if(j===i||worst<=best){ best=worst; sum=s; j++; } else break;
      }
      var sub=[]; for(var q4=i;q4<j;q4++) sub.push(its[q4]);
      rows.push({its:sub, horiz:horiz, x:x, y:y, w:w, h:h,
        thN:sum/len, th:sum/len});           /* thN=自然厚（算各块展宽），th=渲染厚（可被借位修正） */
      if(horiz){ y+=sum/w; h-=sum/w; } else { x+=sum/h; w-=sum/h; }
      i=j;
    }
    if(rows.length>1){
      var last=rows[rows.length-1], prev=rows[rows.length-2];
      if(last.horiz===prev.horiz && last.th<MIN && prev.th>MIN){
        var d=Math.min(MIN-last.th, prev.th-MIN);
        if(d>0){
          last.th+=d; prev.th-=d;
          if(last.horiz){ last.y-=d; } else { last.x-=d; }   /* 末行向容器内侧扩，底/右缘仍贴边 */
        }
      }
    }
    var out=[];
    rows.forEach(function(r){
      var off=r.horiz?r.x:r.y;
      r.its.forEach(function(it){
        var ext=it.a/r.thN;                    /* 展宽按自然厚算 → 行内恰好铺满，无叠无漏 */
        out.push(r.horiz ? {k:it.k,x:off,y:r.y,w:ext,h:r.th} : {k:it.k,x:r.x,y:off,w:r.th,h:ext});
        off+=ext;
      });
    });
    return out;
  }
  /* 小类右栏：<2 匹的小类（当前=死亡 1、种马 0）在纯面积图里必然不可见/细成丝，硬等效放大会虚增其面积比
   * （0 匹块会被撑到和 14 匹块一样大，误导）→ 单列**右侧定宽格子栏**：块小即类小，诚实且全可读；
   * 死亡固定右栏末位（右栏贴右缘 → 末格=整图右下角，终点态语义）+ 固定浅灰（theme.css .yj-tm--dead）。 */
  function tmPaint(){
    var el=document.getElementById(tmId); if(!el) return;
    var W=el.clientWidth, H=el.clientHeight;
    if(W<40||H<40) return;
    var MINI_MAX=2-1e-9, bigs=[], minis=[];
    cats.forEach(function(c){ var n=bySt[c.k]||0; (n<MINI_MAX?minis:bigs).push({k:c.k,n:n}); });
    /* 右栏排序：按匹数降序，但「死亡」固定钉在末位（终点态放最角落）；
     * 若死亡涨到 ≥2 匹回到主面积图，则按常规面积排位（角落约定仅对小类右栏生效） */
    minis.sort(function(a,b){
      if(a.k==='dead') return 1;
      if(b.k==='dead') return -1;
      return b.n-a.n;
    });
    bigs.sort(function(a,b){ return b.n-a.n; });
    var mw=minis.length?Math.min(Math.max(minis.length*74,74),W*0.32):0;
    var rects=tmSquarify(bigs,W-mw,H);
    if(minis.length){
      var mh=(H-(minis.length-1)*2)/minis.length;
      minis.forEach(function(it,i){ rects.push({k:it.k,x:W-mw,y:i*(mh+2),w:mw,h:mh}); });
    }
    el.innerHTML=tmHTML(rects,bySt);
  }
  /* 块渲染单一出处（状态/概览两图共用）：按面积阈值选标签形态（竖排 / 横排一行 / 数字-only）；
   * pctSum 传入时追加占比行（面积差肉眼难辨，标注占比才读得准） */
  function tmHTML(rs,cnt,pctSum){
    return rs.map(function(r){
      var c=catMap[r.k]||{n:'',c:'',tip:''};
      var ix=Math.round(r.x)+1, iy=Math.round(r.y)+1, iw=Math.max(Math.round(r.w)-2,0), ih=Math.max(Math.round(r.h)-2,0), inner='';
      var pct=(pctSum&&ih>=64)?'<span class="yj-tm-p">'+(100*(cnt[r.k]||0)/pctSum).toFixed(1)+'%</span>':'';
      if(iw>=50&&ih>=44) inner='<span class="yj-tm-n">'+esc(c.n)+'</span><b class="yj-tm-v">'+(cnt[r.k]||0)+'</b>'+pct;
      else if(iw>=64&&ih>=26) inner='<span class="yj-tm-n">'+esc(c.n)+'</span><b class="yj-tm-v yj-tm-v--s">'+(cnt[r.k]||0)+'</b>';
      else if(iw>=36&&ih>=22) inner='<b class="yj-tm-v yj-tm-v--s">'+(cnt[r.k]||0)+'</b>';
      else if(iw>=22&&ih>=14) inner='<b class="yj-tm-v yj-tm-v--xs">'+(cnt[r.k]||0)+'</b>';
      var cls='yj-tm '+c.c+((iw>=64&&ih>=26&&!(iw>=50&&ih>=44))?' yj-tm-h':'');
      return '<div class="'+cls+'" style="left:'+ix+'px;top:'+iy+'px;width:'+iw+'px;height:'+ih+'px" title="'+esc(c.tip+' · '+(cnt[r.k]||0)+' 匹')+'">'+inner+'</div>';
    }).join('');
  }
  var tmId='yjStm';
  var tmWrap='<div id="'+tmId+'" class="relative min-h-[190px] w-full flex-1 max-md:min-h-[170px]"></div>';
  function paintAll(){ tmPaint(); ovPaint(); }   /* ovPaint 声明提升，定义在下方概览段 */
  /* 概览 · 年份占比图：块面积 ∝ 匹数，块内 标签+匹数+占比（面积差肉眼难辨，标注才读得准）。
   * 总数在占比图里没有位置——它=全部面积的和，再摆一块必双重计数 → 抬到组标题右侧信息 chip（group 第 4 参）。
   * 年份色轮换 y1..y5（新增年份自动续色，未知年份排最后照常参与）；随卡片高度伸展，resize 重排 */
  var YEARC=['yj-tm--y1','yj-tm--y2','yj-tm--y3','yj-tm--y4','yj-tm--y5'];
  var ovItems=years.map(function(y,i){
    var k=String(y);
    catMap[k]={k:k, n:y+' 年生', c:YEARC[i%YEARC.length], tip:y+' 年出生的产驹'};
    return {k:k, n:byYear[y]||0};
  });
  var ovId='yjOvm';
  var ovWrap='<div id="'+ovId+'" class="relative min-h-[150px] w-full flex-1 max-md:min-h-[140px]"></div>';
  function ovPaint(){
    var el=document.getElementById(ovId); if(!el) return;
    var W=el.clientWidth, H=el.clientHeight;
    if(W<40||H<40) return;
    var items=ovItems.filter(function(v){ return v.n>0; });
    items.sort(function(a,b){ return b.n-a.n; });
    var sum=items.reduce(function(s,v){ return s+v.n; },0);
    el.innerHTML=tmHTML(tmSquarify(items,W,H),byYear,sum);
  }
  var statHTML=
    group('概览','OVERVIEW', ovWrap,
      '收录产驹总数 <b class="ml-1 text-[13px] font-bold tabular-nums text-primary">'+esc(total)+'</b>')+
    group('性别','BY SEX',
      '<div class="grid min-h-0 flex-1 grid-cols-3 gap-3">'+
        SEXCATS.map(function(c){
          var n=bySex[c.k]||0;
          return '<div class="yj-tile '+c.c+' flex flex-col items-center justify-center px-3 py-4" title="'+esc(c.tip+' · '+n+' 匹')+'">'+
            '<span class="yj-tm-n">'+esc(c.n)+'</span><b class="yj-tm-v">'+n+'</b></div>';
        }).join('')+'</div>')+
    group('状态','BY STATUS', tmWrap);
  document.getElementById("body").innerHTML =
    '<div class="flex min-h-full flex-col gap-4">'+
      '<div class="rounded-[10px] border border-border bg-card p-6">'+
        '<div class="text-[17px] font-bold">{{YJ_SITE_NAME}} · {{YJ_SITE_SUBTITLE}}</div>'+
        '<div class="mt-1.5 text-[13px] text-muted-foreground">{{YJ_SITE_TAGLINE}}</div>'+
      '</div>'+statHTML+
    '</div>';

  paintAll();
  /* 视口变化 → 重排两张面积图（按实测容器宽高铺排；选马后本 DOM 已被整体替换，paint 内部空判自动退出） */
  if(!renderOverview._tmBound){
    renderOverview._tmBound=true;
    var tmT=0;
    window.addEventListener('resize',function(){ clearTimeout(tmT); tmT=setTimeout(paintAll,120); });
  }
}

/* 主胜鞍（后端 merge_races 派生精选：重赏 > OP/L > 最高班赛 > 新馬/未勝利，最多 4 条）：
 * 展示在「数据概览」色带内的第二行（年份 + 赛名 + 等级徽章）。赛名去等级尾缀、徽章结构统一复用
 * 共享模块 front/public/race-rows.js（raceNameText / gradeBadge 单一出处）；空数组 → 整行不渲染。 */
function majorWinsStrip(list){
  if(!Array.isArray(list) || !list.length) return '';
  var rr=YJ.raceRows;
  return '<div class="yj-ov-wins"><span class="yj-ov-k">'+esc(YJ.i18n.t("主勝鞍"))+' · MAJOR WINS</span>'+
    list.map(function(w){
      var y=String(w.日付||'').slice(0,4);
      return '<span class="yj-ov-win">'+
        (y?'<span class="yj-ov-win-y">'+esc(y)+'</span>':'')+
        '<span class="yj-ov-win-n">'+esc(rr.raceNameText(w))+'</span>'+rr.gradeBadge(w.格)+'</span>';
    }).join('')+'</div>';
}

function render(h){
  var t=YJ.i18n.t;
  var title = h.自译馬名 || h.欧字馬名 || YJ.util.splitName(h.馬名).name || YJ.util.fallbackName(h);

  /* 草稿叠加视图 hv：五字段未提交值盖在 basic 值上（null=恢复官方值 → 保持 basic 值不覆写） */
  var dOv = draftOv(h.id), dPh = draftPh(h.id);
  var hv = h;
  if (dOv) {
    hv = {}; for (var dk in h) hv[dk] = h[dk];
    for (var ek in dOv) { if (ek.charAt(0) === "_") continue; if (dOv[ek] !== null) hv[ek] = dOv[ek]; }
  }

  /* ── 上段 · 图片 + 基本信息 + 血统（一体式，无卡片无分割线）── */

  /* ── 名字区：日本 / 英文 / 港译 / 自译 同款排版（上小标签 + 下名字），一行，/ 分隔 ── */
  var ncol=function(lbl,v,big){
    return '<div class="flex min-w-0 flex-col justify-center">'+
      '<span class="text-[10.5px] font-semibold uppercase tracking-[1.5px] '+(big?'text-primary':'text-muted-foreground')+'">'+lbl+'</span>'+
      '<span class="mt-0.5 whitespace-nowrap '+(big?'text-[30px] font-bold leading-tight text-foreground':'text-[19px] font-semibold leading-tight text-secondary-foreground')+'">'+esc(v)+'</span></div>';
  };
  /* 空值槽位：名字固定四格（日文/英文/港译/自译），缺名保留位置显示弱化「—」（沿用全站缺失=—惯例），
   * 标签与名字都比真值淡，一眼区分空槽 vs 数据；四格全空回退「母名の生年」（与选马器列表同款兜底） */
  var nslot=function(lbl){
    return '<div class="flex min-w-0 flex-col justify-center">'+
      '<span class="text-[10.5px] font-semibold uppercase tracking-[1.5px] text-muted-foreground/70">'+lbl+'</span>'+
      '<span class="mt-0.5 text-[19px] font-normal leading-tight text-muted-foreground/60">—</span></div>';
  };
  /* 槽位按「内容脚本」判定（YJ.util.nameKind），不按字段名硬分：海外登録马的 馬名
   * 本身就是拉丁名（且 netkeiba 无 JRA 登録名 → 欧字馬名 抓空），硬分会让拉丁名挂上「日文」标签。
   * 主名 = 第一个非空槽（原来固定第一格，日文槽为空时会把弱化「—」放大成主名）。 */
  var jpSlot = (YJ.util.nameKind(h.馬名) === 'jp') ? YJ.util.splitName(h.馬名).name : '';
  var enSlot = h.欧字馬名 || (jpSlot ? '' : YJ.util.splitName(h.馬名).name);
  var slots = [
    { lbl: '日文', v: jpSlot },
    { lbl: '英文', v: enSlot },
    { lbl: '港译', v: h.香港馬名 },
    { lbl: '自译', v: h.自译馬名 }
  ];
  var bigIdx = 0;
  for (var si = 0; si < slots.length; si++) { if (slots[si].v) { bigIdx = si; break; } }
  if (!slots[bigIdx].v) slots[bigIdx].v = YJ.util.fallbackName(h);   /* 四格全空 → 母名の生年（无母名才退 #id） */
  var names = slots.map(function (s, i) {
    return s.v ? ncol(s.lbl, s.v, i === bigIdx) : nslot(s.lbl);
  });
  var sep='<span class="mb-0.5 select-none text-[15px] font-light text-muted-foreground/45">/</span>';
  /* 马名含义（basic.json `馬名意味` = studbook 意味・由来 原文）：名字行下方弱化一行。
   * 数据侧 268/277 有值，档案页此前从未展示；空值整行不渲染（不留「—」占位 —— 它是名字的注解，不是档案必填项）。
   * 标签复用 i18n FIELD 既有词条（馬名意味 → 马名含义，零字典改动），正文保留日文原文并标 lang。 */
  var meaning=String(hv.馬名意味||'').trim();
  var meaningLine=meaning
    ? '<div class="mt-3 flex min-w-0 items-baseline gap-2.5 max-md:mt-2 max-md:flex-col max-md:items-start max-md:gap-1">'+
        '<span class="flex-none text-[10.5px] font-semibold uppercase tracking-[1.5px] text-muted-foreground/80">'+esc(t("馬名意味"))+'</span>'+
        '<span lang="ja" class="min-w-0 text-[13px] leading-relaxed text-secondary-foreground max-md:text-[12px]">'+esc(meaning)+'</span>'+
      '</div>'
    : '';
  var nameHeader='<div class="flex min-w-0 flex-col"><div class="flex min-w-0 flex-wrap items-end gap-x-6 gap-y-3">'+names.join(sep)+'</div>'+meaningLine+'</div>';

  /* ── 上段整体：照片（左，铺满占大） + 基本信息 + 血统（右，窄列，成为一体）── */
  var fi=function(k,v,field){
    var dm = (field && dOv && Object.prototype.hasOwnProperty.call(dOv, field) && dOv[field] !== null)
      ? '<span class="flex-none rounded bg-chart3/15 px-1 py-px text-[9.5px] font-bold text-chart3" title="编辑台草稿 · 未提交">草稿</span>' : '';
    return '<div class="flex min-w-0 items-center gap-3 bg-card px-4 py-[9px]"><span class="w-[80px] flex-none text-[11.5px] uppercase tracking-[.5px] text-muted-foreground">'+esc(k)+'</span><span class="min-w-0 flex-1 text-[13.5px] font-medium text-foreground">'+v+'</span>'+dm+'</div>';
  };
  /* JRA 登录状态箭头链（2026-10 去向调查）：渲染单一出处 = public/yj-util.js statusChain
   * （编辑台预览共用 §48）。草稿预览时 hv 已被 draftOv 逐键叠加 → 自动反映草稿值。 */
  var stBadge=YJ.util.statusChain(hv);
  /* 当前性别（YJ.util.sexOf：后端 性別_当前 优先，回退官方 性別）。官方 性別 是「登录性别」，
   * 无 JRA 登录的海外马去势后 netkeiba/JBIS 都不回写，逐场记录才是当期事实 → 只展示当期值。 */
  var info='<div class="grid grid-cols-1 gap-px overflow-hidden rounded-[10px] border border-border bg-border">'+
    fi(t("性別"), sexBadge(sexOf(hv)), "性別")+
    fi(t("生年月日"), esc(hv.生年月日||"—"))+
    fi(t("登録状態"), stBadge, "登録状態")+
    fi(t("毛色"), esc(YJ.i18n.e("毛色",hv.毛色)||"—"), "毛色")+
    fi(t("馬齢"), esc(hv.馬齢||"—"))+
    fi(t("産地"), esc(hv.産地||"—"))+
    fi(t("馬主"), esc(hv.馬主||"—"), "馬主")+
    fi(t("調教師"), esc(hv.調教師||"—"), "調教師")+
    fi(t("生産牧場"), esc(hv.生産牧場||"—"))+
    fi(t("セリ取引価格"), esc(hv.セリ取引価格||"—"))+
  '</div>';
  /* 血统图：fitFrames 撑到 max(内容高度, 右栏高度)，内容矮时填满对齐资料表、内容高时撑开整块 */
  var pedBlock='<div class="pedcard overflow-hidden rounded-[10px] border border-border bg-card">'+
    '<div class="p-3"><iframe class="pedframe w-full bg-background" src="pedigree.html?embed=1" title="血统图"></iframe></div>'+
  '</div>';
  /* 上段宽度比例（PC）：左中右三栏 1:1:1 等高（照片 / 基本信息 / 血统图）。
   * 容器等高由 items-stretch 保证，总高度以基本资料表为基准；
   * mb 端退回单列纵向 max-md:flex-col。 */
  var basicBlock='<div class="mt-6 flex items-stretch gap-6 max-md:flex-col max-md:gap-4">'+
    avatarHTML(h.photo)+
    '<div class="min-w-0 flex-1">'+info+'</div>'+
    '<div class="min-w-0 flex-1">'+pedBlock+'</div></div>';

  /* ── 中段 · 数据概览（v11 色带方案 · S9 晨雾光晕：渐变描边+径向雾，成绩|三率|三赏金一条带；皮肤见 theme.css .yj-ov-*）── */
  /* 比率：n/total → "40%"；total 0 → "—" */
  function ratePct(n,t){ return t>0 ? (Math.round(n/t*1000)/10)+"%" : "—"; }

  /* 通算战绩 = 后端逐场全量派生（h.通算成績_逐场，含海外台账场）。
   * 不再解析官方 通算成績 字符串：那份只覆盖 netkeiba 收录的比赛，海外马会因此显示「未出赛」。
   * 括号四段 [1着-2着-3着-着外]（§76 去掉首位出走段——「x战x胜」主数字已含总场数，不重复；
   * 与 datechart/stats 同格式），后端已保证 1着+2着+3着+着外 == 出走。 */
  var car = h.通算成績_逐场 || null;
  var starts = car ? (car.出走 || 0) : 0;
  var isNR = starts <= 0;
  var mainBig = isNR ? '未出赛' : (starts + '战' + (car['1着'] || 0) + '胜');
  var brack = isNR ? '' : ('[' + [car['1着'], car['2着'], car['3着'], car['着外']].join('-') + ']');

  /* 収得賞金：主数字=平地；障害/Jpn 非 0 才显示副行 */
  var prize=h.収得賞金||{};
  var prizeFlat=(prize.平地&&prize.平地!==0&&prize.平地!=="0")?String(prize.平地):"";
  var prizeSub=[];
  if(prize.障害&&prize.障害!==0&&prize.障害!=="0") prizeSub.push('障害 '+prize.障害);
  if(prize.Jpn&&prize.Jpn!==0&&prize.Jpn!=="0") prizeSub.push('Jpn '+prize.Jpn);

  var money=function(raw){
    raw=(raw==null||raw==="")?"—":String(raw);
    var u=/万円/.test(raw)?"万円":"";
    var v=u?raw.replace(/万円$/,""):raw;
    /* 0 → 显示「—」：海外场只记战绩不带赏金，0 是正常缺失而非抓漏（用户定稿） */
    if(parseFloat(String(v).replace(/,/g,""))===0) return {v:"—", u:""};
    return {v:v, u:u};
  };

  var mC=money(h["獲得賞金 (中央)"]), mL=money(h["獲得賞金 (地方)"]), mF=money(prizeFlat);

  /* 色带格子：皮肤（渐变描边/径向雾/分格线/mb 堆叠）全部在 theme.css .yj-ov-*，此处只出结构 */
  /* 主胜鞍：色带第二行；空数组整行不渲染（不占色带高度，也不留空行） */
  var winsStrip=majorWinsStrip(hv.主勝鞍);
  var ovRate=function(v,k,hi){
    return '<div class="yj-ov-rate'+(hi?' yj-ov-hi':'')+'"><span class="yj-ov-k">'+esc(k)+'</span><b>'+esc(v)+'</b></div>';
  };
  var ovM=function(k,m,sub){
    var dim=(m.v==="0"||m.v==="—")?' yj-ov-dim':'';
    return '<div class="yj-ov-m"><span class="yj-ov-k">'+esc(k)+'</span><b'+dim+'>'+esc(m.v)+(m.u?'<em>'+esc(m.u)+'</em>':'')+'</b>'+
      (sub?'<div class="yj-ov-sub">'+esc(sub)+'</div>':'')+'</div>';
  };

  var statsBand='<div class="mt-10">'+
    '<div class="mb-4 flex items-center gap-2.5"><span class="h-4 w-1 flex-none rounded bg-primary"></span><span class="text-[13px] font-bold uppercase tracking-[1px] text-secondary-foreground">数据概览 · OVERVIEW</span></div>'+
    '<div class="yj-ov-outer"><div class="yj-ov-band">'+
      '<div class="yj-ov-rec"><span class="yj-ov-lab">通算成績 · RECORD</span>'+
        '<span class="yj-ov-big">'+esc(mainBig)+'</span>'+
        (brack?'<span class="yj-ov-br">'+esc(brack)+'</span>':'')+
      '</div>'+
      ovRate(ratePct(car?car['1着']:0, starts), "胜率", true)+
      ovRate(ratePct(car?(car['1着']+car['2着']):0, starts), "连对率", false)+
      ovRate(ratePct(car?(car['1着']+car['2着']+car['3着']):0, starts), "复胜率", false)+
      '<div class="yj-ov-prizes">'+
        ovM(t("獲得賞金 (中央)"), mC)+
        ovM(t("獲得賞金 (地方)"), mL)+
        ovM(t("収得賞金"), mF, prizeSub.length?prizeSub.join(' · '):'')+
      '</div>'+
      winsStrip+
    '</div></div></div>';

  /* ── 下段 · 比赛记录（内嵌 iframe 无边框）── */
  var raceSection='<div class="mt-10">'+
    '<div class="mb-2.5 flex items-center gap-2.5">'+
      '<span class="h-4 w-1 flex-none rounded bg-primary"></span>'+
      '<span class="text-[13px] font-bold uppercase tracking-[1px] text-secondary-foreground">比赛记录 · RACES</span>'+
      '<a class="flex-none text-[12px] font-semibold text-accent-foreground hover:text-primary hover:underline" href="races.html?horse='+encodeURIComponent(h.id)+'">详细数据→</a>'+
    '</div>'+
    '<iframe class="raceframe w-full bg-background" src="races.html?embed=1" title="比赛记录"></iframe></div>';

  document.title=title+' · 基本信息 · '+YJ_SITE.name;
  /* 草稿预览提示条：本马在编辑台有未提交改动（含图片草稿张数）时才出现 */
  var ribbon = "";
  if (draftHas(h.id)) {
    var dN = draftFieldCount(h.id), dP = draftPh(h.id);
    ribbon = '<div class="mb-5 flex flex-wrap items-center gap-x-3 gap-y-1.5 rounded-[10px] border border-border bg-chart3/10 px-4 py-2.5 text-[12px]">'+
      '<b class="flex-none font-bold text-chart3">草稿预览</b>'+
      '<span class="min-w-0 text-muted-foreground">编辑台未提交的改动已叠加显示'+
        (dN ? ' · 字段 '+dN+' 处' : '')+
        (dP ? ' · 图片'+(dP.mode==="remove" ? '恢复官方值' : '草稿 '+dP.list.length+' 张（未提交不显示）') : '')+
        ' · 提交后约 2 分钟全站生效</span>'+
      (EDIT_MODE ? '<a class="ml-auto flex-none font-semibold text-chart3 underline underline-offset-2 hover:text-primary max-md:hidden" href="edit.html?id='+encodeURIComponent(h.id)+'">回编辑台 ↗</a>' : '')+'</div>';
  }
  document.getElementById("body").innerHTML =
    ribbon+
    '<section id="sec-basic" class="scroll-mt-2">'+nameHeader+basicBlock+'</section>'+
    '<section id="sec-stats" class="scroll-mt-2">'+statsBand+'</section>'+
    '<section id="sec-races" class="scroll-mt-2">'+raceSection+'</section>';

  avatarBind(); /* 多图相册：绑定点击切换 */

  /* 通知内嵌 races / 血统联动 */
  YJ.bus.broadcast(h.id);
  [".raceframe",".pedframe"].forEach(function(sel){
    var fr=document.querySelector(sel);
    if(fr && fr.contentWindow) fr.contentWindow.postMessage({type:"yj:horse", id:h.id},"*");
  });

  /* iframe 高度自适应（与嵌入内容融为一体，避免空白框） */
  fitFrames();
}

YJ.selector.init({
  el: document.getElementById("selector"),
  base: YJ_DATA.url('basic.json'),
  /* 常驻列表仅 pc 端（≥768 两栏布局）使用；mb 端面积小，退回弹层式下拉（聚焦展开、点外/Esc 收起）
   * doubleName：PC 常驻列表与 mb 下拉均双格式显示马名（日文/英文 + 港译/自译） */
  persistent: YJ.device.isPc(),
  doubleName: true,
  onSelect: function(h){
    render(h);
    if(YJ.device.isMb()) window.scrollTo({top:0}); else if(detailCol) detailCol.scrollTop=0;
  }
}).then(function(horses){
  renderOverview(horses);
  /* 从外部（如 races 页全库查询结果）带 ?horse=id 跳转定位（query 解析单一出处 = YJ.util.qs） */
  var horseId=YJ.util.qs("horse");
  if(horseId && YJ.selector.selectById) YJ.selector.selectById(horseId);
}).catch(function(e){
  document.getElementById("body").innerHTML='<div class="px-5 py-[60px] text-center text-[13px] text-muted-foreground">数据加载失败（'+esc(e.message)+'），请通过 http 服务器访问</div>';
});

/* 血统「完整 5 代」：内嵌 iframe 弹窗会困在小框内，改为通知本页，在本页打开完整弹窗 */
window.addEventListener("message", function(e){
  var d=e.data;
  if(d && d.type==="yj:pedigreeFull" && window.YJ && YJ.pedigree){
    YJ.pedigree.openModal(d.ped, d.title);
  }
});
</script>
</body>
</html>
