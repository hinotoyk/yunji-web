<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基本信息 · 云迹</title>
<link rel="stylesheet" href="theme.css">
<style>
/* 仅布局微调（骨架无法用 utility 表达的部分，如 iframe 初始高度）
 * 详情为「上中下」一体式版面：无卡片、无分割线，靠留白/背景层次/字体层级分区。
 * iframe 均无外框，嵌入内容与页面融为一体；高度由 fitFrames() 自适应。 */
.raceframe{height:520px}
.pedframe{height:200px}
@media (max-width:768px){ .raceframe{height:520px} .pedframe{height:200px} }
</style>
</head>
<body class="bg-background text-foreground antialiased">
<div class="flex h-screen flex-col max-md:h-auto">

  <!-- 页头 -->
  <header class="page-title w-full flex-none px-6 pt-[18px] pb-4 max-md:px-3.5 max-md:pt-4 max-md:pb-3">基本信息 · PROFILE</header>

  <!-- 两栏：左=常驻过滤搜索 / 右=详情（目录 = 外壳侧边栏，已存在；铺满内容区避免两侧留白） -->
  <div class="grid w-full min-h-0 flex-1 grid-cols-[350px_minmax(0,1fr)] gap-5 px-6 pb-6 max-md:block max-md:gap-4 max-md:px-3.5 max-md:pb-12">

    <!-- 左：常驻过滤式搜索（复用原搜索框，缩短宽度；下拉做成常驻列表） -->
    <div class="flex min-h-0 flex-col max-md:h-auto">
      <div id="selector" class="min-h-0 flex-1 max-md:h-auto"></div>
    </div>

    <!-- 右：详情 -->
    <main id="detailCol" class="yj-pane relative min-h-0 overflow-y-auto pr-1.5 max-md:h-auto max-md:overflow-visible max-md:pr-0">
      <div id="body" class="min-h-full"></div>
    </main>
  </div>
</div>

<script src="../data-config.js"></script>
<script src="../yj-util.js?v=2"></script>
<script src="../loading.js?v=2"></script>
<script src="../i18n.js"></script>
<script src="../selector.js?v=6"></script>
<script src="../bus.js?v=1"></script>
<script src="../device.js"></script>
<script src="../pedigree.js"></script>
<script>
var esc = YJ.util.esc;  /* HTML 转义：单一出处 public/yj-util.js */
var sexOf = YJ.util.sexOf;  /* 当前性别（性別_当前 优先，回退官方 性別）：单一出处同上 */

/* ── 钉住标记（OPTIMIZATION_PLAN §4.4 末条 + §4.6）───────────────────────────────
 * 人工表 data/manual_overrides.json 只读探测：哪匹马的哪个字段是人钉的值。与 basic.json
 * 并行拉；拿不到（404 / 离线 / 结构不合法）静默按「无钉住」处理 → 页面 DOM 与接线前完全一致。
 * 浏览页只做两件事：行尾一枚 📌 + 点击跳 edit.html?id=<id> 定位该马；
 * 解除/改钉等编辑动作全部收在编辑页（D6），这里不放按钮。 */
var PINS = {};            /* overrides 本体；'_' 前缀键（_readme/_examples/_note/_orig）一律无视 */
var currentH = null;      /* 当前渲染的马：钉住表晚于详情到达时用它补渲染一次 */
/* 基本信息行 → 人工表里能命中的字段名（性別行同时认后端逐场派生的 性別_当前；photo = 头像区） */
var PIN_ROW = {
  "photo": ["photo"],
  "性別": ["性別", "性別_当前"],
  "登録状態": ["登録状態"],
  "毛色": ["毛色"],
  "馬主": ["馬主"],
  "調教師": ["調教師"]
};
/* 标记样式只用既有 utility 类（theme.css 归后续阶段所有，本次不新增类） */
var PIN_CLS = "flex-none cursor-pointer rounded-full border border-transparent px-1 text-[11px] leading-[1.5] opacity-60 transition hover:border-primary/40 hover:opacity-100";
var PIN_CLS_ABS = "absolute left-2.5 top-2.5 z-10 cursor-pointer rounded-full border border-black/10 bg-white/85 px-1 text-[11px] leading-[1.5] opacity-80 shadow-sm transition hover:opacity-100";

function pinEntry(id){
  var e = PINS[String(id)];
  return (e && typeof e === "object" && !Array.isArray(e)) ? e : null;
}
/* 该行命中的钉住字段（无 → ""）。认「键存在」而非「值非空」：留空也是钉住的一种（解除 = 删键）。 */
function pinField(id, rowKey){
  var e = pinEntry(id);
  if (!e) return "";
  var fs = PIN_ROW[rowKey] || [];
  for (var i = 0; i < fs.length; i++) {
    if (fs[i].charAt(0) !== "_" && Object.prototype.hasOwnProperty.call(e, fs[i])) return fs[i];
  }
  return "";
}
function hasPin(id){
  for (var k in PIN_ROW) { if (pinField(id, k)) return true; }
  return false;
}
function pinMark(id, rowKey, cls){
  var f = pinField(id, rowKey);
  if (!f) return "";
  var v = pinEntry(id)[f];
  var shown = (v && typeof v === "object") ? (Array.isArray(v) ? v.length + " 张" : "（复合值）")
    : (v === "" ? "（空）" : String(v));
  return '<button type="button" class="' + cls + '" data-edit="' + esc(id) + '" title="' +
    esc("人工保存值 · " + YJ.i18n.t(f) + "（" + f + "）：" + shown + " · 点击到编辑页核对/恢复官方值") + '">📌</button>';
}
function loadPins(){
  fetch(YJ_DATA.url("manual_overrides.json"), { cache: "no-store" }).then(function(r){
    return r.ok ? r.json() : null;
  }).then(function(o){
    if (o && typeof o === "object" && !Array.isArray(o)) PINS = o;
    /* 表比详情晚到（basic.json 命中共享缓存 → 秒选）：当前马确有钉住才补渲染一次，否则零动作 */
    if (currentH && hasPin(currentH.id) && !document.querySelector("[data-edit]")) render(currentH);
  }, function(){ /* 取不到 = 无钉住，静默降级 */ });
}

/* 性别徽章（沿用搜索列表的配色语言：牡/牝/セン 原生显示） */
function sexBadge(v){
  if(v==="牡") return '<span class="inline-flex items-center rounded-full bg-[#C9EFFE] px-2 py-0.5 text-[11px] font-bold leading-[1.6] text-[#0B5A8C]">♂ 牡</span>';
  if(v==="牝") return '<span class="inline-flex items-center rounded-full bg-[#FFDBD5] px-2 py-0.5 text-[11px] font-bold leading-[1.6] text-[#B03A30]">♀ 牝</span>';
  if(v==="セ") return '<span class="inline-flex items-center rounded-full bg-[#EFEFEF] px-2 py-0.5 text-[11px] font-bold leading-[1.6] text-[#5A5A5A]">⚲ セン</span>';
  return esc(v||"—");
}

/* iframe 高度自适应：嵌入内容随内容伸缩，避免无边框下的空白框。
 * 血统图(pedframe)：高度取 max(内容高, 所在栏高) —— 内容矮时填满右栏与资料表对齐，内容高时撑开整块 */
function fitFrames(){
  [".pedframe",".raceframe"].forEach(function(sel){
    var fr=document.querySelector(sel);
    if(!fr) return;
    var tries=0;
    (function tick(){
      if(tries++>50) return;
      try{
        var w=fr.contentWindow, d=w&&w.document;
        if(!d) return;
        var h=Math.max(d.body?d.body.scrollHeight:0, d.documentElement?d.documentElement.scrollHeight:0);
        if(h>40 && Math.abs(h-fr.offsetHeight)>2){
          var minH=0;
          if(sel===".pedframe"){
            var card=fr.closest?fr.closest(".pedcard"):null;
            if(card) minH=Math.max(0,card.offsetHeight-24); /* p-3 上下 padding 各 12px */
          }
          fr.style.height=Math.min(Math.max(h,minH),1400)+"px";
        }
      }catch(e){}
      setTimeout(tick,180);
    })();
  });
}

/* 头像：photo 兼容 数组/网络/本地；多图 → 相册：点击左/右切换，悬停提示
 * 照片区为弹性大区域（flex-1 撑满剩余宽度）；照片完整展示（object-contain + max 约束，
 * 不拉伸不裁切），铺满宽度/高度中取最大适配，放不下/不够大时居中 */
function avatarHTML(photo, id){
  var list=[];
  if(Array.isArray(photo)) list=photo.slice();
  else if(typeof photo==="string" && photo) list=[photo];
  list=list.filter(function(p){return p;});
  var wrap='relative flex min-h-[340px] min-w-0 flex-1 items-center justify-center overflow-hidden rounded-[14px] border border-border bg-muted/20 max-md:h-[240px] max-md:min-h-0 max-md:flex-none max-md:w-full';
  /* photo 被人工钉住 → 角上一枚标记（贴左上，右上被多图计数徽标占了）；无钉住时 pinMark 出空串，DOM 一字不改 */
  var mark = id==null ? "" : pinMark(id, "photo", PIN_CLS_ABS);
  if(!list.length) return '<div class="'+wrap+'"><span class="text-[64px] text-muted-foreground opacity-50">🐎</span>'+mark+'</div>';
  list=list.map(function(p){ return (String(p).indexOf("data/")===0) ? YJ_DATA.url(p) : p; });
  /* 图片标记统一走 YJ.ui.img：loading=lazy + decoding=async + 写死占位尺寸（防 CLS）。
   * 占位盒由上面的 wrap（min-h-[340px] / mb 240px）承担，width/height 给的是库内实拍比例 1108×1477，
   * 让浏览器在解码前就定好比例；object-contain + absolute inset-0 再由 CSS 覆盖实际渲染尺寸。 */
  if(list.length===1){
    return '<div class="'+wrap+'">'+YJ.ui.img({src:list[0], cls:'absolute inset-0 h-full w-full object-contain', w:1108, h:1477,
      attrs:'alt="头像" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=&quot;text-[64px] text-muted-foreground opacity-50&quot;>🐎</span>\'"'})+mark+'</div>';
  }
  return '<div class="'+wrap+' group" data-photos="'+esc(list.join("|"))+'">'+
    YJ.ui.img({src:list[0], cls:'pav-img absolute inset-0 h-full w-full object-contain', w:1108, h:1477, alt:'头像', attrs:'onerror="this.style.display=\'none\'"'})+
    '<button type="button" class="pav-nav pav-prev absolute top-1/2 left-2.5 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full bg-transparent text-[34px] font-light leading-none text-foreground/90 [text-shadow:0_1px_1px_rgba(0,0,0,0.3),0_0_12px_rgba(255,255,255,0.85)] transition-all duration-200 hover:scale-110 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/60 cursor-pointer select-none" title="上一张">‹</button>'+
    '<button type="button" class="pav-nav pav-next absolute top-1/2 right-2.5 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full bg-transparent text-[34px] font-light leading-none text-foreground/90 [text-shadow:0_1px_1px_rgba(0,0,0,0.3),0_0_12px_rgba(255,255,255,0.85)] transition-all duration-200 hover:scale-110 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/60 cursor-pointer select-none" title="下一张">›</button>'+
    '<div class="pav-count absolute top-2.5 right-3 rounded-full border border-black/15 bg-white/90 px-2.5 py-0.5 text-[11px] font-semibold tabular-nums tracking-[.5px] text-foreground/75 shadow-md backdrop-blur-sm">1/'+list.length+'</div>'+
    mark+
  '</div>';
}

/* 相册切换：点击左半/右半 → 上一张/下一张（‹ › 箭头同理，环形循环） */
function avatarBind(){
  var el=document.querySelector(".pava.multi") || document.querySelector("[data-photos]");
  if(!el) return;
  var photos=el.getAttribute("data-photos").split("|");
  var img=el.querySelector(".pav-img");
  var count=el.querySelector(".pav-count");
  var idx=0;
  /* 相邻一张预加载（§5.3.2）：头像已改 loading=lazy，切换时不该再等一次网络往返；
   * 同一 src 只预拉一次（seen 去重），环形序列 = 下一张 + 上一张 */
  var seen={};
  function preload(n){
    var src=photos[((n%photos.length)+photos.length)%photos.length];
    if(!src || seen[src]) return;
    seen[src]=1;
    var im=new Image();
    im.decoding="async";
    im.src=src;
  }
  function show(n){
    idx=(n+photos.length)%photos.length;
    img.src=photos[idx];
    if(!img.decoding) img.decoding="async";
    count.textContent=(idx+1)+"/"+photos.length;
    preload(idx+1); preload(idx-1);
  }
  preload(1); preload(photos.length-1);   /* 首图已在外层懒加载，先把两端挂上 */
  el.addEventListener("click",function(e){
    if(e.target && e.target.closest && e.target.closest("[data-edit]")) return;   /* 点钉住标记 = 跳编辑页，不算切图 */
    var rect=el.getBoundingClientRect();
    if(e.clientX-rect.left < rect.width/2) show(idx-1); else show(idx+1);
  });
  var prev=el.querySelector(".pav-prev"), next=el.querySelector(".pav-next");
  if(prev) prev.addEventListener("click",function(e){e.stopPropagation();show(idx-1);});
  if(next) next.addEventListener("click",function(e){e.stopPropagation();show(idx+1);});
}

var detailCol=document.getElementById("detailCol");

/* 未选马：目录总览（让右侧不空白，兼做引导）。
 * 概览卡 = 实时合计等式：收录产驹总数 = 各年出生数之和（由 basic.json 现场聚合，
 * 数据新增年份自动扩展；非年份数值兜底排最后，保证「总和 = 各年之和」恒成立） */
function renderOverview(hs){
  var total=hs.length;
  var byYear={}, bySex={};
  hs.forEach(function(h){
    var y=h.生年||'未知'; byYear[y]=(byYear[y]||0)+1;
    var s=sexOf(h);
    if(s==='セ') s='セン'; /* セ/セン 两种写法都算骟马 */
    if(s) bySex[s]=(bySex[s]||0)+1;
  });
  var years=Object.keys(byYear).sort(function(a,b){
    var na=parseInt(a,10), nb=parseInt(b,10);
    var ka=isNaN(na), kb=isNaN(nb);
    if(ka||kb) return ka===kb?0:(ka?1:-1); /* 非年份（未知）排最后 */
    return nb-na; /* 年份降序，最新在前 */
  });
  var stat=function(v,k,hi){ return '<div class="flex flex-col items-start justify-center rounded-md bg-muted/30 px-4 py-3.5"><div class="text-[22px] font-semibold leading-tight '+(hi?'text-primary':'')+'">'+esc(v)+'</div><div class="mt-0.5 text-[12px] text-secondary-foreground">'+esc(k)+'</div></div>'; };
  var group=function(label, sub, inner){
    return '<div class="flex min-h-0 flex-1 flex-col rounded-[10px] border border-border bg-card p-5">'+
      '<div class="mb-3 flex items-baseline gap-2"><span class="text-[12px] font-bold uppercase tracking-[1px] text-secondary-foreground">'+label+'</span>'+(sub?'<span class="text-[10.5px] tracking-[.5px] text-muted-foreground">'+sub+'</span>':'')+'</div>'+
      inner+'</div>';
  };
  var sexName={'牡':'牡马','牝':'牝马','セン':'骟马'};
  /* 概览 · PC：等式排版 总和（青绿大数）= 年份白卡 + 年份白卡 + …（flex-wrap 兜底，年份增多自动折行）；mb 隐藏 */
  var op=function(s){ return '<span class="flex-none self-center text-[20px] font-semibold leading-none text-foreground/75">'+s+'</span>'; };
  var yearTile=function(y){
    return '<div class="flex flex-col rounded-[10px] bg-card px-5 py-3.5 shadow-[0_2px_12px_rgba(16,24,40,.08)]">'+
      '<div class="text-[24px] font-bold leading-none tracking-[-.2px] text-foreground tabular-nums">'+esc(byYear[y])+'</div>'+
      '<div class="mt-1.5 whitespace-nowrap text-[12px] text-muted-foreground">'+esc(y)+' 年生</div></div>';
  };
  var statHTML=
    group('概览','OVERVIEW',
      /* PC：等式（mb 端隐藏） */
      '<div class="flex min-h-0 flex-1 flex-wrap content-center items-center gap-x-3.5 gap-y-3 max-md:hidden">'+
        '<div class="mr-1 flex flex-col"><div class="text-[30px] font-bold leading-none tracking-[-.2px] text-primary tabular-nums">'+esc(total)+'</div>'+
        '<div class="mt-1.5 whitespace-nowrap text-[12.5px] font-medium text-secondary-foreground">收录产驹总数</div></div>'+
        op('=')+
        years.map(function(y){ return yearTile(y); }).join(op('+'))+
      '</div>'+
      /* mb（≤768）：不做 =/+，直接展示 —— 总数通栏 + 年份 2 列网格统计卡 */
      '<div class="hidden max-md:grid max-md:flex-1 max-md:grid-cols-2 max-md:gap-3">'+
        '<div class="max-md:col-span-2">'+stat(total,'收录产驹总数',true)+'</div>'+
        years.map(function(y){ return stat(byYear[y], y+' 年生',''); }).join('')+
      '</div>')+
    group('性别','BY SEX',
      '<div class="grid min-h-0 flex-1 grid-cols-3 gap-3">'+
        ['牡','牝','セン'].map(function(s){ return stat(bySex[s]||0, sexName[s], ''); }).join('')+
      '</div>');
  document.getElementById("body").innerHTML =
    '<div class="flex min-h-full flex-col gap-4">'+
      '<div class="rounded-[10px] border border-border bg-card p-6">'+
        '<div class="text-[17px] font-bold">云迹 · コントレイル产驹资料库</div>'+
        '<div class="mt-1.5 text-[13px] text-muted-foreground">请在左侧搜索栏输入 日文名 / 英文名 / 港译名 / 自译名 / 母名 / 马主 / 调教师 / 生产牧场，或从列表中直接选择一匹马，查看其基本信息。</div>'+
      '</div>'+statHTML+
    '</div>';
}

function render(h){
  currentH = h;                 /* 钉住表晚于详情到达时按它补渲染（见 loadPins） */
  var t=YJ.i18n.t;
  var title = h.自译馬名 || h.欧字馬名 || YJ.util.splitName(h.馬名).name || YJ.util.fallbackName(h);

  /* ── 上段 · 图片 + 基本信息 + 血统（一体式，无卡片无分割线）── */

  /* ── 名字区：日本 / 英文 / 港译 / 自译 同款排版（上小标签 + 下名字），一行，/ 分隔 ── */
  var ncol=function(lbl,v,big){
    return '<div class="flex min-w-0 flex-col justify-center">'+
      '<span class="text-[10.5px] font-semibold uppercase tracking-[1.5px] '+(big?'text-primary':'text-muted-foreground')+'">'+lbl+'</span>'+
      '<span class="mt-0.5 whitespace-nowrap '+(big?'text-[30px] font-bold leading-tight text-foreground':'text-[19px] font-semibold leading-tight text-secondary-foreground')+'">'+esc(v)+'</span></div>';
  };
  /* 空值槽位：名字固定四格（日文/英文/港译/自译），缺名保留位置显示弱化「—」（沿用全站缺失=—惯例），
   * 标签与名字都比真值淡，一眼区分空槽 vs 数据；四格全空回退「母名の生年」（与选马器列表同款兜底） */
  var nslot=function(lbl){
    return '<div class="flex min-w-0 flex-col justify-center">'+
      '<span class="text-[10.5px] font-semibold uppercase tracking-[1.5px] text-muted-foreground/70">'+lbl+'</span>'+
      '<span class="mt-0.5 text-[19px] font-normal leading-tight text-muted-foreground/60">—</span></div>';
  };
  /* 槽位按「内容脚本」判定（YJ.util.nameKind），不按字段名硬分：海外登録马的 馬名
   * 本身就是拉丁名（且 netkeiba 无 JRA 登録名 → 欧字馬名 抓空），硬分会让拉丁名挂上「日文」标签。
   * 主名 = 第一个非空槽（原来固定第一格，日文槽为空时会把弱化「—」放大成主名）。 */
  var jpSlot = (YJ.util.nameKind(h.馬名) === 'jp') ? YJ.util.splitName(h.馬名).name : '';
  var enSlot = h.欧字馬名 || (jpSlot ? '' : YJ.util.splitName(h.馬名).name);
  var slots = [
    { lbl: '日文', v: jpSlot },
    { lbl: '英文', v: enSlot },
    { lbl: '港译', v: h.香港馬名 },
    { lbl: '自译', v: h.自译馬名 }
  ];
  var bigIdx = 0;
  for (var si = 0; si < slots.length; si++) { if (slots[si].v) { bigIdx = si; break; } }
  if (!slots[bigIdx].v) slots[bigIdx].v = YJ.util.fallbackName(h);   /* 四格全空 → 母名の生年（无母名才退 #id） */
  var names = slots.map(function (s, i) {
    return s.v ? ncol(s.lbl, s.v, i === bigIdx) : nslot(s.lbl);
  });
  var sep='<span class="mb-0.5 select-none text-[15px] font-light text-muted-foreground/45">/</span>';
  var nameHeader='<div class="flex min-w-0 flex-wrap items-end gap-x-6 gap-y-3">'+names.join(sep)+'</div>';

  /* ── 上段整体：照片（左，铺满占大） + 基本信息 + 血统（右，窄列，成为一体）── */
  var fi=function(k,v,field){
    return '<div class="flex min-w-0 items-center gap-3 bg-card px-4 py-[9px]"><span class="w-[80px] flex-none text-[11.5px] uppercase tracking-[.5px] text-muted-foreground">'+esc(k)+'</span><span class="min-w-0 flex-1 text-[13.5px] font-medium text-foreground">'+v+'</span>'+(field?pinMark(h.id,field,PIN_CLS):'')+'</div>';
  };
  var stBadge=h.登録状態 ? (h.登録状態==="現役"
    ? '<span class="inline-flex items-center rounded-full bg-accent px-2 py-[2px] text-[11.5px] font-semibold text-accent-foreground">现役</span>'
    : '<span class="inline-flex items-center rounded-full bg-muted px-2 py-[2px] text-[11.5px] font-medium text-muted-foreground">'+esc(YJ.i18n.e("登録状態",h.登録状態))+'</span>')
    : '<span class="text-muted-foreground">—</span>';
  /* 当前性别（YJ.util.sexOf：后端 性別_当前 优先，回退官方 性別）。官方 性別 是「登录性别」，
   * 无 JRA 登录的海外马去势后 netkeiba/JBIS 都不回写，逐场记录才是当期事实 → 只展示当期值。 */
  var info='<div class="grid grid-cols-1 gap-px overflow-hidden rounded-[10px] border border-border bg-border">'+
    fi(t("性別"), sexBadge(sexOf(h)), "性別")+
    fi(t("生年月日"), esc(h.生年月日||"—"))+
    fi(t("登録状態"), stBadge, "登録状態")+
    fi(t("毛色"), esc(YJ.i18n.e("毛色",h.毛色)||"—"), "毛色")+
    fi(t("馬齢"), esc(h.馬齢||"—"))+
    fi(t("産地"), esc(h.産地||"—"))+
    fi(t("馬主"), esc(h.馬主||"—"), "馬主")+
    fi(t("調教師"), esc(h.調教師||"—"), "調教師")+
    fi(t("生産牧場"), esc(h.生産牧場||"—"))+
    fi(t("セリ取引価格"), esc(h.セリ取引価格||"—"))+
  '</div>';
  /* 血统图：fitFrames 撑到 max(内容高度, 右栏高度)，内容矮时填满对齐资料表、内容高时撑开整块 */
  var pedBlock='<div class="pedcard overflow-hidden rounded-[10px] border border-border bg-card">'+
    '<div class="p-3"><iframe class="pedframe w-full bg-background" src="pedigree.html?embed=1" title="血统图"></iframe></div>'+
  '</div>';
  /* 上段宽度比例（PC）：左中右三栏 1:1:1 等高（照片 / 基本信息 / 血统图）。
   * 容器等高由 items-stretch 保证，总高度以基本资料表为基准；
   * mb 端退回单列纵向 max-md:flex-col。 */
  var basicBlock='<div class="mt-6 flex items-stretch gap-6 max-md:flex-col max-md:gap-4">'+
    avatarHTML(h.photo, h.id)+
    '<div class="min-w-0 flex-1">'+info+'</div>'+
    '<div class="min-w-0 flex-1">'+pedBlock+'</div></div>';

  /* ── 中段 · 数据概览（v11 色带方案 · S9 晨雾光晕：渐变描边+径向雾，成绩|三率|三赏金一条带；皮肤见 theme.css .yj-ov-*）── */
  /* 比率：n/total → "40%"；total 0 → "—" */
  function ratePct(n,t){ return t>0 ? (Math.round(n/t*1000)/10)+"%" : "—"; }

  /* 通算战绩 = 后端逐场全量派生（h.通算成績_逐场，含海外台账场）。
   * 不再解析官方 通算成績 字符串：那份只覆盖 netkeiba 收录的比赛，海外马会因此显示「未出赛」。
   * 括号五段 [出走-1着-2着-3着-着外]（§65，与 datechart/stats 同格式）；
   * 后端已保证 1着+2着+3着+着外 == 出走，故首段与后四段之和必然相等。 */
  var car = h.通算成績_逐场 || null;
  var starts = car ? (car.出走 || 0) : 0;
  var isNR = starts <= 0;
  var mainBig = isNR ? '未出赛' : (starts + '战' + (car['1着'] || 0) + '胜');
  var brack = isNR ? '' : ('[' + [starts, car['1着'], car['2着'], car['3着'], car['着外']].join('-') + ']');

  /* 収得賞金：主数字=平地；障害/Jpn 非 0 才显示副行 */
  var prize=h.収得賞金||{};
  var prizeFlat=(prize.平地&&prize.平地!==0&&prize.平地!=="0")?String(prize.平地):"";
  var prizeSub=[];
  if(prize.障害&&prize.障害!==0&&prize.障害!=="0") prizeSub.push('障害 '+prize.障害);
  if(prize.Jpn&&prize.Jpn!==0&&prize.Jpn!=="0") prizeSub.push('Jpn '+prize.Jpn);

  var money=function(raw){
    raw=(raw==null||raw==="")?"—":String(raw);
    var u=/万円/.test(raw)?"万円":"";
    var v=u?raw.replace(/万円$/,""):raw;
    /* 0 → 显示「—」：海外场只记战绩不带赏金，0 是正常缺失而非抓漏（用户定稿） */
    if(parseFloat(String(v).replace(/,/g,""))===0) return {v:"—", u:""};
    return {v:v, u:u};
  };

  var mC=money(h["獲得賞金 (中央)"]), mL=money(h["獲得賞金 (地方)"]), mF=money(prizeFlat);

  /* 色带格子：皮肤（渐变描边/径向雾/分格线/mb 堆叠）全部在 theme.css .yj-ov-*，此处只出结构 */
  var ovRate=function(v,k,hi){
    return '<div class="yj-ov-rate'+(hi?' yj-ov-hi':'')+'"><span class="yj-ov-k">'+esc(k)+'</span><b>'+esc(v)+'</b></div>';
  };
  var ovM=function(k,m,sub){
    var dim=(m.v==="0"||m.v==="—")?' yj-ov-dim':'';
    return '<div class="yj-ov-m"><span class="yj-ov-k">'+esc(k)+'</span><b'+dim+'>'+esc(m.v)+(m.u?'<em>'+esc(m.u)+'</em>':'')+'</b>'+
      (sub?'<div class="yj-ov-sub">'+esc(sub)+'</div>':'')+'</div>';
  };

  var statsBand='<div class="mt-10">'+
    '<div class="mb-4 flex items-center gap-2.5"><span class="h-4 w-1 flex-none rounded bg-primary"></span><span class="text-[13px] font-bold uppercase tracking-[1px] text-secondary-foreground">数据概览 · OVERVIEW</span></div>'+
    '<div class="yj-ov-outer"><div class="yj-ov-band">'+
      '<div class="yj-ov-rec"><span class="yj-ov-lab">通算成績 · RECORD</span>'+
        '<span class="yj-ov-big">'+esc(mainBig)+'</span>'+
        (brack?'<span class="yj-ov-br">'+esc(brack)+'</span>':'')+
      '</div>'+
      ovRate(ratePct(car?car['1着']:0, starts), "胜率", true)+
      ovRate(ratePct(car?(car['1着']+car['2着']):0, starts), "连对率", false)+
      ovRate(ratePct(car?(car['1着']+car['2着']+car['3着']):0, starts), "复胜率", false)+
      '<div class="yj-ov-prizes">'+
        ovM(t("獲得賞金 (中央)"), mC)+
        ovM(t("獲得賞金 (地方)"), mL)+
        ovM(t("収得賞金"), mF, prizeSub.length?prizeSub.join(' · '):'')+
      '</div>'+
    '</div></div></div>';

  /* ── 下段 · 比赛记录（内嵌 iframe 无边框）── */
  var raceSection='<div class="mt-10">'+
    '<div class="mb-2.5 flex items-center gap-2.5">'+
      '<span class="h-4 w-1 flex-none rounded bg-primary"></span>'+
      '<span class="text-[13px] font-bold uppercase tracking-[1px] text-secondary-foreground">比赛记录 · RACES</span>'+
      '<a class="flex-none text-[12px] font-semibold text-accent-foreground hover:text-primary hover:underline" href="races.html?horse='+encodeURIComponent(h.id)+'">详细数据→</a>'+
    '</div>'+
    '<iframe class="raceframe w-full bg-background" src="races.html?embed=1" title="比赛记录"></iframe></div>';

  document.title=title+' · 基本信息 · 云迹';
  document.getElementById("body").innerHTML =
    '<section id="sec-basic" class="scroll-mt-2">'+nameHeader+basicBlock+'</section>'+
    '<section id="sec-stats" class="scroll-mt-2">'+statsBand+'</section>'+
    '<section id="sec-races" class="scroll-mt-2">'+raceSection+'</section>';

  avatarBind(); /* 多图相册：绑定点击切换 */

  /* 通知内嵌 races / 血统联动 */
  YJ.bus.broadcast(h.id);
  [".raceframe",".pedframe"].forEach(function(sel){
    var fr=document.querySelector(sel);
    if(fr && fr.contentWindow) fr.contentWindow.postMessage({type:"yj:horse", id:h.id},"*");
  });

  /* iframe 高度自适应（与嵌入内容融为一体，避免空白框） */
  fitFrames();
}

/* 标记点击 → 跳编辑页并定位该马。profile 本身跑在外壳内容 iframe 里，改 location 即在原框内换页；
 * 事件委托挂 #body（该元素跨渲染常驻，innerHTML 换掉也不用重挂），且无标记时零开销 */
document.getElementById("body").addEventListener("click", function(e){
  var b = e.target && e.target.closest ? e.target.closest("[data-edit]") : null;
  if (!b) return;
  location.href = "edit.html?id=" + encodeURIComponent(b.getAttribute("data-edit"));
});
loadPins();   /* 与 basic.json 并行探测人工表（拿不到 = 无钉住，静默） */

YJ.selector.init({
  el: document.getElementById("selector"),
  base: YJ_DATA.url('basic.json'),
  /* 常驻列表仅 pc 端（≥768 两栏布局）使用；mb 端面积小，退回弹层式下拉（聚焦展开、点外/Esc 收起）
   * doubleName：PC 常驻列表与 mb 下拉均双格式显示马名（日文/英文 + 港译/自译） */
  persistent: YJ.device.isPc(),
  doubleName: true,
  onSelect: function(h){
    render(h);
    if(YJ.device.isMb()) window.scrollTo({top:0}); else if(detailCol) detailCol.scrollTop=0;
  }
}).then(function(horses){
  renderOverview(horses);
  /* 从外部（如 races 页全库查询结果）带 ?horse=id 跳转定位 */
  var m=location.search.match(/[?&]horse=([^&]+)/);
  if(m && YJ.selector.selectById) YJ.selector.selectById(decodeURIComponent(m[1]));
}).catch(function(e){
  document.getElementById("body").innerHTML='<div class="px-5 py-[60px] text-center text-[13px] text-muted-foreground">数据加载失败（'+esc(e.message)+'），请通过 http 服务器访问</div>';
});

/* 血统「完整 5 代」：内嵌 iframe 弹窗会困在小框内，改为通知本页，在本页打开完整弹窗 */
window.addEventListener("message", function(e){
  var d=e.data;
  if(d && d.type==="yj:pedigreeFull" && window.YJ && YJ.pedigree){
    YJ.pedigree.openModal(d.ped, d.title);
  }
});
</script>
</body>
</html>
