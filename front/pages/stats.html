    <div class="card p-4 pt-3.5 max-md:p-3">

        <div class="seg" id="rateSeg"></div>
      </div>
      <div id="curve"></div>
      <div id="curveNote" class="mt-2 text-[12px] text-muted-foreground"></div>

        <summary class="cursor-pointer text-[13px] font-semibold text-foreground select-none">月龄明细表</summary>

<script>
/* ================= 倾向统计 STATS =================
 * 数据：data/stats.json（后端预计算，按 场地类型 × 统计切面 二维聚合：
 *       scopes = { all 全部, yYYYY 自然年(比赛日历年), gYYYY 生产年(产驹生年) }）。
 * 场地范围：JRA/NAR/海外 组合多选，默认 JRA；统计切面：生产年/自然年 + 年份值。
 *           勾选场地在同一切面下的计数相加、比率重算。
 * 倾向矩阵：15 维（距离/竞马场/比赛级别/跑道/马场/人气/性别/体重·牡/体重·牝/赛道方向/母父/骑手/调教师/生产牧场/马主，页签序=用户定稿），
 *           顶行=库内基准；率列 红=低于/绿=高于基准（0.1pt 精度，同显示值）；表头点击排序；行可下钻比赛记录页查询（附带切面 byear/year；
 *           体重/生产牧场/马主四页签亦可下钻——races.html 支持 weight/breeder/owner 筛选键，体重下钻自动附带性别条件）。
 *           距离/比赛级别 按固定序展示（TAB_ORDER：距离由短到长、级别由易到难），体重按 档位升序（<400→400-410…540-550→>550），
 *           人气按 1人気→18人気 固定升序，其余维度按出赛数降序。
 * 口径与 races.html / build_stats.py 一致：三态 / 距离四档 / 人气逐一 / 赛道方向 / 性别归一 / 母父=血统图「母亲的父亲」；
 *       比率分母=出走（完赛+未完赛，取消/除外不计），同 races.html 模块 34。 */
var STATS = null;
var st = { vts: ["中央"], yMode: "gen", yVal: "all", genSel: null, rates: ["win"], sort: { k: "", dir: "desc" }, tab: "dist" };   /* genSel = 图例勾选态（null=全显）；默认页签 = TAB_DIMS 第一个（距离） */

var TAB_DIMS = [
  { k: "dist",    l: "距离",     tip: "短距离≤1400m / 英里1401-1800m / 中距离1801-2400m / 长距离>2400m" },
  { k: "track",   l: "竞马场",   tip: "各竞马场" },
  { k: "grade",   l: "比赛级别", tip: "新马/未胜利/一胜~三胜级/OP/L/Jpn1-3/G1-3/JG1-3/其他" },
  { k: "surf",    l: "跑道",     tip: "草地/泥地/障碍/全天候" },
  { k: "cond",    l: "马场",     tip: "良/稍重/重/不良" },
  { k: "ninki",   l: "人气",     tip: "1人気～18人気 逐一（按人気升序）" },
  { k: "sex",     l: "性别",     tip: "牡/牝/セン" },
  { k: "weight_m", l: "体重·牡", tip: "当日 馬体重（牡，含セン）：400-550kg 每 10kg 一档 + <400 / >550（550 归 540-550；空值不入桶；跳转自动附带 sex:牡+セン）" },
  { k: "weight_f", l: "体重·牝", tip: "当日 馬体重（牝）：400-550kg 每 10kg 一档 + <400 / >550（550 归 540-550；空值不入桶；跳转自动附带 sex:牝）" },
  { k: "turn",    l: "赛道方向", tip: "右转（顺时针）/ 左转（逆时针）" },
  { k: "mps",     l: "母父",     tip: "母亲的父亲（血统图 母の父 格；按出赛数降序）" },
  { k: "jockey",  l: "骑手",     tip: "全部列出，按出赛数从多到少；受马匹实力影响仅供参考" },
  { k: "trainer", l: "调教师",   tip: "全部列出，按出赛数从多到少；受马匹实力影响仅供参考" },
  { k: "breeder", l: "生产牧场", tip: "basic.json 生産牧場 现值（空值不入桶；按出赛数降序；行可跳转）" },
  { k: "owner",   l: "马主",     tip: "basic.json 馬主 现值（空值不入桶；按出赛数降序；行可跳转）" }
];
var SM_F = 20;            /* 出走 < 20 → 样本少 */
var DIM_F = 10;           /* 出走 < 10 → 数字弱化 */
/* 固定展示序（stats.json 内仍按 n 降序，仅渲染时重排；稳定排序，同档保持 n 降序）：
 * 距离 = 由短到长 · 比赛级别 = 由易到难（桶键即中文标签，见 build_stats.py grade_key） */
var TAB_ORDER = {
  dist: ["短距离", "英里", "中距离", "长距离"],
  grade: ["新马", "未胜利", "一胜级", "二胜级", "三胜级", "OP", "L", "Jpn1", "Jpn2", "Jpn3", "G1", "G2", "G3", "JG1", "JG2", "JG3", "其他"],
  weight_m: ["<400", "400-410", "410-420", "420-430", "430-440", "440-450", "450-460", "460-470", "470-480", "480-490", "490-500", "500-510", "510-520", "520-530", "530-540", "540-550", ">550"],   /* 档位升序（同 build_stats.py weight_bin） */
  weight_f: ["<400", "400-410", "410-420", "420-430", "430-440", "440-450", "450-460", "460-470", "470-480", "480-490", "490-500", "500-510", "510-520", "520-530", "530-540", "540-550", ">550"]    /* 同上（牝页签） */
};
var DIST_RANGE = { "短距离": "≤1400m", "英里": "1401-1800m", "中距离": "1801-2400m", "长距离": ">2400m" };
var GEN_COLORS = ["#0aa7a0", "#0f8fd6", "#e8742a"];
/* 年龄成绩曲线指标（seg 可组合多选）：颜色=产年 · 线型=指标（实线/虚线/点线）；分母=出走 */
var RATE_METRICS = [
  { k: "win",  l: "胜率",   dash: "" },
  { k: "ren",  l: "连对率", dash: "6,3" },
  { k: "fuku", l: "复胜率", dash: "2,3" }
];

var esc = YJ.util.esc;  /* HTML 转义：单一出处 public/yj-util.js */
var i18n = YJ.i18n;   /* i18n.js 已在上方显式引入（D4：删去唯一多余的防御 stub） */

/* 着顺浅色三件套（1/2/3着 + 着外）：JS 侧单一出处 = race-rows.js PLACE_BG（CSS 同源 = theme.css .yj-nkm1/2/3）
 * → 着别分布条与图例用它（4 段，完赛口径） */
var BR = YJ.raceRows.PLACE_BG;   /* 通算战绩括号四段配色（= 着顺四段：1/2/3 浅色三件套 + 着外浅灰）：同源 race-rows.js PLACE_BG（§76 去掉首位出走段；D5 合并 BR/CBR 双别名） */

/* KPI 单格 HTML（2026-10-30 UI 审查 §6.2-4）：本文件此前在 renderKpis() 与 srkKpis() 里
 * 各持一份**逐字节相同**的闭包副本，改结构要记得改两处。收口为文件级单一出处。
 * cls：可选强调类（hi = 青绿高亮 / dim = 灰）；结构对应 theme.css 的 .yj-kpi / .k / .v。 */
function kpiHTML(k, v, cls) {
  return '<div class="yj-kpi"><div class="k">' + k + '</div><div class="v' + (cls ? " " + cls : "") + '">' + v + '</div></div>';
}

/* ---- 统计切面：all / yYYYY(自然年) / gYYYY(生产年) ---- */
function scopeKey() {
  return st.yVal === "all" ? "all" : (st.yMode === "gen" ? "g" + st.yVal : "y" + st.yVal);
}
function blkOf(vt) {
  var v = STATS.by_venue[vt];
  return (v && v.scopes) ? (v.scopes[scopeKey()] || null) : null;
}
/* ---- 合并：勾选场地在同一切面下的计数相加 ---- */
function sumInto(t, b) {
  t.n += b.n; t.dnf += b.dnf; t.exc += b.exc; t.w += b.w; t.p2 += b.p2; t.p3 += b.p3;
  if (b.pr) t.pr = (t.pr || 0) + b.pr;
}
function baseMerged() {
  var t = { n: 0, dnf: 0, exc: 0, w: 0, p2: 0, p3: 0, pr: 0 };
  st.vts.forEach(function (vt) { var b = blkOf(vt); if (b) sumInto(t, b.base); });
  return t;
}
function dimMerged(k) {
  var m = {};
  st.vts.forEach(function (vt) {
    var blk = blkOf(vt); if (!blk) return;
    (blk.dims[k] || []).forEach(function (r) {
      var t = m[r.k] || (m[r.k] = { k: r.k, n: 0, dnf: 0, exc: 0, w: 0, p2: 0, p3: 0 });
      sumInto(t, r);
    });
  });
  var arr = [];
  for (var key in m) arr.push(m[key]);
  arr.sort(function (a, b) { return b.n - a.n; });
  return arr;
}
function curveMerged() {
  var m = {};
  st.vts.forEach(function (vt) {
    var blk = blkOf(vt); if (!blk) return;
    blk.curve.forEach(function (c) {
      var t = m[c.gen + "/" + c.a] || (m[c.gen + "/" + c.a] = { gen: c.gen, a: c.a, n: 0, dnf: 0, exc: 0, w: 0, p2: 0, p3: 0 });
      sumInto(t, c);
    });
  });
  var arr = [];
  for (var key in m) arr.push(m[key]);
  arr.sort(function (a, b) { return a.gen === b.gen ? a.a - b.a : (a.gen < b.gen ? -1 : 1); });
  return arr;
}
function trophyMerged() {
  var arr = [];
  st.vts.forEach(function (vt) { var blk = blkOf(vt); if (blk) arr = arr.concat(blk.trophies); });
  arr.sort(function (a, b) { return a.d > b.d ? -1 : a.d < b.d ? 1 : 0; });   /* 明细最新在上（降序） */
  return arr;
}
/* ---- 派生口径 ---- */
function fin(b) { return b.n - b.dnf - b.exc; }      /* 完赛（着别分布用） */
function starts(b) { return b.n - b.exc; }           /* 出走（比率分母，同 races.html 模块 34） */
function rates(b) {
  var f = starts(b);
  return { f: f, win: f ? b.w / f : 0, ren: f ? (b.w + b.p2) / f : 0, fuku: f ? (b.w + b.p2 + b.p3) / f : 0 };
}
var pct1 = function (x) { return (x * 100).toFixed(1); };
var pct = function (x) { return pct1(x) + "%"; };
var manYen = function (pr) { return YJ.util.manYen(pr, "0万"); };   /* 空值 → "0万"（KPI 必须有值）；格式化逻辑单一出处 = YJ.util.manYen（2026-xx 收口） */
var ageLabel = function (a) { return Math.floor(a / 12) + "岁" + (a % 12) + "月"; };

/* ---- ① 数据概览 ---- */
function renderKpis() {
  var b = baseMerged(), r = rates(b);
  /* 通算战绩 [73-70-69-466]：四段 = 1着-2着-3着-着外，末段按**出走**口径（含中止/失格），
   * 与 profile RECORD、datechart 日历同口径 → 四段之和 == 出走（§76 定稿去掉首位出走段，不再重复展示总场数）；
   * 格式保留连字符，四段底色连成一整条（数字格用各段底色，连字符格用「上一色→下一色」渐变接缝） */
  var nStart = starts(b);
  var vals = [b.w, b.p2, b.p3, Math.max(0, nStart - b.w - b.p2 - b.p3)];
  var brk = '<span class="st-brk st-brk-lg">[';
  vals.forEach(function (v, i) {
    if (i) brk += '<i style="background:linear-gradient(90deg,' + BR[i - 1] + ',' + BR[i] + ')">-</i>';
    brk += '<b style="background:' + BR[i] + '">' + v + '</b>';
  });
  brk += ']</span>';
  var tr = trophyMerged().length;
  document.getElementById("kpis").innerHTML =
    kpiHTML("通算战绩", brk) +
    kpiHTML("总赏金", manYen(b.pr)) +
    kpiHTML("重赏胜利", '<span class="st-trophy">🏆</span>' + tr, tr ? "hi" : "dim");
}
function renderDistBar() {
  var b = baseMerged();
  var fvn = fin(b);                       /* 着别分布 = 完赛口径 */
  var other = Math.max(0, fvn - b.w - b.p2 - b.p3);
  var bar;
  if (fvn > 0) {
    var segs = [
      { v: b.w, c: BR[0] }, { v: b.p2, c: BR[1] }, { v: b.p3, c: BR[2] }, { v: other, c: BR[3] }
    ];
    bar = '<div class="st-bar">';
    segs.forEach(function (s) { if (s.v > 0) bar += '<i style="width:' + (s.v / fvn * 100) + '%;background:' + s.c + '"></i>'; });
    bar += '</div>';
  } else {
    bar = '<div class="st-bar"></div>';
  }
  document.getElementById("distBar").innerHTML =
    bar +
    '<div class="mt-1.5 text-[12px] text-muted-foreground">' +
    '1着<b class="st-chip" style="background:' + BR[0] + '"> ' + b.w + '</b> · 2着<b class="st-chip" style="background:' + BR[1] + '"> ' + b.p2 + '</b> · 3着<b class="st-chip" style="background:' + BR[2] + '"> ' + b.p3 +
    '</b> · 着外<b class="st-chip" style="background:' + BR[3] + '"> ' + other + '</b>　（完赛 ' + fvn + ' 场）</div>';
}
function renderRateBand() {
  var b = baseMerged(), r = rates(b);
  var cell = function (lbl, val) {
    return '<span class="st-rate"><span class="lbl">' + lbl + '</span> <b>' + pct(val) + '</b></span>';
  };
  document.getElementById("rateBand").innerHTML =
    cell("胜率", r.win) + cell("连对", r.ren) + cell("复胜", r.fuku);
}
/* ---- 工具条切面控件（生产年/自然年 + 年份值） ---- */
function renderYseg() {
  document.getElementById("ymodeSeg").innerHTML =
    '<button type="button" data-m="gen" data-on="' + (st.yMode === "gen" ? "true" : "false") + '" title="按产驹出生年份切分统计范围">生产年</button>' +
    '<button type="button" data-m="year" data-on="' + (st.yMode === "year" ? "true" : "false") + '" title="按比赛日历年份切分（1月1日–12月31日）">自然年</button>';
  var pre = st.yMode === "gen" ? "g" : "y";
  var years = [];
  ["中央", "地方", "海外"].forEach(function (vt) {
    var scopes = (STATS.by_venue[vt] || {}).scopes || {};
    for (var k in scopes) {
      if (k.charAt(0) === pre && k.length === 5) {
        var y = k.slice(1);
        if (years.indexOf(y) < 0) years.push(y);
      }
    }
  });
  years.sort().reverse();
  var seg = ['<button type="button" data-y="all" data-on="' + (st.yVal === "all" ? "true" : "false") + '">全部</button>'];
  years.forEach(function (y) {
    var lbl = st.yMode === "gen" ? y + "年世代" : y + "年";
    seg.push('<button type="button" data-y="' + y + '" data-on="' + (st.yVal === y ? "true" : "false") + '">' + lbl + '</button>');
  });
  document.getElementById("yseg").innerHTML = seg.join("");
}

/* ---- ④ 年龄成绩曲线（ECharts 定制包 · §145）----
 * 语义沿用 §135：颜色 = 世代 · 线型 = 指标 · 分母 = 出走。
 * 相对原手写 SVG 的五处改动，每处对应一个实测问题（详见 docs/UI优化记录.md §145）：
 *   ① y 轴上界自适应 + 超上界贴顶 —— 原固定 50%，14 颗可靠点全挤在底部 30% 高度里互相压线；
 *      撑满 50% 的其实只有一颗 9 场的 44.4%（噪声）→ 刻度只按可靠点定标，噪声点贴顶画 ▲
 *   ② axis tooltip —— 原只有 SVG <title>，必须精确悬停，触屏完全不可用
 *   ③ 点径编码样本量 —— 原用「空心/实心」区分，两个 3px 圆肉眼几乎分不出
 *   ④ 总体平均参考线 —— 与矩阵「高于/低于总体平均」同口径，灰虚线
 *   ⑤ 图例 = 世代且可点 —— 原 genSeg 下拉 + 自绘图例是两个控件做同一件事
 * 数据：stats.json 的 curve[]（gen 产年 × a 月龄），前端按 场地 × 切面 合并（curveMerged）。 */
var CURVE = { ec: null, meta: [], over: false };   /* meta[seriesIndex] = { gen, mt }：tooltip 靠它把系列反查回「世代 × 指标」；over = 本次有贴顶点 */
function chartFont() { return "'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"; }
function isMb() { return !!(window.matchMedia && window.matchMedia("(max-width: 768px)").matches); }
/* 线型小样背景（seg 按钮用）：dash 串 → repeating-linear-gradient，与 ECharts lineStyle.type 同源 */
function lineBg(m, color) {
  if (!m.dash) return color;
  var on = m.dash === "2,3" ? 2 : 4;
  return "repeating-linear-gradient(90deg," + color + " 0 " + on + "px,transparent " + on + "px " + (on + 3) + "px)";
}
/* dash 串 → ECharts lineStyle.type：'6,3' 这种字符串它不认，必须给数组 */
function lineType(m) { return m.dash ? m.dash.split(",").map(Number) : "solid"; }
/* 可见世代：以图例勾选态 st.genSel 为准（null = 全显） */
function curveGens(pts) {
  var gens = [];
  pts.forEach(function (p) { if (gens.indexOf(p.gen) < 0) gens.push(p.gen); });
  gens.sort();
  return gens.filter(function (g) { return !st.genSel || st.genSel[g + "年世代"] !== false; });
}
function disposeCurve() { if (CURVE.ec) { CURVE.ec.dispose(); CURVE.ec = null; } }

/* 峰值注解 + 口径说明（图例切换时只刷这段与明细表，不重画图，避免动画回放） */
function renderCurveNote(pts) {
  var sel = curveGens(pts);
  var mts = RATE_METRICS.filter(function (m) { return st.rates.indexOf(m.k) >= 0; });
  var notes = [];
  sel.forEach(function (g) {
    mts.forEach(function (m) {
      var peak = null;
      pts.forEach(function (p) {
        if (p.gen !== g || starts(p) < SM_F) return;
        var r = rates(p)[m.k];
        if (!peak || r > peak.r) peak = { r: r, a: p.a };
      });
      if (peak) notes.push(g + "年世代 " + m.l + "峰值 " + ageLabel(peak.a) + " " + pct(peak.r));
    });
  });
  document.getElementById("curveNote").textContent =
    "颜色=世代 · 线型=指标（分母=出走） · 点径=样本量，空心=样本<" + SM_F + (CURVE.over ? "、▲=超出上界" : "") +
    " · 灰虚线=总体平均 · " +
    (notes.length ? "峰值： " + notes.join("； ") + "（样本≥" + SM_F + "）" : "样本均小于" + SM_F + "，仅供参考");
}

/* 月龄明细表（v2 · §135）：行=月龄（升序）· 世代子行，列序与矩阵一致（分母=出走）。
 * 可见世代跟图例走 —— 图例点了什么，表里就只剩什么。 */
function renderCurveTable(pts) {
  var sel = curveGens(pts);
  var rows = [];
  pts.forEach(function (p) { if (sel.indexOf(p.gen) >= 0) rows.push(p); });
  rows.sort(function (a, b) { return a.a === b.a ? (a.gen < b.gen ? -1 : 1) : a.a - b.a; });
  var html = '<table class="st-mat"><thead><tr><th class="left">月龄</th><th class="left">世代</th><th>出走</th><th>1着</th><th>2着</th><th>3着</th><th>着外</th><th>胜率</th><th>连对率</th><th>复胜率</th></tr></thead><tbody>';
  var prevAge = null;
  rows.forEach(function (p, i) {
    var head = p.a !== prevAge;                        /* 组首行：标月龄 */
    prevAge = p.a;
    var r = rates(p);
    html += '<tr' + (head && i > 0 ? ' class="grp"' : "") + '><td class="left' + (head ? " font-semibold" : "") + '">' + (head ? ageLabel(p.a) : "") +
      '</td><td class="left">' + p.gen + '年世代</td><td>' + starts(p) + '</td><td>' + p.w +
      '</td><td>' + p.p2 + '</td><td>' + p.p3 + '</td><td>' + (starts(p) - p.w - p.p2 - p.p3) +
      '</td><td>' + pct(r.win) + '</td><td>' + pct(r.ren) + '</td><td>' + pct(r.fuku) + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById("curveTable").innerHTML = html;
}

function renderCurve() {
  var pts = curveMerged();
  var el = document.getElementById("curve");
  var base = baseMerged(), br = rates(base);

  /* 指标 seg：按钮自带线型小样 —— 「线型=指标」的对应关系由控件自己承担，
   * 于是图例可以只表达世代（少一个维度、少一个控件、少一段自绘图例代码） */
  document.getElementById("rateSeg").innerHTML = RATE_METRICS.map(function (m) {
    return '<button type="button" data-r="' + m.k + '" data-on="' + (st.rates.indexOf(m.k) >= 0 ? "true" : "false") +
      '" title="按月龄查看' + m.l + '（分母=出走，可组合多选）">' +
      '<i class="st-lt" style="background:' + lineBg(m, "#52525b") + '"></i>' + m.l + "</button>";
  }).join("");

  var mts = RATE_METRICS.filter(function (m) { return st.rates.indexOf(m.k) >= 0; });
  var gens = [];
  pts.forEach(function (p) { if (gens.indexOf(p.gen) < 0) gens.push(p.gen); });
  gens.sort();
  if (!gens.length) {
    disposeCurve();
    el.innerHTML = '<div class="hint-empty hint-empty--sm">暂无曲线数据</div>';
    document.getElementById("curveNote").textContent = "";
    document.getElementById("curveTable").innerHTML = "";
    return;
  }
  if (!window.YJ_ECHARTS) {
    disposeCurve();
    el.innerHTML = '<div class="hint-empty hint-empty--sm">图表库（echarts.line.min.js）加载失败，请通过 http 服务器访问</div>';
    return;
  }

  var sel = curveGens(pts);
  var bins = [];
  pts.forEach(function (p) { if (bins.indexOf(p.a) < 0) bins.push(p.a); });
  bins.sort(function (a, b) { return a - b; });
  var colorOf = function (g) { return GEN_COLORS[gens.indexOf(g) % GEN_COLORS.length]; };
  var maxN = 0;
  pts.forEach(function (p) { var s = starts(p); if (s > maxN) maxN = s; });

  var series = [], meta = [];
  sel.forEach(function (g) {
    mts.forEach(function (m) {
      var data = bins.map(function (a) {
        var hit = null;
        for (var i = 0; i < pts.length; i++) if (pts[i].gen === g && pts[i].a === a) { hit = pts[i]; break; }
        if (!hit) return null;
        var f = starts(hit), r = rates(hit), sm = f < SM_F;
        var item = { value: Math.round(r[m.k] * 1000) / 10, n: f, w: hit.w, sm: sm };
        if (sm) item.itemStyle = { color: "#fff", borderColor: colorOf(g), borderWidth: 1.5 };   /* 样本少 = 空心 */
        return item;
      });
      var s = {
        name: g + "年世代",
        type: "line",
        data: data,
        connectNulls: false,                            /* 缺月龄就断开：原手写版直连会让人以为中间有数据 */
        symbol: "circle",
        symbolSize: function (v, p) {
          var n = (p && p.data && p.data.n) || 0;
          return 4 + Math.round(5 * Math.sqrt(maxN ? n / maxN : 0));   /* 4~9px：点径即样本量 */
        },
        lineStyle: { width: 2, type: lineType(m), color: colorOf(g) },
        itemStyle: { color: colorOf(g) },
        emphasis: { focus: "series", scale: 1.5 },
        z: 3
      };
      /* 每个指标一条总体平均参考线；只挂在第一个可见世代上，避免同一条线画多遍 */
      if (g === sel[0]) {
        s.markLine = {
          silent: true, symbol: "none", animation: false,
          lineStyle: { color: "#cfcfd4", type: "dashed", width: 1 },
          label: {
            /* PC 放右端加白底小片：3岁4月以后两条线都在 10~20%，裸字会被线压住；
             * MB 图宽仅 321px，标签无论放哪端都会盖住数据 → 只留虚线，数值交给页脚说明与 y 轴 */
            show: !isMb(), position: "insideEndTop", distance: 1,
            color: "#8a8a8a", fontSize: 10, fontFamily: chartFont(),
            backgroundColor: "rgba(255,255,255,.92)", padding: [1, 4], borderRadius: 3,
            formatter: m.l + "平均 " + pct(br[m.k])
          },
          data: [{ yAxis: Math.round(br[m.k] * 1000) / 10 }]
        };
      }
      series.push(s);
      meta.push({ gen: g, mt: m });
    });
  });
  CURVE.meta = meta;

  /* y 上界自适应（取数据与平均线的较大者，留 12% 顶部余量，对齐到 5%）。
   * 只让「可靠点（出走 ≥ SM_F）」与平均线参与定标 —— 实测 2岁4月 有一颗 9 场的 44.4%，
   * 若参与定标会把上界拉到 50%，于是 14 颗可靠点（6~15.3%）全挤在底部 30% 高度里互相压线。 */
  var ymax = 0;
  series.forEach(function (s) {
    s.data.forEach(function (d) { if (d && !d.sm && d.value > ymax) ymax = d.value; });
  });
  mts.forEach(function (m) { var v = br[m.k] * 100; if (v > ymax) ymax = v; });
  ymax = Math.min(100, Math.max(20, Math.ceil(ymax * 1.12 / 5) * 5));

  /* 超出上界的点：贴顶画成 ▲（真实值留在 d.real，tooltip 与明细表照旧给原值）。
   * 不这么做就只能二选一：要么线冲出画布被裁成「断头」看着像渲染坏了，
   * 要么把上界让给一颗 9 场的点、让 14 颗可靠点挤成一条。 */
  var overCount = 0;
  series.forEach(function (s) {
    s.data.forEach(function (d) {
      if (!d || d.value == null || d.value <= ymax) return;
      d.real = d.value;
      d.value = Math.round(ymax * 0.98 * 10) / 10;
      d.over = true; d.symbol = "triangle"; d.symbolSize = 7;
      overCount++;
    });
  });
  CURVE.over = overCount > 0;

  el.style.height = (isMb() ? 240 : 260) + "px";
  if (!CURVE.ec) {
    el.innerHTML = "";                                  /* 仅首次初始化时清占位；实例存在时清 innerHTML 会移走 canvas */
    CURVE.ec = window.YJ_ECHARTS.init(el, null, { renderer: "canvas" });
    /* 图例点击 = 切换世代可见性。图自己已按 legend 过滤，这里只把明细表与注解跟上 */
    CURVE.ec.on("legendselectchanged", function (e) {
      st.genSel = e.selected;
      var p2 = curveMerged();
      renderCurveTable(p2);
      renderCurveNote(p2);
    });
  } else {
    CURVE.ec.resize();                                  /* 视口/断点变化后高度已改，先同步画布 */
  }

  CURVE.ec.setOption({
    textStyle: { fontFamily: chartFont() },
    animationDuration: 600, animationEasing: "cubicOut",
    grid: { left: 4, right: 14, top: 32, bottom: 4, containLabel: true },
    legend: {
      top: 0, right: 0, itemGap: 18, itemWidth: 14, itemHeight: 3, icon: "roundRect",
      textStyle: { color: "#52525b", fontSize: 12, fontFamily: chartFont() },
      inactiveColor: "#c9c9ce",
      data: gens.map(function (g) { return g + "年世代"; }),
      selected: st.genSel || {}
    },
    tooltip: {
      trigger: "axis", confine: true,
      axisPointer: { type: "line", lineStyle: { color: "#d4d4d8", type: "dashed" } },
      backgroundColor: "rgba(255,255,255,.97)", borderColor: "#e4e4e7", padding: [8, 10],
      textStyle: { color: "#171717", fontSize: 12, fontFamily: chartFont() },
      formatter: function (ps) {
        if (!ps || !ps.length) return "";
        var out = '<div style="font-weight:600;margin-bottom:3px">' + esc(ps[0].axisValue) + "</div>";
        ps.forEach(function (p) {
          if (!p.data) return;
          var mm = CURVE.meta[p.seriesIndex] || {};
          var real = p.data.real == null ? p.value : p.data.real;   /* 贴顶点：报真实值，不报被钳住的高度 */
          out += '<div style="margin-top:2px"><i style="display:inline-block;width:9px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;background:' + p.color + '"></i>' +
            '<span style="color:#52525b">' + (mm.gen || "") + "年世代 " + (mm.mt ? mm.mt.l : "") + "</span> " +
            "<b>" + real + "%</b>" + (p.data.over ? '<span style="color:#a1a1aa"> ▲超出上界</span>' : "") +
            '<span style="color:#a1a1aa;margin-left:6px">出走' + p.data.n + (p.data.sm ? " · 样本少" : "") + "</span></div>";
        });
        return out;
      }
    },
    xAxis: {
      type: "category", data: bins.map(ageLabel), boundaryGap: false,
      axisLine: { lineStyle: { color: "#e4e4e7" } }, axisTick: { show: false },
      axisLabel: { color: "#8a8a8a", fontSize: 10.5, fontFamily: chartFont(), hideOverlap: true, margin: 8 },
      splitLine: { show: false }
    },
    yAxis: {
      /* 不写 splitNumber：min/max 固定时 ECharts 默认切 5 段 → 0/10/20/30/40/50 整值；
       * 写 splitNumber:3 会切出 0/20/50 这种非等距的丑刻度（实测） */
      type: "value", min: 0, max: ymax,
      axisLine: { show: false }, axisTick: { show: false },
      splitLine: { lineStyle: { color: "#f2f2f2" } },
      axisLabel: { color: "#a1a1aa", fontSize: 10.5, fontFamily: chartFont(), formatter: "{value}%" }
    },
    series: series
  }, { notMerge: true });

  renderCurveNote(pts);
  renderCurveTable(pts);
}

/* ---- ② 倾向矩阵 ---- */
/* 页签渲染；keepView=true 时（用户点击触发）把选中页签滑入视野——
 * MB 页签栏是单行横滑容器，点右侧页签后若不管，选中项会停在视口外、看不到自己选了什么。
 * 初始化/数据刷新不传该参数：否则 block:"nearest" 会把页面直接滚到矩阵处。 */
function renderTabs(keepView) {
  document.getElementById("matTabs").innerHTML = TAB_DIMS.map(function (d) {
    return '<button type="button" class="st-tab" data-tab="' + d.k + '" data-on="' + (st.tab === d.k ? "true" : "false") +
      '" title="' + esc(d.tip) + '">' + d.l + '</button>';
  }).join("");
  if (keepView) {
    var on = document.querySelector('#matTabs button[data-on="true"]');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  syncEdges();
}
function surfLabel(k) { return i18n.e("芝ダ", k) || k; }
/* 比率着色：高于总体平均=绿（yj-up），低于=红（yj-down）；按 0.1pt 精度比较（同显示值，显示相同则不着色） */
function rateCell(cur, base) {
  var a = Math.round(cur * 1000), b = Math.round(base * 1000);
  if (a > b) return '<span class="yj-up">' + pct(cur) + '</span>';
  if (a < b) return '<span class="yj-down">' + pct(cur) + '</span>';
  return pct(cur);
}
function drillPairs(tab, k) {
  var pairs = [];
  if (tab === "surf") pairs.push("surface:" + k);
  else if (tab === "dist") pairs.push("dist:" + k);
  else if (tab === "cond") { if (["良", "稍重", "重", "不良"].indexOf(k) < 0) return null; pairs.push("cond:" + k); }
  else if (tab === "turn") pairs.push("turn:" + k);
  else if (tab === "grade") {
    if (k === "一胜级") pairs.push("grade:1勝クラス");
    else if (k === "二胜级") pairs.push("grade:2勝クラス");
    else if (k === "三胜级") pairs.push("grade:3勝クラス");
    else if (["新马", "未胜利", "OP", "L", "Jpn1", "Jpn2", "Jpn3", "G1", "G2", "G3", "JG1", "JG2", "JG3"].indexOf(k) >= 0) pairs.push("grade:" + k);
    else return null;
  }
  else if (tab === "ninki") pairs.push("ninki:" + k);
  else if (tab === "mps") pairs.push("mps:" + k);
  else if (tab === "sex") pairs.push("sex:" + k);
  else if (tab === "track") pairs.push("track:" + k);
  else if (tab === "trainer") pairs.push("trainer:" + k);
  else if (tab === "jockey") pairs.push("jockey:" + k);
  else if (tab === "weight_m") { pairs.push("weight:" + k); pairs.push("sex:牡"); pairs.push("sex:セン"); }   /* 体重·牡 = weight + 性别（含セン，与页签口径一致） */
  else if (tab === "weight_f") { pairs.push("weight:" + k); pairs.push("sex:牝"); }
  else if (tab === "breeder") pairs.push("breeder:" + k);
  else if (tab === "owner") pairs.push("owner:" + k);
  else return null;
  st.vts.forEach(function (v) { pairs.push("venue:" + v); });
  if (st.yVal !== "all") pairs.push((st.yMode === "gen" ? "byear:" : "year:") + st.yVal);   /* 切面随下钻 */
  return pairs;
}
function drillURL(tab, k) {
  var pairs = drillPairs(tab, k);
  return pairs ? "races.html?f=" + encodeURIComponent(pairs.join(",")) : "";
}
function bucketLabel(tab, k) {
  if (tab === "grade") return k;                     /* 桶键即中文标签（build_stats.py grade_key） */
  if (tab === "turn") return k === "右" ? "右转" : k === "左" ? "左转" : k;
  return surfLabel(k);
}
/* 类别格 HTML：距离维把「名称 + 范围」拆成两段（§144）——
 * 原先拼成一个字符串「中距离 1801-2400m」，窄屏 71px 列宽下会折成 3 行、行高失控；
 * 拆开后 PC 同行（范围降为次级灰字，层次更清）、MB 强制两行（名称一行 · 范围一行）。 */
function catHtml(tab, k) {
  var l = esc(bucketLabel(tab, k));
  if (tab === "dist" && DIST_RANGE[k]) {
    return '<span class="st-c1">' + l + '</span><span class="st-c2">' + esc(DIST_RANGE[k]) + '</span>';
  }
  return l;
}
/* 表格 HTML 构建（renderTable 与 人气高度离屏实测 applyMatScroll 共用，保证参考高度与实际渲染一致） */
function matHtml(tab) {
  var base = baseMerged(), br = rates(base);
  var rows = dimMerged(tab);
  var order = TAB_ORDER[tab];
  if (tab === "ninki") {                               /* 人气固定序：1人気→18人気 数字升序（桶键=数字字符串逐一，不写死清单，>18人気 出现也自动续排） */
    rows = rows.slice().sort(function (a, b) { return parseInt(a.k, 10) - parseInt(b.k, 10); });
  } else if (order) {                                  /* 固定展示序：距离由短到长 · 级别由易到难 */
    var rank = {};
    order.forEach(function (k, i) { rank[k] = i; });
    rows = rows.slice().sort(function (a, b) {
      var ra = rank[a.k] != null ? rank[a.k] : order.length;
      var rb = rank[b.k] != null ? rank[b.k] : order.length;
      return ra - rb;                                  /* 稳定排序：同档保持 n 降序 */
    });
  }
  /* 着别 1/2/3着/着外 = 纯数字无样式（v3 用户拍板：彩字/浅底胶囊方案均废止，见 docs/UI优化记录.md §44）；8 个数值列表头可点击排序 */
  var COLS = [
    { k: "starts", l: "出走" },
    { k: "w",      l: "1着" },
    { k: "p2",     l: "2着" },
    { k: "p3",     l: "3着" },
    { k: "out",    l: "着外" },
    { k: "win",    l: "胜率" },
    { k: "ren",    l: "连对" },
    { k: "fuku",   l: "复胜" }
  ];
  var valOf = function (k, b, r) {
    if (k === "starts") return starts(b);
    if (k === "out") return Math.max(0, starts(b) - b.w - b.p2 - b.p3);   /* 出走口径（含未完走）→ 一行加得起来 */
    if (k === "win" || k === "ren" || k === "fuku") return r[k];
    return b[k];                                       /* w / p2 / p3 */
  };
  if (st.sort.k) {
    var dir = st.sort.dir === "asc" ? 1 : -1;          /* 稳定排序，同值保持 出赛数降序 */
    rows = rows.slice().sort(function (a, c) {
      var va = valOf(st.sort.k, a, rates(a)), vc = valOf(st.sort.k, c, rates(c));
      return va === vc ? 0 : (va < vc ? -dir : dir);
    });
  }
  var ths = COLS.map(function (c) {
    var on = st.sort.k === c.k;
    return '<th data-sk="' + c.k + '" title="点击按' + c.l + '排序（再点切换升/降序）">' + c.l +
      '<span class="st-sa' + (on ? " on" : "") + '">' + (on ? (st.sort.dir === "asc" ? "↑" : "↓") : "⇅") + '</span></th>';
  }).join("");
  /* 出走列数据条的分母 = **本页签数据行里的最大出走**（不含基准行）。
   * 不能拿基准行当分母：基准行是各档之和（恒为最大），切到调教师/骑手这类「档多而每档都小」的页签时
   * 每档都只剩 2~3%，条全部糊成一条细线、完全失去比较作用。以最多档为 100% 才能横向比出「哪档数据多」。 */
  var maxN = 0;
  rows.forEach(function (b) { var s = starts(b); if (s > maxN) maxN = s; });
  var html = '<thead><tr><th class="left">类别</th>' + ths + '</tr></thead><tbody>';
  var baseOut = Math.max(0, starts(base) - base.w - base.p2 - base.p3);
  html += '<tr class="base" title="当前勾选范围（场地×切面）的整体平均"><td class="left">总体平均</td><td>' + starts(base) + '</td>' +
    '<td>' + base.w + '</td>' +
    '<td>' + base.p2 + '</td>' +
    '<td>' + base.p3 + '</td>' +
    '<td>' + baseOut + '</td>' +
    '<td>' + pct(br.win) + '</td><td>' + pct(br.ren) + '</td><td>' + pct(br.fuku) + '</td></tr>';
  rows.forEach(function (b) {
    var r = rates(b);
    var url = drillURL(tab, b.k);
    var sm = r.f < SM_F ? '<span class="yj-sm">样本少</span>' : "";
    var dimCls = r.f < DIM_F ? ' class="dim"' : "";
    var rowOut = Math.max(0, starts(b) - b.w - b.p2 - b.p3);
    var td = function (v) { return '<td' + dimCls + '>' + v + '</td>'; };
    html += '<tr' + (url ? ' class="yj-drill" data-href="' + esc(url) + '" title="点击查看该条件下的比赛记录"' : "") + '>' +
      '<td class="left">' + catHtml(tab, b.k) + sm + '</td>' +
      /* 出走格：--nb = 样本量条宽度（相对最大出走），CSS 侧 .st-nb 画成格内数据条 */
      '<td class="st-nb' + (r.f < DIM_F ? ' dim' : '') + '" style="--nb:' + (maxN ? Math.round(starts(b) / maxN * 100) : 0) + '%">' + starts(b) + '</td>' +
      td(b.w) +
      td(b.p2) +
      td(b.p3) +
      td(rowOut) +
      td(rateCell(r.win, br.win)) +
      td(rateCell(r.ren, br.ren)) +
      td(rateCell(r.fuku, br.fuku)) +
      '</tr>';
  });
  html += '</tbody>';
  return html;
}
function renderTable() {
  var tab = st.tab;
  document.getElementById("matTable").innerHTML = matHtml(tab);
  /* 数据条说明只在 PC 出现（MB 侧 .st-nb 已关掉数据条，留着等于给看不见的东西写图例） */
  var note = '红=低于总体平均 · 绿=高于总体平均（分母=出走） · <span class="st-pc-only">出走列数据条 = 该档样本量（相对最多档） · </span>样本少 = 出走&lt;' + SM_F + " · 点击行可查看该条件下的全部比赛 · 点击表头按该列排序";
  if (tab === "trainer" || tab === "jockey") {
    note = "调教师/骑手全部列出，按出赛数从多到少。胜率受马匹实力与配对影响，仅供参考。";
  } else if (tab === "breeder" || tab === "owner") {
    note = "生产牧场/马主取 basic.json 现值（空值不入桶），按出赛数从多到少；受马匹实力影响，仅供参考；行可跳转比赛记录。";
  } else if (tab === "weight_m" || tab === "weight_f") {
    note = "体重 = 该场比赛登记的 馬体重（当日值；" + (tab === "weight_m" ? "牡，含セン" : "牝") +
      "；400-550kg 每 10kg 一档 + <400 / >550，550 归 540-550）；空值不入桶 → 行合计 ≤ 总出走；跳转自动附带性别条件。";
  }
  document.getElementById("matNote").innerHTML = note;
  syncEdges();                                          /* 换页签后表宽会变（标签长短不一）→ 重判是否溢出 */
}
/* ---- 倾向矩阵纵向滚动：容器 max-height = 「人气」页签完整展示高度 ----
 * 用同一构建代码（matHtml("ninki")）离屏实测：表头 + 基准行 + 全部人气行，
 * 行高随视口宽度/字体/换行自适应，无需写死像素；加载与 resize（防抖）时重测。
 * 当前页签内容更矮 → 容器自然收缩；更高（调教师/骑手/竞马场等）→ 出现竖向滚动条。 */
function applyMatScroll() {
  var wrap = document.getElementById("matWrap");
  if (!wrap || !document.createElement || !STATS) return;   /* stub/无量测环境：不裁切 */
  /* 表头实测高度 → sticky 基准行的 top 偏移（§144）。写死 px 在字体回退/缩放下会错位，
   * 错位后滚动时基准行上沿会漏出被覆盖的行。每次重渲染/重测都刷新。 */
  var head = document.querySelector("#matTable thead");
  if (head) wrap.style.setProperty("--st-th", Math.round(head.getBoundingClientRect().height) + "px");
  var probe = document.createElement("table");
  probe.className = "st-mat";
  probe.style.cssText = "position:absolute;left:0;top:0;visibility:hidden";   /* 脱离文档流叠在原表上，含块 = matWrap（relative），宽度一致才量得准 */
  probe.innerHTML = matHtml("ninki");
  wrap.appendChild(probe);
  var h = probe.offsetHeight;
  wrap.removeChild(probe);
  if (h > 0) {
    wrap.style.overflowY = "auto";
    wrap.style.maxHeight = h + "px";
  }
}
/* ---- 横向溢出提示（§144）----
 * 页签栏（MB 单行横滑）与矩阵容器（窄屏可能溢出）统一处理：内容右侧还有没滑出来的部分时
 * 打 data-edge="more" → CSS 给右缘渐隐（矩阵另加首列投影）；滑到末端或本来不溢出 → "end"，一切恢复原样。
 * 不做 JS 的话「能横滑」这件事在触屏上完全没有视觉线索，用户会以为列被裁掉了。 */
function syncEdges() {
  ["matTabs", "matWrap"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    /* 容差 4px：表头排序图标用负外边距悬在文字右侧，会给表格留下 3px 级的「幻影溢出」
     * （实测 table.scrollWidth 324 / 实际列宽合计 321），按 2px 判会把满宽表格误判成可横滑、
     * 平白给首列加一道投影。真溢出至少是一整列（≥20px），4px 不会漏判。 */
    var more = el.scrollWidth - el.clientWidth - el.scrollLeft > 4;
    el.setAttribute("data-edge", more ? "more" : "end");
  });
}
["matTabs", "matWrap"].forEach(function (id) {
  var el = document.getElementById(id);
  if (el) el.addEventListener("scroll", syncEdges, { passive: true });
});

/* ---- ③ 种马榜走势（2026-10-27 · 跨站引用 jbis-sire-rank-history）----
 * 数据 = YJ_DATA.remote.jbisRank + derived/sire-history/<board>/<jbis_id>.json（arg 型缓存条目 sireRank，
 *        TTL 12h · 断网回退旧缓存，与全站产物同一控制器）；图表 = 该站发布的纯渲染组件
 *        embed/sire-rank-chart.js（window.JBIS_RANK_EMBED，只画图不 fetch 不写存储）。
 * 本节口径 = JBIS 榜单（賞金・全般・万円），与页面工具条（basic.json 口径）相互独立。 */
var SRK = { dim: "g23", div: "central" };   /* 默认 = 23年世代・中央（首产世代，2026-10-27 与用户定稿） */
/* 图表色 = tailwind.config chart1/chart2 对齐值：主题未发 CSS 变量（chart2 键无连字符），
 * SVG 属性与图例拿不到 var(--*)，页面内单一定义、图例与组件入参同源（组件默认回退值与此一致）。 */
var SRK_COLORS = { prize: "#0aa7a0", rank: "#0f8fd6" };
function srkLegend() {   /* v1.3.0 定稿：名次副图去除，名次 = 跳增标注内嵌（+金额（N位））与 tooltip */
  document.getElementById("srkLegend").innerHTML =
    '<span><i style="background:' + SRK_COLORS.prize + '"></i>赏金</span>' +
    '<span><i style="background:' + SRK_COLORS.prize + ';opacity:.55"></i>单日增量</span>';
}
var SRK_DIMS = [
  { k: "年度", l: "年度",     tip: "年度別サイアー（全部产驹，JBIS 当前年度集計）" },
  { k: "g23",  l: "23年世代", tip: "世代別サイアー 2023年生（首产世代）" },
  { k: "g24",  l: "24年世代", tip: "世代別サイアー 2024年生（当年 2歳世代）" }
];
var SRK_DIVS = [ { k: "central", l: "中央" }, { k: "overall", l: "総合" } ];
var SRK_TYPE = { "年度|central": "t2-annual-central", "年度|overall": "t3-annual-overall",
                 "g23|central": "t4-gen-central", "g23|overall": "t5-gen-overall",
                 "g24|central": "t4-gen-central", "g24|overall": "t5-gen-overall" };
function srkBoard() {   /* 缓存 arg = "<board>/<jbisId>"（REG.url 原样拼进 derived/sire-history/ 下）；
                         * 板 id = 类型@年度（年度板随自然年滚动，世代板出生年固定），马 ID = YJ_SITE.jbisId（config/sire.json 单源） */
  return SRK_TYPE[SRK.dim + "|" + SRK.div] + "@" +
    (SRK.dim === "年度" ? new Date().getFullYear() : SRK.dim === "g23" ? 2023 : 2024) +
    "/" + (YJ_SITE.jbisId || "");
}
var srkEmbedP = null;
function srkEmbed() {   /* 图表组件脚本只加载一次；加载失败可重试（重置 Promise） */
  if (!srkEmbedP) {
    srkEmbedP = new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = YJ_DATA.remote.jbisRank + "embed/sire-rank-chart.js";
      s.onload = function () { res(); };
      s.onerror = function () { srkEmbedP = null; rej(new Error("图表组件加载失败")); };
      document.head.appendChild(s);
    });
  }
  return srkEmbedP;
}
function srkKpis(data) {
  var his = data.history || [];
  var last = his[his.length - 1] || {}, prev = his.length > 1 ? his[his.length - 2] : null;
  /* 赏金格式复用 YJ.util.manYen（§48 单一出处；入参円，derived 口径万円 ×1e4） */
  var dp = prev && last.prizeOverall != null && prev.prizeOverall != null ? last.prizeOverall - prev.prizeOverall : null;
  var dpHtml = dp == null ? "—" : dp === 0 ? "±0" :
    '<span class="' + (dp > 0 ? "yj-up" : "yj-down") + '">' + (dp > 0 ? "+" : "−") + manYen(Math.abs(dp) * 10000) + "</span>";
  var rank = last.rank;
  document.getElementById("srkKpis").innerHTML =
    kpiHTML("当前赏金", last.prizeOverall != null ? manYen(last.prizeOverall * 10000) : "—", "hi") +
    kpiHTML("排名", rank == null ? "—" : "第" + rank + "位", rank != null && rank <= 3 ? "hi" : "") +
    kpiHTML("较前快照", dpHtml) +
    kpiHTML("最新快照", last.date ? last.date.slice(5).replace("-", "/") : "—", "dim");
}
var srkSeq = 0;
function renderSireRank() {
  var el = document.getElementById("srkChart");
  var board = srkBoard(), seq = ++srkSeq;   /* 过期渲染丢弃：切板后迟到的旧数据不回写 */
  document.getElementById("srkDimSeg").innerHTML = SRK_DIMS.map(function (d) {
    return '<button type="button" data-d="' + d.k + '" data-on="' + (SRK.dim === d.k ? "true" : "false") +
      '" title="' + esc(d.tip) + '">' + d.l + '</button>';
  }).join("");
  document.getElementById("srkDivSeg").innerHTML = SRK_DIVS.map(function (d) {
    return '<button type="button" data-v="' + d.k + '" data-on="' + (SRK.div === d.k ? "true" : "false") + '">' + d.l + '</button>';
  }).join("");
  srkLegend();
  document.getElementById("srkKpis").innerHTML = "";
  /* 跨站组件 + 跨站数据，冷加载可感（§149）：全局 spinner 占位（loading.js 缺失退回纯文案） */
  el.innerHTML = (window.YJ && YJ.ui && YJ.ui.spin)
    ? YJ.ui.spin({ label: "加载种马榜走势…" })
    : '<div class="hint-empty">読み込み中…</div>';
  Promise.all([YJ.cache.fetch("sireRank", { arg: board }), srkEmbed()]).then(function (r) {
    if (seq !== srkSeq) return;
    window.JBIS_RANK_EMBED.render(el, r[0], {
      style: "combo",      /* 2026-10-27 用户定稿：单面板（平滑累计+渐变面积）+ 增量柱共用 y 轴；名次副图 v1.3.0 去除 */
      annotate: true,      /* 跳增日标注「+金额（名次）」 */
      colors: SRK_COLORS,
      labels: { prize: "赏金", rank: "名次", delta: "单日增量", empty: "暂无快照数据" }
    });
    srkKpis(r[0]);
  }).catch(function (e) {
    if (seq !== srkSeq) return;
    el.innerHTML = '<div class="hint-empty">数据加载失败（' + esc(e.message || "网络异常") +
      '） · <button type="button" id="srkRetry" class="underline text-primary">重试</button></div>';
    document.getElementById("srkRetry").addEventListener("click", renderSireRank);
  });
}
document.getElementById("srkDimSeg").addEventListener("click", function (e) {
  var btn = e.target.closest ? e.target.closest("button[data-d]") : null;
  if (!btn || SRK.dim === btn.getAttribute("data-d")) return;
  SRK.dim = btn.getAttribute("data-d");
  renderSireRank();
});
document.getElementById("srkDivSeg").addEventListener("click", function (e) {
  var btn = e.target.closest ? e.target.closest("button[data-v]") : null;
  if (!btn || SRK.div === btn.getAttribute("data-v")) return;
  SRK.div = btn.getAttribute("data-v");
  renderSireRank();
});

/* ---- 渲染入口 ---- */
function renderAll() {
  renderYseg();
  renderKpis(); renderDistBar(); renderRateBand();
  renderCurve();
  renderTabs(); renderTable();
  applyMatScroll();                                    /* 容器高度对齐人气页签（场地/切面变化后行数会变，随 renderAll 重测） */
  syncEdges();
}

/* ---- 事件 ---- */
document.getElementById("vseg").addEventListener("click", function (e) {
  var btn = e.target.closest ? e.target.closest("button[data-v]") : null;
  if (!btn) return;
  var v = btn.getAttribute("data-v");
  var i = st.vts.indexOf(v);
  if (i >= 0) {
    if (st.vts.length === 1) return;
    st.vts.splice(i, 1);
    btn.setAttribute("data-on", "false");
  } else {
    st.vts.push(v);
    btn.setAttribute("data-on", "true");
  }
  renderAll();
});
document.getElementById("ymodeSeg").addEventListener("click", function (e) {
  var btn = e.target.closest ? e.target.closest("button[data-m]") : null;
  if (!btn) return;
  var m = btn.getAttribute("data-m");
  if (st.yMode === m) return;
  st.yMode = m;
  st.yVal = "all";
  renderAll();
});
document.getElementById("yseg").addEventListener("click", function (e) {
  var btn = e.target.closest ? e.target.closest("button[data-y]") : null;
  if (!btn) return;
  st.yVal = btn.getAttribute("data-y");
  renderAll();
});
document.getElementById("rateSeg").addEventListener("click", function (e) {
  var btn = e.target.closest ? e.target.closest("button[data-r]") : null;
  if (!btn) return;
  var k = btn.getAttribute("data-r");
  var i = st.rates.indexOf(k);
  if (i >= 0) {
    if (st.rates.length === 1) return;              /* 指标至少保留一项（同场地 vseg 唯一项不可关） */
    st.rates.splice(i, 1);
  } else {
    st.rates.push(k);
  }
  renderCurve();
});
document.getElementById("matTabs").addEventListener("click", function (e) {
  var btn = e.target.closest ? e.target.closest("button[data-tab]") : null;
  if (!btn) return;
  st.tab = btn.getAttribute("data-tab");
  renderTabs(true);                                     /* true = 把选中页签滑入视野（MB 横滑栏） */
  renderTable();
});
document.getElementById("matTable").addEventListener("click", function (e) {
  var th = e.target.closest ? e.target.closest("th[data-sk]") : null;
  if (th) {                                            /* 表头排序：同列再点切换升/降序 */
    var k = th.getAttribute("data-sk");
    if (st.sort.k === k) st.sort.dir = st.sort.dir === "desc" ? "asc" : "desc";
    else { st.sort.k = k; st.sort.dir = "desc"; }
    renderTable();
    return;
  }
  var tr = e.target.closest ? e.target.closest("tr[data-href]") : null;
  if (tr) window.open(tr.getAttribute("data-href"), "_blank", "noopener");   /* §80：跳转新标签页，不离开当前统计视图 */
});
var resizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { renderCurve(); applyMatScroll(); syncEdges(); }, 150);
});

/* ---- 初始化 ---- */
(function init() {
  /* 首次取数占位（§149）：stats.json 冷加载期间数据概览卡不再空白（renderKpis 取数后整体覆写 #kpis） */
  var kl = document.getElementById("kpisLoad");
  if (kl && window.YJ && YJ.ui && YJ.ui.spin) kl.innerHTML = YJ.ui.spin({ label: "加载统计数据…", sm: true });
  renderSireRank();                                    /* 种马榜走势数据独立（JBIS 跨站引用），与 stats.json 并行加载 */
  YJ.cache.fetch("stats").then(function (data) {
    STATS = data;
    renderAll();
  }).catch(function (e) {
    document.getElementById("kpis").innerHTML =
      '<div class="hint-empty">数据加载失败（' + esc(e.message) + '），请通过 http 服务器访问</div>';
  });
})();
</script>
