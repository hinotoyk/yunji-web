<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../rehome.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>草稿箱查询 · {{YJ_SITE_NAME}}</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=1">
<link rel="stylesheet" href="theme.css">
</head>
<body class="bg-muted/50 text-foreground antialiased">

<!-- §93（docs/UI优化记录.md）：草稿箱查询页 —— 快速检索抽屉之外的全页通览：
     未提交草稿 + 已保存人工表值一页看全，检索共用同一状态；跳马 = 基本信息 · 跳场 = 航迹线。
     提交动作与编辑页同一链路（GitHub API 单原子 commit → CI 自动 merge + 重算）。
     §82.13：mb 端不开放编辑——应用容器 max-md 隐藏，只留电脑端提示。 -->
<div class="hidden max-md:block mx-auto w-full max-w-[880px] px-4 pt-16 pb-[60px] text-center">
  <div class="text-[42px] leading-none">🖥️</div>
  <div class="mt-3 text-[15px] font-bold">编辑台请在电脑端使用</div>
  <div class="mt-1.5 text-[12.5px] leading-[1.7] text-muted-foreground">手机端只浏览：页面上的编辑入口在窄屏下一律隐藏。</div>
</div>

<div class="mx-auto w-full max-w-[880px] px-4 pt-6 pb-[108px] max-md:px-3 max-md:pt-3 max-md:pb-[132px] max-md:hidden">

  <header class="rounded-xl border border-border bg-card px-4 py-3 shadow-sm">
    <nav class="yj-ed-tabs" aria-label="编辑">
      <a class="yj-ed-tab" href="edit.html" title="字段 / 图片（manual_overrides.json）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        基本信息
      </a>
      <a class="yj-ed-tab" href="edit-timeline.html" title="时间线人工节点（timeline_manual.json）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
        航迹线
      </a>
      <a class="yj-ed-tab" aria-current="page" href="edit-drafts.html" title="跨页草稿查询 / 提交">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
        草稿箱
      </a>
    </nav>
  </header>

  <section class="mt-3">
    <div id="drafts"><div class="hint-empty">草稿箱加载中…</div></div>
  </section>
</div>

<div id="savebar" class="fixed inset-x-0 bottom-0 z-50 border-t border-border bg-background/95 backdrop-blur max-md:hidden">
  <div class="relative mx-auto flex max-w-[880px] flex-wrap items-center gap-2.5 px-4 py-2.5">
    <div id="box"></div>
    <span class="flex items-center gap-1.5 whitespace-nowrap text-[11px] text-muted-foreground">
      <i class="yj-ed-chipdot bg-chart3"></i>草稿箱模式 · 提交后约 2 分钟生效
    </span>
    <div id="report" class="order-last w-full max-md:max-h-[60px] max-md:overflow-y-auto"></div>
    <span class="ml-auto flex flex-none items-center justify-end gap-2">
      <button id="save" class="yj-ed-op yj-ed-op--primary h-8 px-4 text-[12.5px] font-bold" type="button" disabled>提交到 GitHub</button>
      <button id="boxBtn" class="yj-ed-op h-8 px-3" type="button">草稿箱</button>
    </span>
  </div>
</div>

<script src="../site-config.js"></script>
<script src="../data-config.js"></script>
<script src="../yj-util.js"></script>
<script src="../i18n.js"></script>
<script src="../device.js"></script>
<script src="../yj-cache.js"></script>
<script src="../editor.js"></script>
<script>
YJ.editor.init({
  mode: "drafts",
  drafts: "drafts", report: "report", save: "save",
  box: "box", boxBtn: "boxBtn"
});
</script>
</body>
</html>
