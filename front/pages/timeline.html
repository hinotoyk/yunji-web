<script>
/* 编辑入口默认不进视野（2026-10-02 用户定稿；§160 改版）：本页「编辑 ↗」仅编辑模式开启时显示
   —— 开关单一出处 = YJ.util.editUnlocked()（本站仓库 PAT 已验证存机；iframe 与外壳同源共享
   localStorage，直开本页与回壳内嵌判定一致）；?edit=1 URL 开关已废除。 */
if(YJ.util.editUnlocked()){ var ee=document.getElementById("editEntry"); if(ee) ee.classList.remove("hidden"); }
/* 初始占位（§169 统一加载态）：timeline.json 取数期间给全局 spinner（渲染入口整体覆写 #body；
 * loading.js 缺失时保持 HTML 里的纯文案，与各页约定一致）。 */
(function () {
  var b = document.getElementById("body");
  if (b && window.YJ && YJ.ui && YJ.ui.spin) b.innerHTML = YJ.ui.spin({ label: "正在加载时间线数据…" });
})();
/* ================= 时间线 · 里程碑事件页 =================
 * 数据：data/timeline.json —— 后端预计算（scripts/timeline/build_timeline.py 生成，
 *       run_update.py 各策略在数据更新后自动重算），前端只做渲染，不再实时计算。
 * 一场比赛 = 一条事件（绝不按标签拆行），该场触发的所有里程碑以标签徽章并列展示；纯展示无筛选。
 * 事件规则（详见 build_timeline.py）：
 *   1. 全局级别首胜（每级别全站仅一次）  1b. 世代新马首胜  2. 全局重赏序数（重赏首胜/重赏第N胜/G2第N胜，跨马累计；级别第1胜=首胜不重复挂）  3. 世代重赏首胜（中央）
 *   4. 父子制覇（父马同胜）  5. 受赏 —— 同一场比赛可同时触发多枚徽章。
 * 渲染：时间自下而上（最新在顶；同日按発走晚者在顶——后端已按 日期→同日発走（缺失视为最大） 升序
 *       输出，同 races.html 模块 33），年份分组降序；中央轴卡片左右交替，图位（横A4比例）恒贴时间轴一侧。
 * 赛事名（race.name）：后端已剥掉徽章代劳的等级尾缀（见 build_timeline.py strip_grade_suffix），
 *       前端恒单行显示，超宽由 fitRaceNames() 缩字号（PC / mb 同一套）。 */
var esc = YJ.util.esc;  /* HTML 转义：单一出处 public/yj-util.js（原页内副本 > 分支已漂移为无操作，此处一并修正） */
function tagHTML(t){
  return '<span class="tl-tag '+t.cat+'"'+(t.tip?' title="'+esc(t.tip)+'"':'')+'>'+
         (t.crown ? '<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8L8.3 12L12 5.5L15.7 12L20.5 8L19 18L5 18Z"/><circle cx="3.5" cy="6.2" r="1.9"/><circle cx="12" cy="3.6" r="1.9"/><circle cx="20.5" cy="6.2" r="1.9"/></svg>' : '')+
         esc(t.label)+'</span>';
}
/* 迷你数据条单元：label 上 / 值 下（hi=青绿加粗，胜果核心数据）
 * §182：label 传比赛字段日文原键（タイム/上り/人気），统一经 i18n.js 字典转中文，
 *       不在页面写死译文；编辑台预览同款三格在 editor.js 里走同一字典。 */
function kpi(label, value, hi){
  return '<div class="tl-kpi"><div class="k">'+esc(YJ.i18n.t(label))+'</div>'+
         '<div class="v'+(hi?' hi':'')+'">'+esc(value)+'</div></div>';
}
/* 騎手/調教師行：后端 team 为「 ｜ 」拼接的单串（缺失整段不出现），前端按分隔符拆成一行一人 */
function teamHTML(team){
  return '<div class="text-[12px] text-muted-foreground space-y-0.5">'+
           team.split('｜').map(function(s){ return '<div>'+esc(s.trim())+'</div>'; }).join('')+
         '</div>';
}
/* 图源：timeline.json 已解析（race photo 优先→马照片）。
 * 无图 = 不出图位、卡片退化为「纯文本窄卡」（2026-10-31 §147 定稿）——旧 🐎 浅灰占位板观感塌陷，
 * 文本卡反而信息密度更好；卡片视觉（.tl-card flex + .tl-body flex:1）天然支持无图态，无需变体类。
 * 有图时统一走 YJ.ui.img（§5.3.2）：loading=lazy + decoding=async + 写死占位尺寸
 * 297×210 —— 仅作**解码前的比例占位**（§176 起图按自身比例完整展开，见 timeline-cards.css）。 */
function photoHTML(ev){
  var src = ev.photo || "";
  return src
    ? '<div class="tl-photo">'+YJ.ui.img({ src: src, alt: "", cls: "", w: 297, h: 210, attrs: 'title="放大查看"' })+'</div>'
    : '';
}
/* 日期：年份加粗加深为时间锚点（§147），月日维持浅灰 tabular-nums；空值兜底 — */
function dateHTML(d){
  if (!d) return '<div class="tl-date">—</div>';
  return '<div class="tl-date"><b>'+esc(d.slice(0,4))+'</b>'+esc(d.slice(4))+'</div>';
}
function eventHTML(ev, side){   /* side: "right"=卡片在轴右侧（日期在左），"left"=卡片在轴左侧；图位恒贴时间轴一侧 */
  var card = '<div class="tl-card card">'+photoHTML(ev)+'<div class="tl-body">';
  if (ev.type === "manual"){   /* 人工节点：来自 timeline_manual.json（manual:true），无 horse；标题/副题/说明/可选跳转 */
    /* §92 比赛样式（可选）：人工节点带任一比赛字段（rank/time/agari/pop/jockey/trainer/gbadge/meta/hero）时，
     * 按 race 分支同款结构渲染（格徽章/场次行/着顺+馬名行/KPI 条/騎手調教師；📌 只留给素格式）。
     * gbadge/glabel 由 build_timeline.to_manual_event 从 grade 派生（同一 grade-table）。 */
    var rich = ev.gbadge || ev.rank || ev.hero || ev.time || ev.agari || ev.pop || ev.jockey || ev.trainer || ev.meta;
    if (rich) {
      var rttl = ev.link
        ? '<a class="hjump text-[15px] font-semibold" href="'+esc(ev.link)+'">'+esc(ev.title||"")+'</a>'
        : '<span class="text-[15px] font-semibold">'+esc(ev.title||"")+'</span>';
      card += '<div class="tl-racename-row">'+
                (ev.gbadge ? '<span class="yj-grade yj-'+esc(ev.gbadge)+'">'+esc(ev.glabel||"")+'</span>' : '')+
                '<span class="tl-racename">'+rttl+'</span></div>'+
              (ev.cn ? '<div class="text-[12px] text-muted-foreground">〈'+esc(ev.cn)+'〉</div>' : '')+
              (ev.meta ? '<div class="text-[12px] text-muted-foreground">'+esc(ev.meta)+'</div>' : '')+
              (ev.hero ? '<div class="tl-horse">'+
                  (ev.rank ? '<span class="yj-no '+
                    (ev.rank==="1"?"yj-no1":ev.rank==="2"?"yj-no2":ev.rank==="3"?"yj-no3":"")+'">'+esc(ev.rank)+'</span>' : '')+
                  '<span class="tl-horse-txt">'+
                    '<span class="tl-hname">'+esc(ev.hero)+'</span>'+
                    (ev.hero_cn ? '<span class="tl-hcn">〈'+esc(ev.hero_cn)+'〉</span>' : '')+
                  '</span>'+
                '</div>' : '')+
              ((ev.time||ev.agari||ev.pop) ? '<div class="tl-kpis">'+
                  kpi("タイム", ev.time||"—", true) + kpi("上り", ev.agari||"—") + kpi("人気", ev.pop||"—")+
                '</div>' : '')+
              ((ev.jockey||ev.trainer) ? '<div class="text-[12px] text-muted-foreground space-y-0.5">'+
                  (ev.jockey?'<div>騎手 '+esc(ev.jockey)+'</div>':'')+
                  (ev.trainer?'<div>調教師 '+esc(ev.trainer)+'</div>':'')+'</div>' : '')+
              (ev.note ? '<div class="text-[12px] text-muted-foreground">'+esc(ev.note)+'</div>' : '');
    } else {
    var ttl = ev.link
      ? '<a class="hjump text-[15px] font-semibold" href="'+esc(ev.link)+'">📌 '+esc(ev.title||"")+'</a>'
      : '<span class="text-[15px] font-semibold">📌 '+esc(ev.title||"")+'</span>';
    card += '<div class="flex flex-wrap items-baseline gap-x-2">'+ttl+
              (ev.cn ? '<span class="text-[12px] text-muted-foreground">〈'+esc(ev.cn)+'〉</span>' : '')+
            '</div>'+
            (ev.note ? '<div class="text-[12px] text-muted-foreground">'+esc(ev.note)+'</div>' : '');
    }
    card += (ev.tags && ev.tags.length ? '<div class="flex flex-wrap gap-1.5">'+ev.tags.map(tagHTML).join("")+'</div>' : '');
  } else {
  /* 名次行（§175）：徽章 + 主名 + 〈中文名〉同基线一行，中文名放不下时整体换到第二行、左缘与主名对齐 */
  var hero = '<span class="tl-horse-txt">'+
               '<a class="hjump tl-hname" href="profile.html?horse='+encodeURIComponent(ev.horse.id)+'">'+esc(ev.horse.name)+'</a>'+
               (ev.horse.cn ? '<span class="tl-hcn">〈'+esc(ev.horse.cn)+'〉</span>' : '')+
             '</span>';
  if (ev.type === "award"){
    var a = ev.award || {};
    card += '<div class="flex flex-wrap items-baseline gap-x-2">'+
              '<span class="text-[15px] font-semibold">✦ '+esc(a.賞名||"")+'</span>'+
              (a.cn ? '<span class="text-[12px] text-muted-foreground">〈'+esc(a.cn)+'〉</span>' : '')+
            '</div>'+
            '<div class="tl-horse">'+hero+'</div>'+
            (a.備考 ? '<div class="text-[12px] text-muted-foreground">'+esc(a.備考)+'</div>' : '')+
            '<div class="flex flex-wrap gap-1.5">'+ev.tags.map(tagHTML).join("")+'</div>';
  } else {
    var r = ev.race || {};
    card +=
      '<div class="tl-racename-row">'+
        (r.gbadge ? '<span class="yj-grade yj-'+r.gbadge+'">'+esc(r.glabel||"")+'</span>' : '')+
        '<span class="tl-racename">'+esc(r.name||"")+'</span>'+
      '</div>'+
      (r.meta ? '<div class="text-[12px] text-muted-foreground">'+esc(r.meta)+'</div>' : '')+
      '<div class="tl-horse">'+
        '<span class="yj-no yj-no1">1</span>'+ hero +
      '</div>'+
      '<div class="tl-kpis">'+
        kpi("タイム", r.time||"—", true) + kpi("上り", r.agari||"—") + kpi("人気", r.pop||"—")+
      '</div>'+
      (r.team ? teamHTML(r.team) : '')+
      '<div class="flex flex-wrap gap-1.5">'+ev.tags.map(tagHTML).join("")+'</div>';
  }
  }
  card += '</div></div>';
  return '<div class="tl-item '+side+'">'+
           dateHTML(ev.date)+
           '<div class="tl-node '+esc(ev.node||"award")+'"></div>'+
           '<div class="tl-cardwrap">'+card+'</div>'+
         '</div>';
}
/* ===== 赛事名恒单行：超宽缩字号（PC / mb 同一套）=====
 * 规则（用户定稿）：卡片里的比赛名无论 PC 还是 mb 都只占一行——名字过长就**缩小字号**，不换行、不撑破卡片；
 *   名字后「(GII)/(JpnI)/(L)/(OP)」这类等级尾缀已由左侧徽章表达，后端产物 name 里已剥掉
 *   （scripts/timeline/build_timeline.py 的 strip_grade_suffix），此处只管一行内自适应字号。
 * 机制：先复位到 CSS 基准字号（单一出处 = 页内 .tl-racename）→ 量 scrollWidth/clientWidth →
 *   超宽按 0.5px 步进降字号；降到下限 NAME_FLOOR 仍放不下才交给 CSS 省略号，并挂 title 悬停看全名。
 * 幂等：每轮先复位字号，故 resize / 字体加载完成后可放心重跑。 */
var NAME_FLOOR = 11;     /* 字号下限（px）：再小就伤可读性，改为省略号兜底（2026-10-30 UI 审查 §15：10.5→11） */
function fitRaceNames(){
  var els = document.querySelectorAll(".tl-racename");
  for (var i = 0; i < els.length; i++){
    var el = els[i];
    el.style.fontSize = "";                                     /* 复位：可重复调用 */
    el.removeAttribute("title");
    var size = parseFloat(getComputedStyle(el).fontSize) || 15; /* 基准字号取自 CSS，页内不写死 */
    while (el.scrollWidth > el.clientWidth && size > NAME_FLOOR){
      size = Math.max(NAME_FLOOR, Math.round((size - 0.5) * 10) / 10);
      el.style.fontSize = size + "px";
    }
    if (el.scrollWidth > el.clientWidth) el.setAttribute("title", el.textContent);  /* 缩到下限仍超宽：兜底提示 */
  }
}
function render(events){
  /* 时间自下而上：最新在顶部（渲染前倒序），年份分组同步降序；卡片按序左右交替骑在中央轴上
   * （交替序号跨年连续，避免每年都从右侧重开导致轴线两侧密度失衡）。
   * 分组结构（§147）：.tl-group 包住该年 yearrow + 全部事件行 —— yearrow 才能 sticky 吸附
   * 在本年份区间内（sticky 以父盒子为界），滚出年份即让位给下一年。 */
  var groups = [], year = "", cur = null;
  events.slice().reverse().forEach(function(ev){
    var y = ev.date ? ev.date.slice(0,4) : "";
    if (y !== year){ year = y; cur = { y: y, items: [] }; groups.push(cur); }
    cur.items.push(ev);
  });
  var gi = 0;
  var items = groups.map(function(g){
    return '<div class="tl-group">'+
             '<div class="tl-yearrow"><span class="tl-year">'+esc(g.y||"—")+
               '<span class="tl-yc">'+g.items.length+' 条</span></span></div>'+
             g.items.map(function(ev){
               return eventHTML(ev, gi++%2===0 ? "right" : "left");
             }).join("")+
           '</div>';
  }).join("");
  document.getElementById("body").innerHTML = items.length
    ? '<div class="tl">'+items+'</div>'
    : '<div class="hint-empty">暂无里程碑事件</div>';
  fitRaceNames();   /* 渲染完立即量一次：赛事名超宽缩字号，保证恒单行 */
  animOn();         /* 入场动效（§147）：观察器逐行放行，CSS 侧尊重 prefers-reduced-motion */
}
/* 卡片入场（§147）：给 .tl 挂 .tl-anim 后逐行加 .in 放行；hidden 态由 CSS 定义，
 * 此处只负责开关——无 IntersectionObserver（老浏览器）直接全量放行，绝不藏内容。 */
function animOn(){
  var tl = document.querySelector(".tl");
  if (!tl) return;
  var items = tl.querySelectorAll(".tl-item");
  if (!("IntersectionObserver" in window)){
    for (var j = 0; j < items.length; j++) items[j].classList.add("in");
    return;
  }
  tl.classList.add("tl-anim");
  var io = new IntersectionObserver(function(entries){
    for (var k = 0; k < entries.length; k++){
      if (entries[k].isIntersecting){ entries[k].target.classList.add("in"); io.unobserve(entries[k].target); }
    }
  }, { threshold: .12 });
  for (var i = 0; i < items.length; i++) io.observe(items[i]);
}
function renderStats(st){
  /* §147：一行灰字 → 「数字 + 量词标签」迷你统计块；胜利类数字走 primary 青绿（数据语义色：胜=primary） */
  st = st || {};
  function blk(n, label, hi){
    return '<div class="flex items-baseline gap-1.5">'+
             '<b class="text-[17px] font-bold leading-none '+(hi?'text-primary':'text-foreground')+'">'+(n||0)+'</b>'+
             '<span class="text-[12px] text-muted-foreground">'+label+'</span>'+
           '</div>';
  }
  document.getElementById("stats").innerHTML =
    '<div class="flex flex-wrap items-baseline gap-x-7 gap-y-2">'+
      blk(st.events,"条里程碑")+blk(st.horses,"匹产驹")+
      blk(st.graded_wins,"场重赏胜利",1)+blk(st.sire_wins,"次父子制覇",1)+
    '</div>';
}
function init(){
  YJ.cache.fetch("timeline").then(function(data){
    renderStats(data.meta && data.meta.stats);
    render(data.events || []);
  }).catch(function(e){
    document.getElementById("body").innerHTML =
      '<div class="hint-empty">数据加载失败（'+esc(e.message)+'），请通过 http 服务器访问</div>';
  });
}
init();
/* ===== §188 sticky 年份胶囊缓退 =====
 * 痛点（用户 2026-11-11 看图反馈）：mb 往下拉时吸顶的「2026 N 条」胶囊一直盖住卡片内容。
 * 方案（用户定稿：滚动时可见、停止后慢慢消失）：滚动进行中全部照常显示；
 *   滚动静默 ~0.9s 后，只把「当前吸附在视口顶」的胶囊缓慢淡出——自然流位置的年份标签不动
 *   （静置阅读时年份上下文不丢）。吸附态判定 = 胶囊 rect.top 贴住 sticky 偏移（PC 8px / mb 4px，
 *   与 timeline-page.css 的 top 值同源）；再次滚动立刻整行恢复（CSS 侧出现快 / 消失慢）。
 * 监听挂 window（iframe 外壳内本页内容滚动同样触发）；渲染只换 #body innerHTML，重跑无副作用。 */
var IDLE_MS = 900, idleTimer = null;
function yearStickyTop(){ return window.matchMedia("(max-width:768px)").matches ? 4 : 8; }
function markStuckPills(){
  var top = yearStickyTop();
  var rows = document.querySelectorAll(".tl-yearrow");
  for (var i = 0; i < rows.length; i++){
    var t = rows[i].getBoundingClientRect().top;
    rows[i].classList.toggle("stuck", Math.abs(t - top) < 2);   /* 贴住偏移 = 吸附态；偏高=自然流 / 偏低=被父盒推出 */
  }
}
window.addEventListener("scroll", function(){
  var tl = document.querySelector(".tl");
  if (tl) tl.classList.remove("tl-idle");       /* 滚动中：立即恢复显示 */
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){
    var cur = document.querySelector(".tl");
    if (!cur) return;
    markStuckPills();
    cur.classList.add("tl-idle");               /* 静默超时：吸附中的胶囊开始缓慢淡出 */
  }, IDLE_MS);
}, { passive: true });
/* 照片放大（§161）：卡片照片点击 → 灯箱全屏查看，交互与 profile 相册对齐（§149.3）。
 * 通道一致：外壳内 postMessage(yj:lightbox) 顶层渲染（遮罩全屏含侧栏；外壳以 iframe 地址为
 * base 归一 URL，sender 侧零约束）；直开本页（无外壳）→ 本地 YJ.lightbox 兜底。
 * 图集 = 当前 DOM 顺序的全部卡片照片（跨事件连续翻页），index = 被点照片；
 * 委托监听挂在 #body 元素上（render 只换 innerHTML，监听器常驻，重复渲染不叠加）。 */
function openPhotoLightbox(img){
  var imgs = document.querySelectorAll(".tl-photo img"), photos = [], cur = 0;
  for (var i = 0; i < imgs.length; i++) {
    var s = imgs[i].getAttribute("src");
    if (!s) continue;
    if (imgs[i] === img) cur = photos.length;
    photos.push(s);
  }
  if (!photos.length) return;
  if (window.parent && window.parent !== window) {
    try { window.parent.postMessage({ type: "yj:lightbox", photos: photos, index: cur }, "*"); return; } catch (err) {}
  }
  if (window.YJ && YJ.lightbox) YJ.lightbox.open(photos, cur);
}
document.getElementById("body").addEventListener("click", function(e){
  var im = e.target && e.target.closest ? e.target.closest(".tl-photo img") : null;
  if (im) openPhotoLightbox(im);
});
/* 卡片宽度随视口变 → 重新量；Web 字体（Noto Sans SC）到位后文字宽度会变 → 也重量一次 */
var fitTimer = null;
window.addEventListener("resize", function(){ clearTimeout(fitTimer); fitTimer = setTimeout(fitRaceNames, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitRaceNames(); });
</script>
