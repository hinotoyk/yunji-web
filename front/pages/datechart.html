<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日期图 · 云迹</title>
<link rel="stylesheet" href="theme.css">
</head>
<body class="bg-background text-foreground antialiased">
<div class="mx-auto max-w-[1180px] px-6 pt-[26px] pb-[60px]">
  <div class="my-7 flex items-center gap-2.5 text-[14px] font-bold uppercase tracking-[1px] text-secondary-foreground">
    <span class="block h-4 w-1 rounded-[2px] bg-primary"></span>日期图 · DATE CHART
  </div>
  <div class="rounded-[10px] border border-dashed border-border bg-muted/15 px-5 py-12 text-center text-muted-foreground">
    <h2 class="mb-2 text-[18px] font-semibold text-foreground">日期图页 · 占位</h2>
    <p class="text-[13px]">可按 <strong class="font-semibold text-foreground">天 / 周 / 月 / 年</strong> 切换：柱状图显示每单位胜场数，下方列出该单位赢的马和赛事，重赏/分级赛突出标记。<br>当前为布局占位，日期聚合随后接入。</p>
  </div>
</div>
</body>
</html>
