<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日期图 · 云迹</title>
<link rel="stylesheet" href="theme.css">
<style>
/* ===== 等级/着顺/人气徽章、mb 软分行卡片、马名跳转（.yj-grade/.yj-no/.yj-nk/.yj-nkm/.yj-mb/.hjump）
 * 已收敛到 theme.css @layer components，并与 front/public/race-rows.js 配套：
 * 明细与比赛页（内嵌）共用同一份样式与同一份行渲染代码，改一次两处同步 ===== */

/* ===== 单位切换（天/周/月/年 分段控件） ===== */
.seg{display:inline-flex;overflow:hidden;border:1px solid #e5e5e5;border-radius:8px;background:#fff}
.seg button{height:32px;padding:0 15px;border:0;border-right:1px solid #ececec;background:#fff;font-size:13px;color:#52525b;cursor:pointer;transition:background .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button:not([data-on=true]):hover{background:#f5f5f5}
.seg button[data-on=true]{background:#0aa7a0;color:#fff;font-weight:600}

/* ===== 窗口切换 ‹ › ===== */
.dc-nav{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid #e3e3e3;border-radius:7px;background:#fff;color:#444;font-size:15px;line-height:1;cursor:pointer;transition:all .15s}
.dc-nav:hover:not(:disabled){border-color:rgba(10,167,160,.55);color:#0b6b64;background:#f7fdfd}
.dc-nav:disabled{opacity:.35;cursor:not-allowed}

/* ===== 快速定位日期选择器（Element date-picker 风格：统一挂在窗口标签上，随口径出 日/周/月/年 面板） ===== */
.dc-dp-label{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:0;border-radius:7px;background:transparent;color:#171717;font-size:14px;font-weight:600;line-height:1.4;cursor:pointer;transition:all .15s;white-space:nowrap}
.dc-dp-label:hover{background:#f0faf9;color:#0b6b64}
.dc-dp-caret{font-size:9px;color:#8a8a8a;transition:transform .15s}
.dc-dp[data-on=true] .dc-dp-label{color:#0b6b64;background:#f0faf9}
.dc-dp[data-on=true] .dc-dp-caret{transform:rotate(180deg);color:#0aa7a0}
.dc-dp-panel{position:absolute;left:0;top:calc(100% + 8px);z-index:30;width:312px;padding:10px;border:1px solid #e5e5e5;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.dc-dp-hd{display:flex;align-items:center;gap:2px;margin-bottom:8px}
.dc-dp-nav{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:#52525b;font-size:12px;line-height:1;cursor:pointer}
.dc-dp-nav:hover:not(:disabled){background:#f0f0f0;color:#0b6b64}
.dc-dp-nav:disabled{opacity:.3;cursor:not-allowed}
.dc-dp-lab{flex:1;text-align:center;font-size:13px;font-weight:600;color:#171717;white-space:nowrap}
.dc-dp-grid{display:grid;gap:2px}
.dc-dp-cell{display:inline-flex;align-items:center;justify-content:center;height:30px;border:0;border-radius:6px;background:transparent;font-size:12px;color:#3a3a3e;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .12s}
.dc-dp-cell:hover{background:#f0f0f0}
.dc-dp-cell.out{color:#c0c0c4}                       /* 邻月补位 */
.dc-dp-cell.dis{color:#d4d4d8;cursor:default;pointer-events:none}  /* 范围外禁用 */
.dc-dp-cell.today{box-shadow:inset 0 0 0 1px #0aa7a0}
.dc-dp-cell.cur,.dc-dp-cell.cur:hover{background:#0aa7a0;color:#fff;font-weight:600}
.dc-dp-wrow{display:grid;grid-template-columns:38px repeat(7,1fr);gap:2px;border-radius:7px}
.dc-dp-wrow .dc-dp-cell{width:100%}
.dc-dp-wnum{display:inline-flex;align-items:center;justify-content:center;height:30px;border-radius:6px;background:transparent;border:0;font-size:10.5px;color:#8a8a8a;cursor:pointer;font-variant-numeric:tabular-nums}
.dc-dp-wrow.hl{outline:2px solid rgba(10,167,160,.5);outline-offset:1px}
.dc-dp-wrow.hl .dc-dp-wnum{color:#0b6b64;font-weight:700}
.dc-dp-ft{display:flex;justify-content:flex-end;margin-top:8px;padding-top:8px;border-top:1px solid #ececec}
.dc-dp-ft button{border:0;background:transparent;color:#0b6b64;font-size:12px;font-weight:600;cursor:pointer;padding:3px 8px;border-radius:6px}
.dc-dp-ft button:hover{background:rgba(10,167,160,.1)}

/* ===== KPI 带：出走 / 通算战绩 / 总赏金 / 重赏胜利 ===== */
.dc-kpis{display:flex;flex-wrap:wrap}
.dc-kpi{padding:2px 18px;border-left:1px solid #ececec}
.dc-kpi:first-child{padding-left:2px;border-left:0}
.dc-kpi .k{font-size:11px;font-weight:600;letter-spacing:.5px;color:#8a8a8a;white-space:nowrap}
.dc-kpi .v{margin-top:2px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:#171717;white-space:nowrap}
.dc-kpi .v.hi{color:#0aa7a0}
.dc-kpi .v.dim{color:#a1a1aa}
.dc-kpi .trophy{font-size:16px;margin-right:2px}

/* ===== 进板数 [1-1-1-1]（**格式保留连字符**；1/2/3 浅色做底 + 深色数字，着外浅灰底）
 * 四段底色连成「一整条」：数字格各用名次底色，连字符格用「上一色→下一色」线性渐变接缝，
 * 底色连续、过渡柔和无硬边；圆角只留在整条两端（KPI 大括号 5px / 日历小格 3px） ===== */
.dc-brk{font-variant-numeric:tabular-nums;color:#a1a1aa;white-space:nowrap;display:inline-flex;align-items:center;vertical-align:middle}
.dc-brk b{color:#171717;font-weight:600}
.dc-brk i{font-style:normal;color:#171717;font-weight:600;padding:0 1px}
.dc-brk b:first-of-type{margin-left:2px;border-radius:3px 0 0 3px}
.dc-brk b:last-of-type{margin-right:2px;border-radius:0 3px 3px 0}
.dc-brk-lg{font-size:19px}
.dc-brk-lg b{padding:1px 6px}
.dc-brk-lg i{padding:1px 5px}
.dc-brk-lg b:first-of-type{margin-left:3px;border-radius:5px 0 0 5px}
.dc-brk-lg b:last-of-type{margin-right:3px;border-radius:0 5px 5px 0}

/* ===== 日历（月网格：周一行 + 日格） ===== */
.dc-cal{display:flex;flex-direction:column;gap:3px}
.dc-dowrow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dc-dow{text-align:center;font-size:10.5px;font-weight:600;color:#8a8a8a;padding:2px 0}
.dc-wrow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;border-radius:10px}
.dc-wrow.hl{outline:2px solid rgba(10,167,160,.5);outline-offset:2px}
.dc-cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:66px;padding:5px 7px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;transition:background .15s}
.dc-cell:hover{background:#f0f0f0}
.dc-cell.run{background:#f5f5f5}
.dc-cell.run:hover{background:#ededed}
.dc-cell.dc-sel{box-shadow:inset 0 0 0 2px #0aa7a0}
.dc-cell.dc-out{cursor:default;pointer-events:none}
.dc-cell-top{display:flex;width:100%;align-items:center;justify-content:space-between;gap:2px}
.dc-d{font-size:12.5px;font-weight:600;color:#52525b;font-variant-numeric:tabular-nums}
.dc-cell.win .dc-d{color:#0aa7a0}
.dc-gw{font-size:10px;line-height:1.3;white-space:nowrap}
.dc-prz{font-size:10.5px;color:#8a8a8a;font-variant-numeric:tabular-nums}

/* ===== 年视图：12 个月卡 ===== */
.dc-ym{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px;border:1px solid #ececec;border-radius:10px;background:#fff;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.dc-ym:hover{border-color:rgba(10,167,160,.55);background:#f7fdfd}
.dc-ym-top{display:flex;width:100%;align-items:center;justify-content:space-between;gap:2px}
.dc-ym b{font-size:13px;font-weight:700;color:#171717}
.dc-ym.zero b{color:#a1a1aa}
.dc-ym.zero .dc-brk,.dc-ym.zero .dc-prz{color:#c6c6ca}
.dc-ym-prz{font-size:12px;color:#52525b;font-variant-numeric:tabular-nums}
.dc-ym-n{font-size:10.5px;color:#8a8a8a}

/* ===== 明细：行/卡片渲染与样式统一走 race-rows.js + theme.css（与比赛页内嵌表同一份代码） ===== */

/* ===== 手机（≤768px）：日历格只留 日期+🏆，进板数/赏金收进 KPI 带与明细 ===== */
@media (max-width:768px){
  .dc-cell{min-height:38px;padding:3px 5px;gap:1px}
  .dc-d{font-size:11px}
  .dc-cell .dc-brk,.dc-cell .dc-prz{display:none}
  .dc-gw{font-size:9px}
  .dc-kpi{padding:2px 12px}
  .dc-kpi .v{font-size:16px}
  .dc-brk-lg{font-size:14px}
  .dc-kpi .trophy{font-size:13px}
  .yj-mb-item{margin-right:10px}
}
</style>
</head>
<body class="bg-background text-foreground antialiased">
<div class="mx-auto w-full px-6 pt-[22px] pb-[60px] max-md:px-3.5 max-md:pt-2 max-md:pb-12 md:w-[90%]" id="page">

  <div class="mb-7 max-md:mt-2.5 flex items-center gap-2.5 text-[14px] font-bold uppercase tracking-[1px] text-secondary-foreground">
    <span class="h-4 w-1 flex-none rounded bg-primary"></span>日期图 · DATE CHART
  </div>

  <!-- 工具条：聚合口径分段切换 + 场地范围（多选，默认 JRA） -->
  <div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-2">
    <div class="seg" id="seg">
      <button type="button" data-u="day">天</button>
      <button type="button" data-u="week">周</button>
      <button type="button" data-u="month" data-on="true">月</button>
      <button type="button" data-u="year">年</button>
    </div>
    <div class="seg" id="vseg">
      <button type="button" data-v="中央" data-on="true" title="中央（JRA）">JRA</button>
      <button type="button" data-v="地方" data-on="false" title="地方（NAR）">NAR</button>
      <button type="button" data-v="海外" data-on="false" title="海外">海外</button>
    </div>
  </div>

  <!-- 日历卡：窗口切换（标签即日期选择器）+ KPI 带 + 日历网格 -->
  <div class="card p-4 pt-3.5 max-md:p-3">
    <div class="mb-2 flex flex-wrap items-center gap-x-3 gap-y-1.5">
      <div class="flex items-center gap-1.5">
        <button id="navPrev" class="dc-nav" type="button" aria-label="上一窗口">‹</button>
        <div class="dc-dp relative" id="dp">
          <button type="button" id="dpTrigger" class="dc-dp-label" aria-haspopup="true" aria-expanded="false" title="点击选择日期（随口径出 日/周/月/年 面板）">
            <span id="winLabel" class="whitespace-nowrap text-center text-[14px] font-semibold"></span>
            <span class="dc-dp-caret">▾</span>
          </button>
          <div id="dpPanel" class="dc-dp-panel" hidden></div>
        </div>
        <button id="navNext" class="dc-nav" type="button" aria-label="下一窗口">›</button>
      </div>
    </div>
    <div id="kpis" class="dc-kpis mb-3"></div>
    <div id="cal"></div>
  </div>

  <!-- 选中口径明细 -->
  <h2 id="dTitle" class="sec-title"></h2>
  <div id="dBody"><div class="hint-empty">正在加载…</div></div>
</div>

<script src="../data-config.js"></script>
<script src="../i18n.js"></script>
<script src="../race-rows.js"></script>
<script>
/* ================= 日期图 · 日历（真实数据版） =================
 * 需求（用户定）：日历形式；按 天/周/月/年 快速读出
 *   ① 通算战绩 [第1-第2-第3-第3名开外]（=着顺分布，4 段：1/2/3着 + 其余含未完走）
 *   ② 总赏金；③ 重赏以「图标+数字」（🏆 n）突出标记。
 * 数据：data/datechart.json —— 后端预计算（scripts/datechart/build_datechart.py 生成，
 *       run_update.py 各数据策略自动重算），runs[] 字段与本页渲染层完全同构，
 *       本页只做 天/周/月/年 聚合与渲染，不改数据。
 * 交互：seg 切换聚合口径（日历骨架不变，口径=高亮+KPI 范围）；vseg 切换场地范围 JRA/NAR/海外
 *       （多选，默认只统计 JRA）；选择器随口径出 日/周/月/年 面板（Element date-picker 风格），任意窗口一击直达；
 *       点日历格下钻（月/周 → 天，年 → 月）；‹ › 按口径步进（天±1日 / 周±7日 / 月±1月 / 年±1年），
 *       边界自动禁用。明细 = races.html 内嵌比赛表同款（PC 14 列表 + mb 软分行卡片）。 */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,">");}
function pad2(n){return n<10?"0"+n:""+n;}

/* ---- 渲染就绪出走记录：fetch data/datechart.json（scripts/datechart/build_datechart.py 预计算，
 * run_update.py 各数据策略自动重算）。字段与布局稿 RUNS 同构：
 * d 日期 / id·h 马 / r 赛事 / g 级别 / v 场所 / R / dist / s 跑道 / p 着顺(数字或未完走) / pr 赏金(円)
 * vt 场地类型(中央/地方/海外) / bk 马场状态 / ki 斤量 / nk 人气 / tm 时间 / bw 马体重 / dz 增减 / jk·tr 骑手·调教师 ---- */
var RUNS = [];

/* ---- 级别/徽章表统一取自共享模块 front/public/race-rows.js（与比赛页同一份） ---- */
var G = YJ.raceRows.G, GLABEL = YJ.raceRows.GLABEL;
/* 重赏口径（同 races.html 筛选 / timeline.py GRADED）：G1/G2/G3/Jpn1/Jpn2/Jpn3，L/OP 只是徽章不算重赏 */
var GRADED = { "GI":1, "GII":1, "GIII":1, "JpnI":1, "JpnII":1, "JpnIII":1 };
/* ---- 着顺归类（4 段）：1/2/3 各一段，4 名及以后 + 未完走(字符串) → 第 3 名开外 ---- */
function placeSlot(p){
  if (typeof p === "number") return (p >= 1 && p <= 3) ? p - 1 : 3;
  return 3;                                  /* 中止/取消/除外/失格 计入第 3 名开外 */
}
/* 进板数配色：着顺同色相深阶（白底可读版：暗金/钢蓝/赭橙，开外=中灰） */
var BR_COLORS = ["#FEED88", "#CCDFFD", "#ECC6A2", "#ececec"];
/* 进板数 [1-1-1-1]：格式保留连字符；四段底色连成一整条 —— 数字格用名次底色，
 * 连字符格用「上一色→下一色」渐变接缝（柔过渡、无硬边） */
function bracketHTML(br, cls){
  var s = '<span class="dc-brk' + (cls ? " " + cls : "") + '" title="进板数：第1:第2:第3:第3名开外">[';
  for (var i = 0; i < 4; i++){
    if (i) s += '<i style="background:linear-gradient(90deg,' + BR_COLORS[i - 1] + ',' + BR_COLORS[i] + ')">-</i>';
    s += '<b style="background:' + BR_COLORS[i] + '">' + br[i] + '</b>';
  }
  return s + ']</span>';
}
/* 赏金显示：万円起，≥1亿 转「x亿x万」（万段为 0 只留亿） */
function manYen(pr){
  if (!pr) return "";
  if (pr >= 1e8){
    var oku = Math.floor(pr / 1e8), man = Math.floor((pr % 1e8) / 10000);
    return oku + "亿" + (man ? man.toLocaleString() + "万" : "");
  }
  return Math.round(pr / 10000).toLocaleString() + "万";
}

/* ---- ISO 周工具 ---- */
function isoWeekInfo(dstr){
  var dt = new Date(dstr + "T00:00:00");
  var d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  var dn = (d.getUTCDay() + 6) % 7;                 /* 周一=0 */
  d.setUTCDate(d.getUTCDate() - dn + 3);            /* 本周周四（属 ISO 年） */
  var isoY = d.getUTCFullYear();
  var f = new Date(Date.UTC(isoY, 0, 4));
  var fn = (f.getUTCDay() + 6) % 7;
  f.setUTCDate(f.getUTCDate() - fn + 3);            /* 第 1 周周四 */
  var w = 1 + Math.round((d - f) / 604800000);
  var mon = new Date(d); mon.setUTCDate(mon.getUTCDate() - 3);
  return { y: isoY, w: w, mon: mon };
}
function mondayOfISOWeek(y, w){
  var f = new Date(Date.UTC(y, 0, 4));
  var fn = (f.getUTCDay() + 6) % 7;
  f.setUTCDate(f.getUTCDate() - fn + 3);
  var mon = new Date(f); mon.setUTCDate(mon.getUTCDate() - 3 + (w - 1) * 7);
  return mon;
}
function fmtMD(dt){ return (dt.getUTCMonth() + 1) + "/" + dt.getUTCDate(); }
var WEEKDAY = ["日","一","二","三","四","五","六"];
function daysInMonth(y, m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function dstr(y, m, d){ return y + "-" + pad2(m) + "-" + pad2(d); }
function dayTitle(ds){
  var dt = new Date(ds + "T00:00:00");
  return ds.replace(/-/g, "/") + "（" + WEEKDAY[dt.getDay()] + "）";
}

/* ---- 数据范围（窗口边界从数据推导；数据加载后调用 computeRange()） ---- */
var RANGE = { min:"", max:"", yLo:0, yHi:0, mLo:0, mHi:0, msLo:0, msHi:0 };
function computeRange(){
  var min = "", max = "";
  RUNS.forEach(function(r){
    if (!min || r.d < min) min = r.d;
    if (!max || r.d > max) max = r.d;
  });
  RANGE = { min:min, max:max,
            yLo:+min.slice(0,4), yHi:+max.slice(0,4),
            mLo:+min.slice(0,4)*12 + (+min.slice(5,7)-1),
            mHi:+max.slice(0,4)*12 + (+max.slice(5,7)-1),
            msLo:Date.parse(min+"T00:00:00"), msHi:Date.parse(max+"T00:00:00") };
}

/* ---- 状态：mode 聚合口径 + 锚点日期（天=该日；周=所在周；月=年月；年=年份）
 *      vts 场地范围（中央/地方/海外，多选，默认只统计 JRA=中央） ---- */
var st = { mode: "month", y: 0, m: 0, d: 1, vts: ["中央"] };

/* 锚点 → 口径键 */
function scopeKey(mode){
  if (mode === "day")   return dstr(st.y, st.m, st.d);
  if (mode === "month") return st.y + "-" + pad2(st.m);
  if (mode === "year")  return String(st.y);
  var iw = isoWeekInfo(dstr(st.y, st.m, st.d));
  return iw.y + "-W" + pad2(iw.w);
}
/* 口径键 → 展示标签 */
function keyLabel(mode, key){
  if (mode === "day")   return dayTitle(key);
  if (mode === "month") return key.slice(0,4) + "年" + (+key.slice(5,7)) + "月";
  if (mode === "year")  return key + "年";
  var y = +key.slice(0,4), wk = +key.slice(6);
  var mon = mondayOfISOWeek(y, wk), end = new Date(mon); end.setUTCDate(end.getUTCDate() + 6);
  return y + "年 第" + wk + "週（" + fmtMD(mon) + "–" + fmtMD(end) + "）";
}
/* 场地范围内过滤（st.vts 任一命中；vt 来自产物 venue_type） */
function inVenue(r){ return st.vts.indexOf(r.vt) !== -1; }
/* 口径内的出走记录（先按场地范围，再按口径窗口） */
function scopeRuns(mode, key){
  if (mode === "day")   return RUNS.filter(function(r){ return inVenue(r) && r.d === key; });
  if (mode === "month") return RUNS.filter(function(r){ return inVenue(r) && r.d.slice(0,7) === key; });
  if (mode === "year")  return RUNS.filter(function(r){ return inVenue(r) && r.d.slice(0,4) === key; });
  var y = +key.slice(0,4), w = +key.slice(6);
  return RUNS.filter(function(r){ return inVenue(r) && (function(){ var iw = isoWeekInfo(r.d); return iw.y === y && iw.w === w; })(); });
}
/* 一组记录的聚合：n 出走 / w 胜 / br 进板数(4 段) / pr 总赏金 / gr 重赏胜 */
function statsOf(runs){
  var s = { n: runs.length, w: 0, br: [0,0,0,0], pr: 0, gr: 0 };
  runs.forEach(function(r){
    s.br[placeSlot(r.p)]++;
    if (r.p === 1){ s.w++; if (GRADED[r.g]) s.gr++; }
    s.pr += r.pr || 0;
  });
  return s;
}

/* ---- 口径窗口步进（±1 单位，钳制在数据范围内） ---- */
function shiftAnchor(dir){
  if (st.mode === "day" || st.mode === "week"){
    var ms = Date.parse(dstr(st.y, st.m, st.d)) + dir * (st.mode === "week" ? 7 : 1) * 86400000;
    if (ms < RANGE.msLo) ms = RANGE.msLo;
    if (ms > RANGE.msHi) ms = RANGE.msHi;
    var dt = new Date(ms);
    st.y = dt.getUTCFullYear(); st.m = dt.getUTCMonth() + 1; st.d = dt.getUTCDate();
  } else if (st.mode === "month"){
    var mi = Math.min(RANGE.mHi, Math.max(RANGE.mLo, st.y * 12 + (st.m - 1) + dir));
    st.y = Math.floor(mi / 12); st.m = mi % 12 + 1;
    st.d = Math.min(st.d, daysInMonth(st.y, st.m));
  } else {
    st.y = Math.min(RANGE.yHi, Math.max(RANGE.yLo, st.y + dir));
  }
  render();
}

/* ---- 渲染 ---- */
function render(){
  var mode = st.mode, key = scopeKey(mode);
  renderNav(mode);
  renderKpis(mode, key);
  renderCal(mode, key);
  renderDetail(mode, key);
}

function renderNav(mode){
  var winLabel = document.getElementById("winLabel");
  var prev = document.getElementById("navPrev"), next = document.getElementById("navNext");
  winLabel.textContent = keyLabel(mode, scopeKey(mode));
  var canPrev = true, canNext = true;
  if (mode === "year"){ canPrev = st.y > RANGE.yLo; canNext = st.y < RANGE.yHi; }
  else if (mode === "month"){
    var mi = st.y * 12 + (st.m - 1);
    canPrev = mi > RANGE.mLo; canNext = mi < RANGE.mHi;
  } else {
    var ms = Date.parse(dstr(st.y, st.m, st.d));
    canPrev = ms > RANGE.msLo; canNext = ms < RANGE.msHi;
  }
  prev.disabled = !canPrev; next.disabled = !canNext;
}

function renderKpis(mode, key){
  var s = statsOf(scopeRuns(mode, key));
  var kpi = function(label, value, cls){
    return '<div class="dc-kpi"><div class="k">' + label + '</div><div class="v' + (cls ? " " + cls : "") + '">' + value + '</div></div>';
  };
  var prize = s.pr ? manYen(s.pr) : (s.n ? "0万" : "—");
  document.getElementById("kpis").innerHTML =
    kpi("出走", s.n, s.n ? "" : "dim") +
    kpi("通算战绩", bracketHTML(s.br, "dc-brk-lg")) +
    kpi("总赏金", prize, s.pr ? "" : "dim") +
    kpi("重赏胜利", '<span class="trophy">🏆</span>' + s.gr, s.gr ? "hi" : "dim");
}

/* 月网格（天/周/月共用，差异只是高亮）：lead/trail 补空格 */
function monthGridHTML(mode, key){
  var y = st.y, m = st.m, i, d;
  var lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
  var nDays = daysInMonth(y, m);
  var cells = [];
  for (i = 0; i < lead; i++) cells.push('<span class="dc-cell dc-out"></span>');
  for (d = 1; d <= nDays; d++) cells.push(dayCellHTML(y, m, d, mode, key));
  var trail = (7 - (lead + nDays) % 7) % 7;
  for (i = 0; i < trail; i++) cells.push('<span class="dc-cell dc-out"></span>');
  var rows = "";
  for (i = 0; i < cells.length; i += 7){
    var hl = "";
    if (mode === "week"){
      for (var j = i; j < i + 7 && j < cells.length; j++){
        var dd = cells[j].match(/data-d="([\d-]+)"/);
        if (dd){
          var iw = isoWeekInfo(dd[1]);
          if (iw.y + "-W" + pad2(iw.w) === key){ hl = " hl"; break; }
        }
      }
    }
    rows += '<div class="dc-wrow' + hl + '">' + cells.slice(i, i + 7).join("") + '</div>';
  }
  return rows;
}

function dayCellHTML(y, m, d, mode, key){
  var ds = dstr(y, m, d);
  var s = statsOf(scopeRuns("day", ds));
  var cls = "dc-cell", style = "";
  if (s.n){
    cls += s.w ? " win" : " run";
    if (s.w) style = ' style="background:rgba(10,167,160,' + (s.w >= 3 ? ".22" : s.w === 2 ? ".16" : ".10") + ')"';
  }
  if (mode === "day" && ds === key) cls += " dc-sel";
  var tip = dayTitle(ds) + " · " + s.n + " 场 · [" + s.br.join("-") + "] · " + (s.pr ? manYen(s.pr) : "无赏金");
  var inner = '<span class="dc-cell-top"><b class="dc-d">' + d + '</b>' +
    (s.gr ? '<span class="dc-gw">🏆' + s.gr + '</span>' : '') + '</span>';
  if (s.n) inner += bracketHTML(s.br) + '<span class="dc-prz">' + (s.pr ? manYen(s.pr) : "") + '</span>';
  return '<button type="button" class="' + cls.trim() + '" data-d="' + ds + '"' + style + ' title="' + esc(tip) + '">' + inner + '</button>';
}

/* 年视图：12 个月卡 */
function yearCardsHTML(y){
  var out = "";
  for (var m = 1; m <= 12; m++){
    var s = statsOf(scopeRuns("month", y + "-" + pad2(m)));
    var zero = s.n ? "" : " zero";
    var tip = y + "年" + m + "月 · " + s.n + " 场 · [" + s.br.join("-") + "] · " + (s.pr ? manYen(s.pr) : "无赏金");
    out += '<button type="button" class="dc-ym' + zero + '" data-m="' + m + '" title="' + esc(tip) + '">' +
      '<span class="dc-ym-top"><b>' + m + '月</b>' + (s.gr ? '<span class="dc-gw">🏆' + s.gr + '</span>' : '') + '</span>' +
      bracketHTML(s.br) +
      '<span class="dc-ym-prz">' + (s.pr ? manYen(s.pr) : "—") + '</span>' +
      '<span class="dc-ym-n">' + (s.n ? s.n + " 场 · 勝 " + s.w : "无出走") + '</span>' +
    '</button>';
  }
  return '<div class="grid grid-cols-2 gap-2 md:grid-cols-4 md:gap-2.5">' + out + '</div>';
}

function renderCal(mode, key){
  var dow = ["月","火","水","木","金","土","日"].map(function(x){
    return '<div class="dc-dow">' + x + '</div>';
  }).join("");
  var html;
  if (mode === "year"){
    html = yearCardsHTML(st.y);
  } else {
    html = '<div class="dc-cal"><div class="dc-dowrow">' + dow + '</div>' + monthGridHTML(mode, key) + '</div>';
  }
  document.getElementById("cal").innerHTML = html;
}

/* ---- 明细：行/徽章渲染全部走共享模块 front/public/race-rows.js（与比赛页内嵌表同一份代码）
 * 本页预计算产物是短键字段（d/h/g/v/dist/nk/p…），共享模块用比赛数据原始日文键，
 * 故这里只做一层「短键 → 原始键」适配，渲染与样式零复制 —— 比赛页改列/改徽章，明细自动同步。 */
function toRow(r){
  return {
    日付: r.d, R: r.R, 場名: r.v, レース名: r.r, 格: r.g,
    距離: r.dist, 芝ダ: r.s, 馬場: r.bk, 斤量: r.ki,
    人気: r.nk, 結果: r.p, タイム: r.tm, 賞金: r.pr,
    馬体重: r.bw, 増減: r.dz, 騎手: r.jk, 調教師: r.tr
  };
}
function renderDetail(mode, key){
  /* 排序照搬 races.html 模块 33：日期降序（新→旧）；同日発走降序（大→小），
   * 缺失视为最大（排同日最前）；同场（発走相同）按着顺升序（未完走 99 殿后）、同着顺按レース名 */
  var runs = scopeRuns(mode, key).slice().sort(function(a, b){
    if (a.d !== b.d) return a.d < b.d ? 1 : -1;
    var fa = String(a.hs || "").trim(), fb = String(b.hs || "").trim();
    if (fa !== fb){
      if (!fa) return -1;
      if (!fb) return 1;
      return fa < fb ? 1 : -1;
    }
    var pa = typeof a.p === "number" ? a.p : 99, pb = typeof b.p === "number" ? b.p : 99;
    return pa !== pb ? pa - pb : (a.r < b.r ? -1 : 1);
  });
  document.getElementById("dTitle").innerHTML =
    '明细 · ' + esc(keyLabel(mode, key)) + ' · ' + runs.length + ' 场';
  if (!runs.length){
    document.getElementById("dBody").innerHTML = '<div class="hint-empty">该口径暂无出走记录</div>';
    return;
  }
  /* 行/卡片/表壳全部来自共享模块（race-rows.js）：与比赛页内嵌表同一份代码与列定义 */
  var RR = YJ.raceRows;
  var trs = runs.map(function(r){
    return RR.rowEmbedHTML(toRow(r), { horse: { id: r.id, name: r.h } });
  }).join("");
  var pc = RR.embedTableHTML(trs, { horse: true, cls: "hidden md:block" });
  var mbs = runs.map(function(r){
    return RR.rowEmbedMbHTML(toRow(r), { horse: { id: r.id, name: r.h } });
  }).join("");
  var mb = RR.mbListHTML(mbs, { cls: "md:hidden" });
  document.getElementById("dBody").innerHTML = pc + mb;
}

/* ---- 交互（事件委托） ---- */
document.getElementById("seg").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-u]"); if (!btn) return;
  setMode(btn.getAttribute("data-u"));
});
function setMode(mode){
  if (mode === st.mode) return;
  st.mode = mode;
  Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function(b){
    b.setAttribute("data-on", b.getAttribute("data-u") === mode ? "true" : "false");
  });
  render();
}
document.getElementById("navPrev").addEventListener("click", function(){ shiftAnchor(-1); });
document.getElementById("navNext").addEventListener("click", function(){ shiftAnchor(1); });
/* 场地范围 vseg：中央(JRA)/地方(NAR)/海外 多选开关，至少保留一个（默认只选 JRA） */
document.getElementById("vseg").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-v]"); if (!btn) return;
  var v = btn.getAttribute("data-v");
  var i = st.vts.indexOf(v);
  if (i >= 0){
    if (st.vts.length === 1) return;            /* 最后一个不关：统计范围不能为空 */
    st.vts.splice(i, 1);
    btn.setAttribute("data-on", "false");
  } else {
    st.vts.push(v);
    btn.setAttribute("data-on", "true");
  }
  render();
});
/* ---- 快速定位日期选择器（Element date-picker 风格）：
 * 面板随口径切换——天=日历面板 / 周=带周号日历面板 / 月=12 月格 / 年=十年格；
 * DP.y/DP.m 为面板浏览态（独立于锚点），选中才落锚点；范围外日期禁用。 ---- */
var DP = { open: false, y: 0, m: 0, d: "" };           /* d=浏览日（周面板 ±7 天翻页光标） */
var MIN_M = 0, MAX_M = 0;                              /* 数据范围月序（加载后算） */
function dpMIdx(y, m){ return y * 12 + (m - 1); }
function dpRange(){
  MIN_M = RANGE.min ? dpMIdx(+RANGE.min.slice(0,4), +RANGE.min.slice(5,7)) : 0;
  MAX_M = RANGE.max ? dpMIdx(+RANGE.max.slice(0,4), +RANGE.max.slice(5,7)) : 0;
}
function dpOpen(){
  DP.open = true; DP.y = st.y; DP.m = st.m; DP.d = dstr(st.y, st.m, st.d);
  document.getElementById("dp").setAttribute("data-on", "true");
  document.getElementById("dpTrigger").setAttribute("aria-expanded", "true");
  renderDpPanel();
  var panel = document.getElementById("dpPanel");
  panel.hidden = false;
  /* 视口钳制：面板超出左/右边缘时拉回（mb 窄屏下面板过宽时防溢出） */
  panel.style.marginRight = "";
  var r = panel.getBoundingClientRect(), shift = 0;
  if (r.left < 8) shift = 8 - r.left;
  if (r.right > window.innerWidth - 8) shift = (window.innerWidth - 8) - r.right;
  if (shift) panel.style.marginRight = Math.round(-shift) + "px";
}
function dpClose(){
  DP.open = false;
  document.getElementById("dp").setAttribute("data-on", "false");
  document.getElementById("dpTrigger").setAttribute("aria-expanded", "false");
  document.getElementById("dpPanel").hidden = true;
}
function dpCell(label, attrs, cls, dis){
  return '<button type="button" class="dc-dp-cell' + (cls ? " " + cls : "") + (dis ? " dis" : "") + '" ' + attrs + '>' + label + '</button>';
}
function dpDayGrid(weekMode){
  var y = DP.y, m = DP.m, i, d, cells = [];
  var lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;   /* 周一开头，同主日历 */
  var nDays = daysInMonth(y, m);
  var today = dstr(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
  var cur = scopeKey(st.mode === "week" ? "day" : st.mode);            /* 天=选中日；周=整行高亮 */
  var head = "";
  if (weekMode) head = '<span class="dc-dp-cell" style="cursor:default;background:none">周</span>';
  for (var w = 0; w < 7; w++) head += '<span class="dc-dp-cell" style="cursor:default;background:none;font-weight:600">' + "一二三四五六日"[w] + '</span>';
  for (i = 0; i < lead; i++) cells.push({ d: null });
  for (d = 1; d <= nDays; d++) cells.push({ d: d });
  for (i = lead + nDays; i % 7 !== 0; i++) cells.push({ d: null });
  var rows = "";
  for (i = 0; i < cells.length; i += 7){
    var firstDs = null, rowHtml = "";
    if (weekMode){
      var probe = cells[i + 3] && cells[i + 3].d ? dstr(y, m, cells[i + 3].d) : null;   /* 行内周四推 ISO 周 */
      if (!probe && cells[i].d) probe = dstr(y, m, cells[i].d);
      var iw = probe ? isoWeekInfo(probe) : null;
      rowHtml += '<button type="button" class="dc-dp-wnum" data-w="' + (probe || "") + '" title="选择第 ' + (iw ? iw.w : "?") + ' 周">' + (iw ? iw.w : "") + '</button>';
    }
    for (var j = i; j < i + 7; j++){
      var c = cells[j];
      if (!c.d){ rowHtml += '<span class="dc-dp-cell" style="visibility:hidden">·</span>'; continue; }
      var ds = dstr(y, m, c.d);
      if (!firstDs) firstDs = ds;
      var ms = Date.parse(ds + "T00:00:00");
      var dis = ms < RANGE.msLo || ms > RANGE.msHi;
      var cls = [];
      if (ds === cur) cls.push("cur");
      else if (ds === today) cls.push("today");
      if (c.d === 1 && lead > 0) {}     /* 本月 1 日照常显示 */
      rowHtml += dpCell(c.d, 'data-d="' + ds + '"', cls.join(" "), dis);
    }
    if (weekMode){
      var hl = firstDs && isoWeekInfo(firstDs).y + "-W" + pad2(isoWeekInfo(firstDs).w) === scopeKey("week") ? " hl" : "";
      rows += '<div class="dc-dp-wrow' + hl + '">' + rowHtml + '</div>';
    } else {
      rows += '<div class="dc-dp-wrow">' + rowHtml + '</div>';
    }
  }
  return '<div class="dc-dp-grid" style="grid-template-columns:' + (weekMode ? "38px repeat(7,1fr)" : "repeat(7,1fr)") + '">' +
    '<div style="display:contents">' + head + '</div>' +
    '</div><div>' + rows + '</div>';
}
function dpMonthGrid(){
  var out = "", y = DP.y;
  for (var mi = 1; mi <= 12; mi++){
    var idx = dpMIdx(y, mi);
    var dis = idx < MIN_M || idx > MAX_M;
    out += dpCell(mi + "月", 'data-mi="' + mi + '"', (y === st.y && mi === st.m && st.mode === "month") ? "cur" : "", dis);
  }
  return '<div class="dc-dp-grid" style="grid-template-columns:repeat(3,1fr)">' + out + '</div>';
}
function dpYearGrid(){
  var start = Math.floor(DP.y / 10) * 10, out = "";
  for (var i = 0; i < 12; i++){
    var y = start + i;
    if (i < 10){
      var dis = y < RANGE.yLo || y > RANGE.yHi;
      out += dpCell(y, 'data-y="' + y + '"', (y === st.y && st.mode === "year") ? "cur" : "", dis);
    } else {
      out += '<span class="dc-dp-cell" style="visibility:hidden">·</span>';
    }
  }
  return '<div class="dc-dp-grid" style="grid-template-columns:repeat(3,1fr)">' + out + '</div>';
}
function renderDpPanel(){
  var mode = st.mode, lab = "", navL = "", navR = "", body = "";
  if (mode === "day" || mode === "week"){
    var mi = dpMIdx(DP.y, DP.m);
    lab = DP.y + "年 " + DP.m + "月";
    if (mode === "week"){
      /* 周面板：‹ › 直接翻周（±7 天），« » 翻月 */
      var wMs = Date.parse(DP.d + "T00:00:00");
      var pwDis = wMs - 604800000 < RANGE.msLo || wMs - 604800000 > RANGE.msHi;
      var nwDis = wMs + 604800000 < RANGE.msLo || wMs + 604800000 > RANGE.msHi;
      navL = '<button type="button" class="dc-dp-nav" data-nav="pm" title="上一月"' + (mi <= MIN_M ? " disabled" : "") + '>«</button>' +
             '<button type="button" class="dc-dp-nav" data-nav="pw" title="上一週"' + (pwDis ? " disabled" : "") + '>‹</button>';
      navR = '<button type="button" class="dc-dp-nav" data-nav="nw" title="下一週"' + (nwDis ? " disabled" : "") + '>›</button>' +
             '<button type="button" class="dc-dp-nav" data-nav="nm" title="下一月"' + (mi >= MAX_M ? " disabled" : "") + '>»</button>';
    } else {
      navL = '<button type="button" class="dc-dp-nav" data-nav="py" title="上一年">«</button>' +
             '<button type="button" class="dc-dp-nav" data-nav="pm" title="上一月"' + (mi <= MIN_M ? " disabled" : "") + '>‹</button>';
      navR = '<button type="button" class="dc-dp-nav" data-nav="nm" title="下一月"' + (mi >= MAX_M ? " disabled" : "") + '>›</button>' +
             '<button type="button" class="dc-dp-nav" data-nav="ny" title="下一年">»</button>';
    }
    body = dpDayGrid(mode === "week");
  } else if (mode === "month"){
    lab = DP.y + "年";
    navL = '<button type="button" class="dc-dp-nav" data-nav="pm" title="上一年"' + (DP.y <= +RANGE.min.slice(0,4) ? " disabled" : "") + '>‹</button>';
    navR = '<button type="button" class="dc-dp-nav" data-nav="nm" title="下一年"' + (DP.y >= +RANGE.max.slice(0,4) ? " disabled" : "") + '>›</button>';
    body = dpMonthGrid();
  } else {
    var dec = Math.floor(DP.y / 10) * 10;
    lab = dec + " – " + (dec + 9);
    navL = '<button type="button" class="dc-dp-nav" data-nav="pm" title="上个十年"' + (dec - 1 > RANGE.yHi || dec + 9 < RANGE.yLo ? "" : (dec <= RANGE.yLo - 10 ? " disabled" : "")) + '>‹</button>';
    navR = '<button type="button" class="dc-dp-nav" data-nav="nm" title="下个十年"' + (dec + 10 > RANGE.yHi ? " disabled" : "") + '>›</button>';
    body = dpYearGrid();
  }
  document.getElementById("dpPanel").innerHTML =
    '<div class="dc-dp-hd">' + navL + '<span class="dc-dp-lab">' + lab + '</span>' + navR + '</div>' +
    body +
    '<div class="dc-dp-ft"><button type="button" data-latest="1" title="跳到数据最新日期">回最新</button></div>';
}
function dpPickDay(ds){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
  var ms = Date.parse(ds + "T00:00:00");
  if (ms < RANGE.msLo || ms > RANGE.msHi) return;      /* 范围外禁用 */
  st.y = +ds.slice(0, 4); st.m = +ds.slice(5, 7); st.d = +ds.slice(8, 10);
  dpClose(); render();
}
document.getElementById("dpTrigger").addEventListener("click", function(){
  if (DP.open) dpClose(); else dpOpen();
});
document.addEventListener("click", function(e){
  var t = e && e.target;
  if (t && t.closest && !t.closest("#dp") && DP.open) dpClose();
});
document.getElementById("dpPanel").addEventListener("click", function(e){
  /* 面板内点击不外抛：重渲染 innerHTML 会 detachment 原目标，
   * document 的外点关闭监听拿到已脱离 DOM 的节点 closest("#dp") 落空 → 面板误关闭（周面板翻页闪退的根因） */
  if (e && e.stopPropagation) e.stopPropagation();
  var b;
  if ((b = e.target.closest("[data-latest]"))){
    var mx = RANGE.max;
    st.y = +mx.slice(0, 4); st.m = +mx.slice(5, 7); st.d = +mx.slice(8, 10);
    dpClose(); render(); return;
  }
  if ((b = e.target.closest("[data-d]"))){ dpPickDay(b.getAttribute("data-d")); return; }
  if ((b = e.target.closest("[data-w]"))){ dpPickDay(b.getAttribute("data-w")); return; }
  if ((b = e.target.closest("[data-mi]"))){
    var mi = +b.getAttribute("data-mi");
    if (dpMIdx(DP.y, mi) < MIN_M || dpMIdx(DP.y, mi) > MAX_M) return;
    st.y = DP.y; st.m = mi; st.d = 1;
    dpClose(); render(); return;
  }
  if ((b = e.target.closest("[data-y]"))){
    var y = +b.getAttribute("data-y");
    if (y < RANGE.yLo || y > RANGE.yHi) return;
    st.y = y; st.m = 1; st.d = 1;
    dpClose(); render(); return;
  }
  if ((b = e.target.closest("[data-nav]"))){
    var nav = b.getAttribute("data-nav");
    if (nav === "pw" || nav === "nw"){                        /* 周面板 ±7 天翻周 */
      var ms = Date.parse(DP.d + "T00:00:00") + (nav === "pw" ? -7 : 7) * 86400000;
      if (ms < RANGE.msLo || ms > RANGE.msHi) return;
      var nd = new Date(ms);
      DP.d = dstr(nd.getFullYear(), nd.getMonth() + 1, nd.getDate());
      DP.y = nd.getFullYear(); DP.m = nd.getMonth() + 1;
    } else {
      if (nav === "pm"){ DP.m--; if (DP.m < 1){ DP.m = 12; DP.y--; } }
      if (nav === "nm"){ DP.m++; if (DP.m > 12){ DP.m = 1; DP.y++; } }
      if (nav === "py"){ DP.y--; }
      if (nav === "ny"){ DP.y++; }
      var dmax = daysInMonth(DP.y, DP.m), dcur = +DP.d.slice(8, 10);   /* 浏览日跟随到新月份（钳制溢出） */
      if (dcur > dmax) DP.d = dstr(DP.y, DP.m, dmax); else DP.d = dstr(DP.y, DP.m, dcur);
    }
    renderDpPanel();
  }
});
/* 日历点击：日格 → 下钻/切换到该日（天口径）；年视图月卡 → 下钻到该月（月口径）
 * 同口径内点击也要重渲染（setMode 同值会提前返回） */
document.getElementById("cal").addEventListener("click", function(e){
  var day = e.target.closest("[data-d]");
  if (day){
    var parts = day.getAttribute("data-d").split("-");
    st.y = +parts[0]; st.m = +parts[1]; st.d = +parts[2];
    if (st.mode === "day") render(); else setMode("day");
    return;
  }
  var mc = e.target.closest("[data-m]");
  if (mc){
    st.m = +mc.getAttribute("data-m");
    st.d = 1;
    if (st.mode === "month") render(); else setMode("month");
  }
});

/* ---- 初始化：fetch 预计算产物 → 锚点 = 最新有胜场的日期；失败/空数据显示对应状态 ---- */
(function init(){
  fetch(YJ_DATA.url("datechart.json")).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(data){
    RUNS = (data && data.runs) || [];
    if (!RUNS.length){
      document.getElementById("cal").innerHTML = "";
      document.getElementById("kpis").innerHTML = "";
      document.getElementById("dBody").innerHTML = '<div class="hint-empty">暂无出走记录</div>';
      return;
    }
    computeRange();
    dpRange();
    var lastWin = null;
    RUNS.forEach(function(r){ if (r.p === 1 && (!lastWin || r.d > lastWin.d)) lastWin = r; });
    var base = lastWin || RUNS[RUNS.length - 1];
    st.y = +base.d.slice(0, 4); st.m = +base.d.slice(5, 7); st.d = +base.d.slice(8, 10);
    render();
  }).catch(function(e){
    document.getElementById("cal").innerHTML = "";
    document.getElementById("kpis").innerHTML = "";
    document.getElementById("dBody").innerHTML =
      '<div class="hint-empty">数据加载失败（' + esc(e.message) + '），请通过 http 服务器访问</div>';
  });
})();
</script>
